# The headless bridge consumes an ordinary queued order. Before the fix it wrote the
# approved seats and raid jobs, even with an under-level member. With the fix it
# names that member and leaves the order queued, with neither write.
# Control bridge: 2c739ea3e223cff6fbafcf49aeb9a941fd56c93d.
decree: v1
id: molten-core-order-refuses-unavailable
proves:
  - {repo: quadseven/wow-overseer, issue: 2104, criterion: "In a disposable world, an ordinary Molten Core queue order refuses an under-level approved seat without writing seats or raid jobs"}
fix: {repo: quadseven/wow-overseer, commit: "74ce7e70223611dc5b166d40335d204e3b73b8cb"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 5m
cast:
  - who: Grug
    set: {level: 60, alive: true, at: {areatrigger: 2886}}
    ceiling: "level 60 and position in the disposable world"
  - who: Ugga
    set: {level: 49, alive: true, at: {areatrigger: 2886}}
    ceiling: "level 49 and position in the disposable world"
act:
  - at: 0s
    raid_order: {family: Grug}
observe:
  - name: cast-online
    role: precondition
    when: start
    online: cast
  - name: both-approved-characters-have-the-fixture-levels
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM characters c
      JOIN overseer_roster r ON r.name = c.name
      JOIN guild_member gm ON gm.guid = c.guid
      JOIN guild_member head_gm ON head_gm.guid = @cast0 AND head_gm.guildid = gm.guildid
      WHERE r.family = 'Grug' AND r.enabled = 1
        AND ((c.guid = @cast0 AND c.level = 60) OR (c.guid = @cast1 AND c.level = 49))
    expect: {scalar: "= 2"}
  - name: family-queue-starts-empty
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_queue
      WHERE (family = 'Grug' AND status IN ('queued', 'active')) OR source = 'eph-raid-order'
    expect: {scalar: "= 0"}
  - name: no-pending-family-molten-core-job
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_command c
      JOIN overseer_roster r ON r.name = c.target_name
      WHERE r.family = 'Grug' AND c.kind = 'job' AND c.command = 'raid:moltencore'
        AND c.status IN ('pending', 'claimed', 'verifying')
    expect: {scalar: "= 0"}
  - name: the-fixture-order-was-written
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_queue
      WHERE family = 'Grug' AND keyword = 'moltencore' AND source = 'eph-raid-order'
        AND runs_wanted = 1 AND created_at >= @t0
    expect: {scalar: "= 1"}
  - name: bridge-consumed-the-fixture-order
    role: precondition
    when: end
    log: {pattern: "wow-overseer INFO (?:queue: Grug's family: withheld: Molten Core refused: [1-9][0-9]* of [1-9][0-9]* approved members unavailable: .*\\bUgga \\(level 49; needs 50\\)|raid: Grug's family ordered into moltencore - [1-9][0-9]* seats written in [1-9][0-9]* groups, [1-9][0-9]* job row\\(s\\) of [1-9][0-9]*\\.)", expect: {at_least: 1}}
  - name: refusal-names-the-under-level-approved-member
    role: check
    log: {pattern: "wow-overseer INFO queue: Grug's family: withheld: Molten Core refused: [1-9][0-9]* of [1-9][0-9]* approved members unavailable: .*\\bUgga \\(level 49; needs 50\\)", expect: {at_least: 1}}
  # The forge keeps old seats. The judge takes @t0 from MySQL before the act.
  - name: no-family-molten-core-seat-was-written-during-the-run
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_raid_seat
      WHERE family = 'Grug' AND keyword = 'moltencore' AND written_at >= @t0
    expect: {scalar: "= 0"}
  - name: no-molten-core-raid-job-was-written-by-the-queue
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command c
      JOIN overseer_roster r ON r.name = c.target_name
      WHERE r.family = 'Grug' AND c.kind = 'job' AND c.command = 'raid:moltencore'
        AND c.source = 'overseer:queue' AND c.created_at >= @t0
    expect: {scalar: "= 0"}
  - name: refused-order-is-still-queued
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_queue
      WHERE family = 'Grug' AND keyword = 'moltencore' AND source = 'eph-raid-order'
        AND status = 'queued' AND started_at IS NULL AND created_at >= @t0
    expect: {scalar: "= 1"}
