# A guild stand-in seated in a family: when the walk out fails the guest hearths home (mod-overseer issue
# 1427), when it is released inside a finder group it does not whisper the head every poll (issue 1437), and
# when its seat ends while the head is mid-hearth it leaves the family party and hearths within two minutes
# (issue 1450). Og is dead beside the first boss, so the bridge's stand-in pass seats a guild guest; the
# head hearths mid-run to end the seat.
# Scope: the 'left the family party' line is module log text, so it is not asserted. The run must have ended
# with an exit hearth (an event row) before the guest is read off the dungeon map; the guest must be in no group
# led by the family at the end (it left the party, read from the group tables); and no guest sends a second
# hello whisper (one greeting per guest is the upstream behaviour, a repeat is the defect).
# Issue 1450 (the guest leaves promptly, within about two minutes of its seat ending) is dropped from proves: no
# row ties the guest's membership and seat end to the head's hearth, so the timing cannot be shown. The end-state
# group check stays as supporting evidence for issues 1427 and 1437 only.
# Fix: mod-overseer pull 1451 (a released stand-in guest leaves the family group).
decree: v1
id: standin-guest-hearths-and-leaves
proves:
  - {repo: quadseven/mod-overseer, issue: 1427, criterion: "no stand-in guest is left on a dungeon map after its family's run ended with EXIT HEARTH"}
  - {repo: quadseven/mod-overseer, issue: 1437, criterion: "a stand-in released inside a finder group sends no repeated hello whispers"}
fix: {repo: quadseven/mod-overseer, commit: "96eac42ee9bc2d0116fe05d204ce973ae551fa07"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 1h
cast:
  - who: family:grug
    set: {alive: true, health_pct: 100, at: {areatrigger: 1466}}
    ceiling: "nothing granted but position"
  - who: Og
    set: {alive: false, corpse_at: {creature: "Lord Roccor"}, at: {graveyard: 1469}}
    ceiling: "nothing granted; the missing seat is the scenario"
arrange:
  - instance: {map: "Blackrock Depths", as: brd, bind: family:grug}
  - group: {members: family:grug, leader: Grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "dungeon:blackrock-depths"}
  - at: 15m
    command: {who: Grug, kind: hearth, text: "hearth"}
observe:
  - name: a-seat-is-empty
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM corpse WHERE guid = @Og
    expect: {scalar: "= 1"}
  - name: a-stand-in-was-seated
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_family_standin WHERE family = 'Grug' AND created_at >= @t0
    expect: {scalar: ">= 1"}
  # The judge needs the core's own credited-encounter record when an instance is arranged.
  - name: encounter-credited
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM log_encounter
      WHERE map = 230 AND time >= @t0
    expect: {scalar: ">= 1"}
  - name: the-run-ended-with-an-exit-hearth
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_run_event WHERE family = 'Grug' AND created_at >= @t0 AND kind = 'exit_hearth'
    expect: {scalar: ">= 1"}
  - name: no-repeated-hello-whispers
    role: check
    when: end
    sql: |
      SELECT sender_name, COUNT(*) FROM overseer_chat
      WHERE created_at >= @t0 AND (text LIKE '%I follow you%' OR text LIKE '%lead the way%')
      GROUP BY sender_name HAVING COUNT(*) > 1
    expect: {rows: 0}
  - name: no-guest-left-on-the-dungeon-map
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot s JOIN overseer_family_standin f ON f.in_name = s.name WHERE f.family = 'Grug' AND f.created_at >= @t0 AND s.map_id = 230
    expect: {scalar: "= 0"}
  - name: no-guest-is-still-in-a-family-group
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_family_standin f
      JOIN characters g ON g.name = f.in_name
      JOIN group_member gm ON gm.memberGuid = g.guid
      JOIN `groups` gr ON gr.guid = gm.guid
      WHERE f.family = 'Grug' AND f.created_at >= @t0 AND gr.leaderGuid IN (@cast)
    expect: {scalar: "= 0"}
