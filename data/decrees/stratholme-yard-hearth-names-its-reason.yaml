# A Stratholme yard hearth log uses the yard-specific reason (mod-overseer issue
# 1276), on a credited Stratholme run.
# Oracle: issue 1276's live acceptance requires the log to carry the phrase
# "leaving the Stratholme exit yard"; pull 1280 supplies its log context.
# Fix: mod-overseer pull 1280.
decree: v1
id: stratholme-yard-hearth-names-its-reason
proves:
  - {repo: quadseven/mod-overseer, issue: 1276, criterion: "a Stratholme yard hearth log names leaving the Stratholme exit yard as its reason"}
fix: {repo: quadseven/mod-overseer, commit: "1d7ab3ee8ed5e41698349e810c64ce16d362e3da"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 1h
cast:
  - who: family:grug
    set: {alive: true, health_pct: 100, at: {captured: stratholme-exit-yard-button}}
    ceiling: "nothing granted but position"
arrange:
  - group: {members: family:grug, leader: Grug}
  - instance: {map: "Stratholme", as: strat, bind: family:grug}
act:
  - at: 90s
    roster: {who: family:grug, job: "dungeon:stratholme-live"}
observe:
  - name: encounter-credited
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM log_encounter
      WHERE map = 329 AND time >= @t0
    expect: {scalar: ">= 1"}
  - name: the-yard-hearth-line-names-the-yard
    role: check
    log:
      pattern: "leaving the Stratholme exit yard"
      expect: {at_least: 1}
