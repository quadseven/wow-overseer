# A guild run at level 52 or more formed by the social pass names each seated raider's chosen upgrade
# (wow-overseer issue 760) and prefers a dungeon that drops a raid recipe nobody in the guild knows (issue
# 893). Evidence is the guild-run row for a 52+ dungeon plus the guild-ask rows, not a log quote.
# Scope: the bridge log naming each seated raider's chosen upgrade (issue 760) is text a decree can only
# forbid, so it is NOT asserted and 760 is dropped from proves. Issue 893 is read from rows and tied together:
# at the start no Cave member knows Greater Fire Protection Potion (spell 17574), and the recipe guild-ask must
# belong to the guild run that formed for a 52+ dungeon in this window (joined on the run id).
# The 52+ door is read as blackrock-depths only, the one door with a level 52 band; the other keywords are
# 55 to 60 doors and no longer satisfy the run row or the recipe ask join.
# Fixes: wow-overseer pulls 1418 (upgrades) and 910 (recipe preference); the commit is 1418.
decree: v1
id: guild-run-52-plus-upgrades-and-recipes
proves:
  - {repo: quadseven/wow-overseer, issue: 893, criterion: "a 52+ guild run is chosen for a raid recipe nobody in the guild knows: the recipe ask belongs to the run (the upgrades log of issue 760 is not asserted here)"}
fix: {repo: quadseven/wow-overseer, commit: "00cfd37b09a9b1f8affb0c5f3766418fbd44301d"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 3h
cast:
  - who: guild:Cave:blacksmith
    set: {alive: true, at: {areatrigger: 1466}}
    ceiling: "nothing granted but position"
  - who: guild:Cave:alchemist
    set: {alive: true, at: {areatrigger: 1466}}
    ceiling: "nothing granted but position"
act:
  - at: 0s
    command: {who: "cast[0]", kind: guild, text: "run blackrock-depths"}
observe:
  - name: guild-members-are-level-52-or-more
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM characters WHERE guid IN (@cast) AND level >= 52
    expect: {scalar: ">= 1"}
  - name: nobody-in-the-guild-knows-the-recipe-at-the-start
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_spell cs JOIN guild_member gm ON gm.guid = cs.guid JOIN guild g ON g.guildid = gm.guildid
      WHERE g.name = 'Cave' AND cs.spell = 17574
    expect: {scalar: "= 0"}
  - name: a-52-plus-guild-run-formed
    role: check
    when: end
    sql: |
      SELECT id, keyword FROM overseer_guild_run WHERE created_at >= @t0 AND keyword = 'blackrock-depths'
    expect: {rows: ">= 1"}
  - name: the-recipe-ask-belongs-to-the-guild-run
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_guild_ask a JOIN overseer_guild_run r ON r.id = a.run_id
      WHERE a.created_at >= @t0 AND a.reason LIKE '%Recipe%'
        AND r.created_at >= @t0 AND r.keyword = 'blackrock-depths'
    expect: {scalar: ">= 1"}
