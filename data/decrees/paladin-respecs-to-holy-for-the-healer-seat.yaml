# A level 60 Retribution paladin who holds a Holy healer seat walks to a paladin
# trainer, pays the talent reset from its own gold, ends in the Holy tree and
# plays the healing strategy (wow-overseer issue 2770, the Molten Core healer gap).
#
# Cave had two healers at level 50 or more against a first-kill quorum of eight,
# and all six of its level 60 paladins were seated Retribution. The owner chose
# three of them to change trees by the natural path only. The module already
# buys the reset (walk-to-trainer talents, mod-overseer issue 692); nothing wrote
# the row until healerrespec.py. The control image has no such pass, so no walk
# row is written and every check fails; the treatment image writes it.
#
# The tree is read off character_talent: the Holy and Retribution paladin rank
# spells from talents.json, so Holy minus Retribution is negative before and
# positive after. The healing strategy is read back with a probe once the walk
# is over: the playerbots reset rebuilds the strategies from the new talents, so
# a Holy paladin lists "holy" among its combat strategies.
#
# The gold is a seed on a throwaway world only; the reset price is the core's
# own and is taken from it at the trainer, which the money check shows.
decree: v1
id: paladin-respecs-to-holy-for-the-healer-seat
proves:
  - {repo: quadseven/wow-overseer, issue: 2770, criterion: "a level 60 paladin with gold ends Holy with the heal strategy and less gold"}
fix: {repo: quadseven/wow-overseer, commit: f9ef6503439177b9bcd8d2a157393e0234cf3162}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 30m
cast:
  - who: Embo
    set:
      level: 60
      alive: true
      money: 500000
      at: {creature: "Lord Grayson Shadowbreaker"}
    ceiling: "level 60 and 50 gold on a throwaway world only; the talent reset is paid by the character"
act:
  - at: 20m
    command: {who: "cast[0]", kind: probe, text: "strategies"}
observe:
  - name: the-cast-is-level-60-with-gold
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM characters WHERE guid IN (@cast) AND level = 60 AND money >= 500000
    expect: {scalar: "= 1"}
  - name: it-plays-retribution-at-the-start
    role: precondition
    when: start
    sql: |
      SELECT SUM(CASE WHEN spell IN (5923,5924,5925,5926,9453,20205,20206,20207,20208,20209,20210,20212,20213,20214,20215,20216,20224,20225,20234,20235,20237,20238,20239,20244,20245,20254,20255,20256,20257,20258,20259,20260,20261,20330,20331,20332,20359,20360,20361,20473,25829,25836,31821,31822,31823,31825,31826,31828,31829,31830,31833,31835,31836,31837,31838,31839,31840,31841,31842,53551,53552,53553,53556,53557,53563,53569,53576,53660,53661,53671,53673,54151,54154,54155) THEN 1 ELSE 0 END) - SUM(CASE WHEN spell IN (9452,9799,20042,20045,20049,20056,20057,20060,20061,20062,20063,20064,20066,20101,20102,20103,20104,20105,20111,20112,20113,20117,20118,20119,20120,20121,20335,20336,20337,20375,25956,25957,25988,26016,26022,26023,31866,31867,31868,31869,31871,31872,31876,31877,31878,31879,31880,31881,32043,35395,35396,35397,53375,53376,53379,53380,53381,53382,53385,53484,53486,53488,53501,53502,53503,53648) THEN 1 ELSE 0 END) FROM character_talent WHERE guid = @cast0
    expect: {scalar: "< 0"}
  - name: the-bridge-wrote-the-talent-walk
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE target_name = 'Embo' AND source = 'healerrespec:Embo' AND command LIKE 'walk-to-trainer talents:%'
    expect: {scalar: ">= 1"}
  - name: the-trainer-visit-was-read-back-as-applied
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE target_name = 'Embo' AND source = 'healerrespec:Embo' AND status = 'applied'
    expect: {scalar: ">= 1"}
  - name: it-ends-in-the-holy-tree
    role: check
    when: end
    sql: |
      SELECT SUM(CASE WHEN spell IN (5923,5924,5925,5926,9453,20205,20206,20207,20208,20209,20210,20212,20213,20214,20215,20216,20224,20225,20234,20235,20237,20238,20239,20244,20245,20254,20255,20256,20257,20258,20259,20260,20261,20330,20331,20332,20359,20360,20361,20473,25829,25836,31821,31822,31823,31825,31826,31828,31829,31830,31833,31835,31836,31837,31838,31839,31840,31841,31842,53551,53552,53553,53556,53557,53563,53569,53576,53660,53661,53671,53673,54151,54154,54155) THEN 1 ELSE 0 END) - SUM(CASE WHEN spell IN (9452,9799,20042,20045,20049,20056,20057,20060,20061,20062,20063,20064,20066,20101,20102,20103,20104,20105,20111,20112,20113,20117,20118,20119,20120,20121,20335,20336,20337,20375,25956,25957,25988,26016,26022,26023,31866,31867,31868,31869,31871,31872,31876,31877,31878,31879,31880,31881,32043,35395,35396,35397,53375,53376,53379,53380,53381,53382,53385,53484,53486,53488,53501,53502,53503,53648) THEN 1 ELSE 0 END) FROM character_talent WHERE guid = @cast0
    expect: {scalar: "> 0"}
  - name: it-paid-the-trainer-from-its-own-purse   # a real purchase moves money
    role: check
    when: end
    sql: |
      SELECT @money_start - money FROM characters WHERE guid = @cast0
    expect: {scalar: "> 0"}
  - name: it-plays-the-healing-strategy
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE target_name = 'Embo' AND kind = 'probe' AND command = 'strategies' AND result LIKE '%"holy"%'
    expect: {scalar: ">= 1"}
