# A Blackrock Depths guild run whose five seats all have the attunement quest done goes on past
# Gerstahn (wow-overseer issue 783). Five Cave guild members stand beside Franclorn Forgewright with the
# attunement state set.
# Scope: five seats carry the attunement state (one guild member per crafting role, five distinct guids
# required by the first precondition, so a role that resolves to the same member twice ends INVALID). The
# seated count of the run row and the log lines naming the member are not asserted: the first is not a column
# a decree can read as a number and the second is text a decree can only forbid. Issue 811 (a guild member
# takes the Dark Iron Legacy quest and carries the Shadowforge Key) is not arranged here: it needs the bridge
# itself to choose the take, which a decree cannot show, so no ghost, take command or key check is in this
# decree. The naming line: wow-overseer#2767.
# Fix: wow-overseer pull 1966.
decree: v1
id: guild-brd-keyed-wing
proves:
  - {repo: quadseven/wow-overseer, issue: 783, criterion: "a BRD guild run whose five seats all have the attunement quest done goes through Gerstahn and on, with bosses_done above 1 (the seat count of the row is not asserted here)"}
fix: {repo: quadseven/wow-overseer, commit: "9885acc6e64a3776a41950eeebf945aa08c546e9"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 2h
cast:
  - who: guild:Cave:blacksmith
    set: {alive: true, quests: {3801: rewarded, 3802: rewarded}, at: {creature: "Franclorn Forgewright"}}
    ceiling: "only the attunement quest states the run asks for; no level, item or gold"
  - who: guild:Cave:miner
    set: {alive: true, quests: {3801: rewarded, 3802: rewarded}, at: {creature: "Franclorn Forgewright"}}
    ceiling: "only the attunement quest states the run asks for; no level, item or gold"
  - who: guild:Cave:alchemist
    set: {alive: true, quests: {3801: rewarded, 3802: rewarded}, at: {creature: "Franclorn Forgewright"}}
    ceiling: "only the attunement quest states the run asks for; no level, item or gold"
  - who: guild:Cave:tailor
    set: {alive: true, quests: {3801: rewarded, 3802: rewarded}, at: {creature: "Franclorn Forgewright"}}
    ceiling: "only the attunement quest states the run asks for; no level, item or gold"
  - who: guild:Cave:cook
    set: {alive: true, quests: {3801: rewarded, 3802: rewarded}, at: {creature: "Franclorn Forgewright"}}
    ceiling: "only the attunement quest states the run asks for; no level, item or gold"
act:
  - at: 0s
    command: {who: "cast[0]", kind: guild, text: "run blackrock-depths"}
observe:
  - name: five-distinct-seats-carry-the-attunement-state
    role: precondition
    when: start
    sql: |
      SELECT COUNT(DISTINCT guid) FROM character_queststatus_rewarded WHERE guid IN (@cast) AND quest = 3802
    expect: {scalar: ">= 5"}
  - name: a-brd-guild-run-went-past-the-first-boss
    role: check
    when: end
    sql: |
      SELECT id, bosses_done FROM overseer_guild_run WHERE keyword = 'blackrock-depths' AND created_at >= @t0 AND bosses_done > 1
    expect: {rows: ">= 1"}
