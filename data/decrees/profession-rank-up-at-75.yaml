# A crafter stuck at skill 75 trains the next rank and keeps levelling.
# Needs the bridge, so it cannot run until the world pod can pull the bridge image.
decree: v1
id: profession-rank-up-at-75
proves:
  - {repo: quadseven/wow-overseer, issue: 774, criterion: "a crafter at 75 trains the next rank and keeps levelling"}
fix: {repo: quadseven/wow-overseer, commit: TODO}
world: {class: lean, image: follow-dev, bridge: on, random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 15m
cast:
  - who: guild:Cave:blacksmith
    set:
      level: 20
      skills: {Blacksmithing: {value: 75, max: 75}}
      money: 20000                      # enough for the trainer; a grant, legal only here
      items: [{name: "Copper Bar", count: 40}]
      at: {creature: "<the blacksmithing trainer named in the issue>"}
    ceiling: "the issue reports the crafter at 75 of 75 with mats in bags"
act:
  - at: 0s
    command: {who: "cast[0]", kind: job, text: "craft:blacksmithing"}
observe:
  - name: started-at-the-cap
    role: precondition
    when: end
    sql: "SELECT @seed_skill_value = 75 AND @seed_skill_max = 75"
    expect: {scalar: "= 1"}
  - name: rank-trained
    role: check
    when: end
    sql: |
      SELECT max FROM character_skills WHERE guid = @cast0 AND skill = @skill_blacksmithing
    expect: {scalar: "> 75"}
  - name: paid-the-trainer            # a real purchase moves money: the prove-a-sale rule
    role: check
    when: end
    sql: "SELECT @money_start - money FROM characters WHERE guid = @cast0"
    expect: {scalar: "> 0"}
  - name: skill-moved-past-75
    role: check
    when: end
    sql: |
      SELECT value FROM character_skills WHERE guid = @cast0 AND skill = @skill_blacksmithing
    expect: {scalar: "> 75"}
