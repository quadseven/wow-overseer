# Give Zug the training and copper for one ordinary belt cast. The bridge must
# choose the recipe and buy the hammer. Krinkle Goodsteel stocks the hammer
# and stands by an Anvil in the pinned world data.
decree: v1
id: smith-crafts-with-the-hammer
proves: 1590
box: "Live: a later craft event for a worn recipe spell (for example Runed Copper Belt, 2666) is recorded for that smith."
fix: {repo: quadseven/wow-overseer, commit: "d185b0106aca6026e1e724c687c69e436e4d2d15"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 45m
cast:
  - who: Zug
    set:
      alive: true
      at: {creature: "Krinkle Goodsteel"}
      skills: {Blacksmithing: {value: 110, max: 150}}
      spells_add: [3100, 2666]
      free_backpack_slots: 3
      items: [{name: "Copper Bar", count: 10}]
    ceiling: "Journeyman Blacksmithing, the belt recipe, and copper for one cast with space for the hammer and belt"
  - who: family:zug
    set: {alive: true, at: {creature: "Krinkle Goodsteel"}}
    ceiling: "Position only"
act:
  - at: 0s
    roster: {who: Zug, job: "craft"}
  - at: 0s
    roster: {who: family:zug, job: "craft"}
observe:
  - name: the-whole-cast-is-online
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot s JOIN characters c ON c.guid = s.guid
      WHERE s.guid IN (@cast) AND c.online = 1
    expect: {scalar: "= 5"}
  - name: zug-is-trained-for-the-belt
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_skills s JOIN character_spell p ON s.guid = p.guid
      WHERE s.guid = @cast0 AND s.skill = 164 AND s.value BETWEEN 110 AND 124 AND s.max = 150 AND p.spell = 2666
    expect: {scalar: "= 1"}
  - name: zug-has-copper-bars-in-bags
    role: precondition
    when: start
    sql: |
      SELECT COALESCE(SUM(i.count), 0) FROM character_inventory b JOIN item_instance i ON b.item = i.guid
      WHERE b.guid = @cast0 AND b.bag = 0 AND b.slot BETWEEN 23 AND 38 AND i.itemEntry = 2840
    expect: {scalar: ">= 10"}
  - name: zug-has-no-competing-smelt
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_skills s WHERE s.guid = @cast0 AND s.skill = 186 AND (
        (s.value BETWEEN 1 AND 69 AND EXISTS (
          SELECT 1 FROM item_instance i WHERE i.owner_guid = s.guid AND i.itemEntry = 2770
        )) OR (s.value BETWEEN 230 AND 300 AND EXISTS (
          SELECT 1 FROM character_spell p WHERE p.guid = s.guid AND p.spell = 14891
        ))
      )
    expect: {scalar: "= 0"}
  - name: zug-has-no-hammer
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE owner_guid = @cast0 AND itemEntry = 5956
    expect: {scalar: "= 0"}
  - name: zug-can-afford-a-hammer
    role: precondition
    when: start
    sql: |
      SELECT money FROM characters WHERE guid = @cast0
    expect: {scalar: ">= 18"}
  # The forge clears old samples, so this row witnesses a working headless
  # bridge. The first sample can precede the judge's own start clock.
  - name: the-headless-bridge-sampled-zug
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_sample
      WHERE character_name = 'Zug' AND taken_at >= DATE_SUB(@t0, INTERVAL 15 MINUTE)
    expect: {scalar: ">= 1"}
  - name: zugs-craft-job-was-applied
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command
      WHERE target_name = 'Zug' AND source = 'eph-judge' AND kind = 'job'
        AND command = 'craft' AND status = 'applied' AND created_at >= @t0
    expect: {scalar: ">= 1"}
  - name: exactly-one-hammer-buy-row
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command
      WHERE kind = 'buy' AND target_name = 'Zug' AND command LIKE 'entry:5956 %' AND created_at >= @t0
    expect: {scalar: "= 1"}
  - name: the-hammer-buy-was-delivered
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE kind = 'buy' AND target_name = 'Zug'
        AND command LIKE 'entry:5956 count:1 %' AND created_at >= @t0 AND status = 'delivered'
    expect: {scalar: "= 1"}
  - name: hammer-is-held-after
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE owner_guid = @cast0 AND itemEntry = 5956
    expect: {scalar: "= 1"}
  - name: zug-cast-belt-after-hammer-delivery
    role: check
    when: end
    # Delivery and the cast can share a database timestamp. The start check
    # excludes a pre-existing hammer and the spell requires one in the bags.
    sql: |
      SELECT COUNT(*) FROM overseer_event e JOIN overseer_command c ON e.last_seen >= c.updated_at
      WHERE e.character_guid = @cast0 AND e.kind = 'craft' AND e.subject_id = 2666 AND e.last_seen >= @t0
        AND c.target_name = 'Zug' AND c.kind = 'buy' AND c.command LIKE 'entry:5956 count:1 %'
        AND c.status = 'delivered' AND c.created_at >= @t0
    expect: {scalar: "> 0"}
