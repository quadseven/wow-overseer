# Scope note: only the ten roster characters can be cast by name, so this decree runs the raid with
# ten seats. The 40-seat case in the issue is not representable here; the check is the per-seat behaviour.
# The seats come from overseer_raid_seat, which the bridge writes from an operator order, so the first
# precondition witnesses them: a world with no seats is INVALID, never a pass.
# A seat is left at Ratchet on Kalimdor while the rest stand at the Molten Core door. A warlock of the guild
# stands at the Blackrock Mountain meeting stone. The run must summon the straggler (mod-overseer issue 922)
# and, where the leader cannot reach the door, a guild warlock must click the ritual and spend the reagent
# (issue 702, not asserted: see Scope).
# Scope: the summon and read-back lines (issue 922) are worldserver log text and a log assertion is an exact
# count that cannot demand presence, so the lines are not asserted. The straggler's position read back at the
# door IS proven by rows: the summon row names Zug, is applied, and Zug ends inside Molten Core or within 40
# yards of the door. The ritual click path and reagent consumption (issue 702) need a before and after of a
# shard count, and a decree has no start-state variable for an item count, so issue 702 is not claimed here.
# Fixes: mod-overseer pulls 929 (straggler summon) and 698 (ritual rung); the commit is 929.
decree: v1
id: raid-straggler-summon-at-stone
proves:
  - {repo: quadseven/mod-overseer, issue: 922, criterion: "an applied summon row names the straggler and the straggler ends at the door by position (the log lines are not asserted here)"}
fix: {repo: quadseven/mod-overseer, commit: "7960824c4e42b2872189a634e084c7351fd0554f"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 1h
cast:
  - who: family:grug
    set: {alive: true, at: {areatrigger: 2886}}
    ceiling: "nothing granted but position"
  - who: Zug
    set: {alive: true, at: {creature: "Gazlowe"}}
    ceiling: "nothing granted but position"
  - who: Workwork
    set: {alive: true, at: {captured: brm-meeting-stone}}
    ceiling: "nothing granted but position"
arrange:
  - group: {members: family:grug, leader: Grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "raid:moltencore"}
observe:
  - name: seats-were-written
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_raid_seat WHERE family IN ('Grug', 'Zug')
    expect: {scalar: ">= 5"}
  - name: straggler-starts-on-kalimdor
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM characters WHERE guid = @Zug AND map = 1
    expect: {scalar: "= 1"}
  - name: summon-row-applied-for-the-straggler
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE kind = 'summon' AND target_name = 'Zug' AND created_at >= @t0 AND status = 'applied'
    expect: {scalar: ">= 1"}
  - name: straggler-is-inside-the-raid-or-at-the-door
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM characters ch
      JOIN acore_world.areatrigger a ON a.entry = 2886
      WHERE ch.guid = @Zug
        AND (ch.map = 409 OR (ch.map = a.map AND POW(ch.position_x - a.x, 2) + POW(ch.position_y - a.y, 2) <= 1600))
    expect: {scalar: "= 1"}
  - name: no-summon-for-the-straggler-was-refused
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE kind = 'summon' AND target_name = 'Zug' AND created_at >= @t0 AND status = 'error'
    expect: {scalar: "= 0"}
