# A family blacksmith on job craft with no Blacksmith Hammer in bags or bank handles the tool
# material-request: exactly one kind buy row for item 5956 in the town errand table, none while it is held
# (wow-overseer issues 1516 and 1590). Zug is the smith: the family's one blacksmith who carries no hammer in
# the template. A decree cannot take an item away, only choose a character who lacks it, so Zug and not Grug
# (who carries one). The first precondition witnesses the empty bag, so a template that hands him a hammer is
# INVALID, never a pass. He stands beside a vendor that stocks the hammer, in the same town.
# The job is a family-wide setting, so the whole family is put on it and stands in the same town; the `craft`
# keyword is the whole job (the smith's standing recipe is the bridge's own choice). The act waits for the
# cast to be online, because a job row for a character who is not online is refused.
# Scope: the buy row must be DELIVERED (a failed request no longer counts), there must be exactly one row for
# the hammer in the window, and the hammer must be held at the end. The later craft event for a worn recipe is
# not claimed: a 45 minute treatment run bought, delivered and held the hammer but recorded no craft event for
# the smith, so that second live box of issue 1590 stays unasserted here.
# Issue 1516 (the material-request consumer) is dropped from proves: no row records a material-request event
# for item 5956, so a decree cannot show the buy handled that request and not a generic craft-planner buy
# (wow-overseer#2767 covers the log side). Only issue 1590 is claimed.
# Fixes: wow-overseer pulls 1878 (hammer purchase) and 1597 (worn recipes); the commit is 1878.
decree: v1
id: smith-without-a-hammer-buys-one
proves: 1590
box: "Live: on the dev realm a job craft smith with no hammer gets exactly one kind buy row for item 5956 in the town errand table, and no second one while it is held."
fix: {repo: quadseven/wow-overseer, commit: "ac6cba9a04590c9d2cdd673dfb07fdf2d5e7d527"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 45m
cast:
  - who: Zug
    set: {alive: true, at: {creature: "Krinkle Goodsteel"}}
    ceiling: "nothing granted but position"
  - who: family:zug
    set: {alive: true, at: {creature: "Krinkle Goodsteel"}}
    ceiling: "nothing granted but position"
act:
  # The family's first planning pass sends a family whose head is idle to a dungeon, and it rewrites every
  # member's job, so the head is put on the job too (a named cast member is not part of `family:zug`).
  - at: 0s
    roster: {who: Zug, job: "craft"}
  - at: 0s
    roster: {who: family:zug, job: "craft"}
observe:
  # The act is read the moment the judge starts, before the headless roster has logged in, and a job row for a
  # character who is not online is refused ("target not online"). The judge holds the act until every start
  # precondition holds, so this one makes it wait for the whole cast to be in the world.
  - name: the-whole-cast-is-online
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE guid IN (@cast)
    expect: {scalar: "= 5"}
  - name: zug-has-no-hammer
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE owner_guid = @cast0 AND itemEntry = 5956
    expect: {scalar: "= 0"}
  - name: exactly-one-hammer-buy-row
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE kind = 'buy' AND target_name = 'Zug' AND command LIKE 'entry:5956 %' AND created_at >= @t0
    expect: {scalar: "= 1"}
  - name: the-hammer-buy-was-delivered
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE kind = 'buy' AND target_name = 'Zug' AND command LIKE 'entry:5956 %' AND created_at >= @t0 AND status = 'delivered'
    expect: {scalar: "= 1"}
  - name: hammer-is-held-after
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE owner_guid = @cast0 AND itemEntry = 5956
    expect: {scalar: "= 1"}
