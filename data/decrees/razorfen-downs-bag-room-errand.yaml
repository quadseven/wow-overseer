# A family whose campaign door is Razorfen Downs with the head at zero free bag slots runs the bag-room
# errand to a hub on its own continent (a Kalimdor aim), not across the sea to the capital on map 0, and
# the errand ends in time (wow-overseer issues 1420 and 1451). The head starts inside Razorfen Downs.
# Zero free slots is a state a decree cannot set; the family is cast with no seeded bags and the
# precondition reads the template's bag state, so a template with room is INVALID.
# Fix: wow-overseer pull 1474 (the capital is looked up on the instance's continent).
# Scope: the bridge's GO_SECONDS timer is read only from its log, so the 20 minute bound on the errand itself is
# not asserted; the family must instead be back in a Razorfen Downs run within the hour of the errand aim
# (issue 1420), and the aim must be on map 1 (an at:1: row) with none on map 0 (issue 1451). An errand that
# crosses the sea, or never returns, fails.
# The full class gives the worldserver the larger memory limit: the template loads every family, and a
# lean worldserver was OOMKilled at 3584Mi on the other Razorfen Downs decree.
decree: v1
id: razorfen-downs-bag-room-errand
proves:
  - {repo: quadseven/wow-overseer, issue: 1420, criterion: "a bag-room errand from a Razorfen Downs door picks a hub on its own continent and the family is back at the door within the hour"}
  - {repo: quadseven/wow-overseer, issue: 1451, criterion: "the errand aims a hub on map 1 and none on map 0 for the Razorfen Downs family (the GO_SECONDS bound is not asserted here, only the return within the hour)"}
fix: {repo: quadseven/wow-overseer, commit: "fd3983d27f79c6bffba3bb22844345a19f518829"}
world: {class: full, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 90m
cast:
  - who: family:grug
    set: {alive: true, health_pct: 100, at: {creature: "Amnennar the Coldbringer"}}
    ceiling: "nothing granted but position"
arrange:
  - group: {members: family:grug, leader: Grug}
  - instance: {map: "Razorfen Downs", as: rfd, bind: family:grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "dungeon:razorfen-downs"}
observe:
  - name: head-is-in-razorfen-downs
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE name = 'Grug' AND map_id = 129
    expect: {scalar: "= 1"}
  - name: head-has-no-free-bag-slot
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_inventory i JOIN characters c ON c.guid = i.guid WHERE c.name = 'Grug' AND i.bag = 0 AND i.slot BETWEEN 23 AND 38
    expect: {scalar: ">= 16"}
  # The judge needs the core's own credited-encounter record when an instance is arranged.
  # The core writes log_encounter only for Wrath raids, so the credit is read
  # from the arranged instance's completed-encounter mask.
  - name: encounter-credited
    role: precondition
    when: end
    encounter: {instance: rfd, boss: "Any Razorfen Downs boss"}
  - name: errand-aimed-a-hub-on-map-1
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command c JOIN characters ch ON ch.name = c.target_name
      WHERE ch.guid IN (@cast) AND c.kind = 'quest' AND c.created_at >= @t0 AND c.command LIKE 'at:1:%'
    expect: {scalar: ">= 1"}
  - name: family-was-back-in-a-run-within-the-hour-of-the-errand
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command c JOIN characters ch ON ch.name = c.target_name
      JOIN overseer_dungeon_run r ON r.map_id = 129 AND r.family = 'Grug'
      WHERE ch.guid IN (@cast) AND c.kind = 'quest' AND c.command LIKE 'at:1:%' AND c.created_at >= @t0
        AND r.started_at > c.created_at AND r.started_at <= DATE_ADD(c.created_at, INTERVAL 1 HOUR)
    expect: {scalar: ">= 1"}
  - name: errand-never-aimed-at-map-0
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command c JOIN characters ch ON ch.name = c.target_name
      WHERE ch.guid IN (@cast) AND c.kind = 'quest' AND c.created_at >= @t0 AND c.command LIKE 'at:0:%'
    expect: {scalar: "= 0"}
  - name: family-back-in-kalimdor-or-the-door
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE guid IN (@cast) AND map_id IN (1, 129)
    expect: {scalar: "= 5"}
  - name: family-is-on-one-map-at-the-end
    role: check
    when: end
    sql: |
      SELECT COUNT(DISTINCT map_id) FROM overseer_snapshot WHERE guid IN (@cast)
    expect: {scalar: "= 1"}
