# Blackrock Depths: a finder-entered run whose key holder is teleported out does not arm its dungeon
# brain for more than 180 seconds without him, and no run closes split_failed with him the only member
# missing (mod-overseer issue 1488). Og carries the key; a hearth command takes him out at the door.
# Scope: whether the dungeon brain was armed for more than 180 seconds with the holder outside is a module
# decision logged as text and a decree samples positions only at the end, so the arming ceiling itself is NOT
# asserted. What is proven by rows: the hearth took the key holder out (an applied row for Og), a credited BRD
# encounter happened, no run closed split_failed, and no run was left open or closed for any split reason.
# Fix: mod-overseer pull 1489.
decree: v1
id: brd-finder-entry-key-holder-out
proves:
  - {repo: quadseven/mod-overseer, issue: 1488, criterion: "after the key holder is taken out of a finder-entered BRD run no run closes split_failed or for a split reason (the 180 second arming ceiling is not asserted here)"}
fix: {repo: quadseven/mod-overseer, commit: "50d79defede4fe3b76a7c4f62d33607df39619ae"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 30m
cast:
  - who: family:grug
    set: {alive: true, health_pct: 100, at: {areatrigger: 1466}}
    ceiling: "nothing granted but position"
  - who: Og
    set: {items: [{name: "Shadowforge Key", count: 1}]}
    ceiling: "one Shadowforge Key, the item the door asks for; no level or gear granted"
arrange:
  - instance: {map: "Blackrock Depths", as: brd, bind: family:grug}
  - group: {members: family:grug, leader: Grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "dungeon:blackrock-depths"}
  - at: 2m
    command: {who: Og, kind: hearth, text: "hearth"}
observe:
  - name: og-holds-the-key
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE owner_guid = @Og AND itemEntry = 11000
    expect: {scalar: ">= 1"}
  - name: run-opened-in-brd
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_run WHERE map_id = 230 AND started_at >= @t0
    expect: {scalar: ">= 1"}
  # The judge needs the core's own credited-encounter record when an instance is arranged.
  - name: encounter-credited
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM log_encounter
      WHERE map = 230 AND time >= @t0
    expect: {scalar: ">= 1"}
  - name: the-key-holder-actually-left-the-instance
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_run_event WHERE family = 'Grug' AND character_name = 'Og' AND created_at >= @t0 AND kind IN ('exit_hearth', 'dc_off')
    expect: {scalar: ">= 1"}
  - name: the-key-holder-was-taken-out
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE target_name = 'Og' AND kind = 'hearth' AND created_at >= @t0 AND status IN ('applied', 'delivered')
    expect: {scalar: ">= 1"}
  - name: no-split-failed-with-one-member-out
    role: check
    when: end
    sql: |
      SELECT id, outcome, ended_reason FROM overseer_dungeon_run WHERE map_id = 230 AND started_at >= @t0 AND (outcome = 'split_failed' OR ended_reason LIKE '%split%')
    expect: {rows: 0}
