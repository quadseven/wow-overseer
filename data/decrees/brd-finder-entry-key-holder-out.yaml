# Blackrock Depths: a finder-entered run whose key holder is teleported out does not arm its dungeon
# brain for more than 180 seconds without him, and no run closes split_failed with him the only member
# missing (mod-overseer issue 1488). Og carries the key; a hearth command takes him out at the door.
# Fix: mod-overseer pull 1489.
decree: v1
id: brd-finder-entry-key-holder-out
proves:
  - {repo: quadseven/mod-overseer, issue: 1488, criterion: "a BRD run never arms its dungeon brain for more than 180 seconds with the key holder outside, and no run closes split_failed with him the only member missing"}
fix: {repo: quadseven/mod-overseer, commit: "50d79defede4fe3b76a7c4f62d33607df39619ae"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 30m
cast:
  - who: family:grug
    set: {alive: true, health_pct: 100, at: {areatrigger: 1466}}
    ceiling: "nothing granted but position"
  - who: Og
    set: {items: [{name: "Shadowforge Key", count: 1}]}
    ceiling: "one Shadowforge Key, the item the door asks for; no level or gear granted"
arrange:
  - instance: {map: "Blackrock Depths", as: brd, bind: family:grug}
  - group: {members: family:grug, leader: Grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "dungeon:blackrock-depths"}
  - at: 2m
    command: {who: Og, kind: hearth, text: "hearth"}
observe:
  - name: og-holds-the-key
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE owner_guid = @Og AND itemEntry = 11000
    expect: {scalar: ">= 1"}
  - name: run-opened-in-brd
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_run WHERE map_id = 230 AND started_at >= @t0
    expect: {scalar: ">= 1"}
  - name: no-split-failed-with-one-member-out
    role: check
    when: end
    sql: |
      SELECT id, outcome FROM overseer_dungeon_run WHERE map_id = 230 AND started_at >= @t0 AND outcome = 'split_failed'
    expect: {rows: 0}
