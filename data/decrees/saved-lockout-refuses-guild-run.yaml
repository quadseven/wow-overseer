# One real character is bound to an arranged BRD instance. The decree proves
# the stored lockout and refusal result; it cannot compare against a human
# client screen in the headless world.
decree: v1
id: saved-lockout-refuses-guild-run
proves:
  - {repo: quadseven/mod-overseer, issue: 963, criterion: "a Blackrock Depths guild run proposal is refused because a seated character is saved to that instance, and the stored reason names the lockout"}
fix: {repo: quadseven/mod-overseer, commit: "deef6a2deebc03e6d6098b9a03e518c9bbefe943"}
world: {class: full, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 45m
cast:
  - who: family:grug
    set: {alive: true, at: {creature: "Franclorn Forgewright"}}
    ceiling: "position only; no items, gear, levels, spells or gold"
arrange:
  - instance: {map: "Blackrock Depths", as: brd, bind: family:grug}
act:
  - at: 0s
    command: {who: "cast[0]", kind: guild, text: "run blackrock-depths"}
observe:
  - name: the-instance-lockout-is-stored
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_instance
      WHERE guid IN (@cast) AND instance = @brd AND permanent = 1
    expect: {scalar: ">= 1"}
  - name: the-proposal-records-a-lockout-refusal
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_guild_run
      WHERE created_at >= @t0 AND keyword = 'blackrock-depths'
        AND (why LIKE '%saved%' OR why LIKE '%lockout%')
    expect: {scalar: ">= 1"}
  - name: the-refused-instance-never-starts
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_run
      WHERE map_id = 230 AND started_at >= @t0
    expect: {scalar: "= 0"}
