# A fresh EPHEMERAL world starts with empty module memory. Putting the family
# in the Stratholme exit yard therefore models a restart that lost the in-memory
# yard episode while retaining the character positions.
# Scope: the check is that an IDLE poll opens the way-out event and the family
# leaves the yard. It does not claim that a server restart was executed.
# Fix: mod-overseer PR 1287.
decree: v1
id: stratholme-restart-yard-recovery
proves:
  - {repo: quadseven/mod-overseer, issue: 1254, criterion: "in a fresh EPHEMERAL world with a member already in the exit yard, an IDLE poll opens a way-out episode and the family leaves the yard"}
fix: {repo: quadseven/mod-overseer, commit: "c8815470551343a79f34dbb3037ad3278d68a719"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 30m
cast:
  - who: family:grug
    set: {alive: true, at: {captured: stratholme-exit-yard-button}}
    ceiling: "nothing granted but position"
arrange:
  - group: {members: family:grug, leader: Grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "rest"}
observe:
  - name: all-five-start-in-the-exit-yard
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE guid IN (@cast) AND map_id = 0 AND zone_id = 139
    expect: {scalar: "= 5"}
  - name: a-yard-way-out-was-recorded
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_run_event WHERE family = 'Grug' AND created_at >= @t0 AND detail LIKE '%stratholme exit%'
    expect: {scalar: ">= 1"}
  - name: all-five-ended-outside-the-yard
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot s JOIN acore_world.gameobject go ON go.guid = 45625
      WHERE s.guid IN (@cast) AND s.map_id = 0 AND s.zone_id = 139
        AND POW(s.pos_x - go.position_x, 2) + POW(s.pos_y - go.position_y, 2) > 3600
    expect: {scalar: "= 5"}
