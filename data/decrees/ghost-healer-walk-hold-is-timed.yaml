# A ghost whose healer walk is refused while a hostile remains by its corpse
# emits the timed hold status line after the old bound (mod-overseer issue 1284).
# Fix: mod-overseer pull 1289.
decree: v1
id: ghost-healer-walk-hold-is-timed
proves:
  - {repo: quadseven/mod-overseer, issue: 1284, criterion: "a ghost held by a hostile after a failed healer walk emits a timed status line and remains a ghost"}
fix: {repo: quadseven/mod-overseer, commit: "40b1d97a14af4f994c8dc734c51883515c38334e"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 40m
cast:
  - who: family:grug
    set: {alive: true, health_pct: 100, at: {areatrigger: 1466}}
    ceiling: "nothing granted but position"
  - who: Og
    set: {alive: false, corpse_at: {creature: "Lord Roccor"}, at: {graveyard: 1469}}
    ceiling: "nothing granted; the death is the scenario"
arrange:
  - instance: {map: "Blackrock Depths", as: brd, bind: family:grug}
  - group: {members: family:grug, leader: Grug}
act:
  - at: 90s
    roster: {who: family:grug, job: "dungeon:blackrock-depths"}
  - at: 300s
    roster: {who: Og, job: "dungeon:blackrock-depths"}
observe:
  - name: ghost-starts-with-a-corpse
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM corpse WHERE guid = @Og
    expect: {scalar: "= 1"}
  - name: encounter-credited
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM log_encounter
      WHERE map = 230 AND time >= @t0
    expect: {scalar: ">= 1"}
  - name: hostile-held-ghost-writes-timed-status
    role: check
    log:
      pattern: "has waited [0-9]+s with [1-9][0-9]* hostile\\(s\\) at its corpse (after the healer walk failed; it stays a ghost and retries the walk to|; it remains a ghost and is still walking to the spirit healer at)"
      expect: {at_least: 1}
