# Only naturally dropped loot is used. The precondition rejects a run whose
# family already has disenchant materials, so an output must come from this
# run. No gear, items, levels, spells or gold are seeded.
decree: v1
id: dungeon-unwearable-drop-disenchanted
proves:
  - {repo: quadseven/mod-overseer, issue: 160, criterion: "a family run with an Enchanter produces new disenchant materials in its bags with Playerbots.LootRollDisenchant enabled"}
fix: {repo: quadseven/mod-overseer, commit: "0bb2e5c767b5685c44b08fb9c54f544eea94782f"}
world: {class: full, image: follow-dev, bridge: "on", random_bots: 0, config: {"Playerbots.LootRollDisenchant": 1}}
runs: {control: 3, treatment: 3}
duration: 2h
cast:
  - who: family:grug
    set: {alive: true, at: {areatrigger: 1466}}
    ceiling: "position only; no items, gear, levels, spells or gold"
arrange:
  - instance: {map: "Blackrock Depths", as: brd, bind: family:grug}
  - group: {members: family:grug, leader: Grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "dungeon:blackrock-depths"}
observe:
  - name: an-enchanter-is-in-the-family
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_skills
      WHERE guid IN (@cast) AND skill = 333 AND value >= 300
    expect: {scalar: ">= 1"}
  - name: the-family-starts-without-disenchant-materials
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_inventory ci
      JOIN item_instance ii ON ii.guid = ci.item
      JOIN acore_world.disenchant_loot_template dl ON dl.Item = ii.itemEntry
      WHERE ci.guid IN (@cast) AND ci.bag = 0
    expect: {scalar: "= 0"}
  - name: a-brd-run-opened
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_run
      WHERE family = 'Grug' AND map_id = 230 AND started_at >= @t0
    expect: {scalar: ">= 1"}
  - name: an-encounter-was-credited
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM log_encounter WHERE map = 230 AND time >= @t0
    expect: {scalar: ">= 1"}
  - name: disenchant-materials-land-in-family-bags
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM character_inventory ci
      JOIN item_instance ii ON ii.guid = ci.item
      JOIN acore_world.disenchant_loot_template dl ON dl.Item = ii.itemEntry
      WHERE ci.guid IN (@cast) AND ci.bag = 0
    expect: {scalar: ">= 1"}
