# A split across maps produces either the crossing line or the bounded verdict
# and reason line from #1143. Four members start on map 1 with the leader on map 0.
# Scope: the decree observes a bounded split and its diagnostic line; it does not
# claim an hour-long live stay or the separate bridge bank-trip behavior.
# Fix: mod-overseer pull 1369.
decree: v1
id: cross-map-stranded-member-names-its-way
proves:
  - {repo: quadseven/mod-overseer, issue: 1143, criterion: "a cross-map party poll records a crossing decision or the bounded verdict and reason for each stranded member"}
fix: {repo: quadseven/mod-overseer, commit: "a68528d6c2e8df444582a7384ced4a82b34dbc40"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 20m
cast:
  - who: family:zug
    set: {alive: true, at: {creature: "Gazlowe"}}
    ceiling: "nothing granted but position"
  - who: Zug
    set: {alive: true, at: {creature: "Marshal McBride"}}
    ceiling: "nothing granted but position"
arrange:
  - group: {members: family:zug, leader: Zug}
act:
  - at: 90s
    roster: {who: family:zug, job: "quest"}
observe:
  - name: leader-starts-on-map-0
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE guid = @Zug AND map_id = 0
    expect: {scalar: "= 1"}
  - name: four-members-start-on-map-1
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE guid IN (@cast) AND guid <> @Zug AND map_id = 1
    expect: {scalar: "= 4"}
  - name: split-has-crossing-or-reason-line
    role: check
    log:
      pattern: "(has been on map 1 and its leader on map 0 for [0-9]+ minutes - its way across is '[^']+': .+ \\(#1143\\)|transport its faction may ride joins map 1 and map 0, so it walks to the berth|cannot sail from map 1 to map 0 - refused at .+|steps aboard|is ashore on map 0)"
      expect: {at_least: 4}
