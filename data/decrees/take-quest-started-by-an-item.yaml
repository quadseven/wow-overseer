# take quest:N accepts a quest an item starts when the taker carries the item, with the item as the giver,
# and refuses a character without it as a stop (mod-overseer issue 1508). Quest 54 'Report to Goldshire'
# is started by item 745 (Marshal McBride's Documents). Og carries it; Ugga does not.
# Scope: Ugga's row must end as an error row with a reason in its own words (a refusal), and Og's row must be
# applied. The stop marker inside the result column and the holder reading item are not asserted: their
# encoding is not in this repository, and a guessed string would fail closed for the wrong reason.
# The act fires only once both takers are logged in (a row to a character that is not online is refused as 'target not
# online', which would pass the refusal check and fail the take for the wrong reason).
# Fix: mod-overseer pull 1507.
decree: v1
id: take-quest-started-by-an-item
proves:
  - {repo: quadseven/mod-overseer, issue: 1508, criterion: "take quest:N for a quest no creature gives takes it with the carried item, and a character without the item is refused with an error row and a reason (the stop marker is not asserted here)"}
fix: {repo: quadseven/mod-overseer, commit: "31b32a324c724e6ae87277f4b626fa01fcd3fb68"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 10m
cast:
  - who: Og
    set: {alive: true, items: [{name: "Marshal McBride's Documents", count: 1}], at: {creature: "Lord Grayson Shadowbreaker"}}
    ceiling: "one quest-starting item named by the issue; no level, gold or gear"
  - who: Ugga
    set: {alive: true, at: {creature: "Lord Grayson Shadowbreaker"}}
    ceiling: "nothing granted but position"
act:
  - at: 0s
    command: {who: Og, kind: quest, text: "take quest:54"}
  - at: 0s
    command: {who: Ugga, kind: quest, text: "take quest:54"}
observe:
  - name: both-takers-are-online
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE name IN ('Og', 'Ugga')
    expect: {scalar: "= 2"}
  - name: og-holds-the-item
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE owner_guid = @Og AND itemEntry = 745
    expect: {scalar: "= 1"}
  - name: ugga-holds-no-item
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE owner_guid = @Ugga AND itemEntry = 745
    expect: {scalar: "= 0"}
  - name: og-has-the-quest
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM character_queststatus WHERE guid = @Og AND quest = 54
    expect: {scalar: "= 1"}
  - name: og-row-was-applied
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE target_name = 'Og' AND kind = 'quest' AND command LIKE 'take quest:54%' AND created_at >= @t0 AND status = 'applied'
    expect: {scalar: ">= 1"}
  - name: ugga-was-refused-in-words
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE target_name = 'Ugga' AND kind = 'quest' AND command LIKE 'take quest:54%' AND created_at >= @t0 AND status = 'error' AND detail <> '' AND detail NOT LIKE '%not online%'
    expect: {scalar: ">= 1"}
  - name: ugga-does-not-have-the-quest
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM character_queststatus WHERE guid = @Ugga AND quest = 54
    expect: {scalar: "= 0"}
