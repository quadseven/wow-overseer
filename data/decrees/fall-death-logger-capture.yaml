# Raise the entities.player and movement.motionmaster loggers, record one fall
# from the captured start, and require the FALLDAMAGE and MoveFall lines
# (mod-overseer issue 254). The loggers are the only world-config change; the
# throwaway world teardown restores its baseline.
# Scope: the decree proves a measured fall row and requires both relevant log
# patterns. It does not claim the following deployment roll reset logger
# levels, which is a realm-operations check outside the throwaway world.
# Fix: mod-overseer commit 0cd0f90 (the CompleteDismount mod-playerbots patch).
decree: v1
id: fall-death-logger-capture
proves:
  - {repo: quadseven/mod-overseer, issue: 254, criterion: "one fall death is captured with entities.player and movement.motionmaster at DEBUG, including its FALLDAMAGE mZ and z line and any movement.motionmaster MoveFall line"}
fix: {repo: quadseven/mod-overseer, commit: "0cd0f900b086e4207cd87c8720e3329fcbdeeff9"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {Logger.entities.player: "5,Console Server", Logger.movement.motionmaster: "5,Console Server"}}
runs: {control: 3, treatment: 3}
duration: 20m
cast:
  - who: Og
    set: {alive: true, at: {captured: mo254-fall-start}}
    ceiling: "nothing granted but position"
act:
  - at: 0s
    roster: {who: Og, job: "quest"}
observe:
  - name: og-starts-at-the-fall-start
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE guid = @Og AND map_id = 230
    expect: {scalar: "= 1"}
  - name: a-fall-was-recorded
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_death WHERE created_at >= @t0 AND character_name = 'Og' AND yards_fallen > 0
    expect: {scalar: ">= 1"}
  - name: the-fall-began-on-the-captured-map
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_death WHERE created_at >= @t0 AND character_name = 'Og' AND fall_start_map = 230 AND yards_fallen > 0
    expect: {scalar: ">= 1"}
  - name: fall-measured-not-guessed
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_death WHERE created_at >= @t0 AND character_name = 'Og' AND yards_fallen > 0 AND fall_start_z IS NULL
    expect: {scalar: "= 0"}
  - name: fall-damage-debug-line-is-present
    role: check
    log: {pattern: "FALLDAMAGE.*mZ=.*z=", expect: {at_least: 1}}
  - name: motionmaster-movefall-line-is-present
    role: check
    log: {pattern: "movement\\.motionmaster.*MoveFall", expect: {at_least: 1}}
