# Deadmines: a party that cannot open the Defias Gunpowder chest still gets the
# gunpowder by a way a player could use, or ends the run within 5 minutes with a
# logged reason. The Cave family goes in with its rogue's Pick Lock unlearned, so
# the chest has no opener in the party.
#
# Scope: the silence after the Iron Clad Door line cannot be measured from a log a decree can only forbid
# lines from; the rows prove instead that the run was not closed on the Smite timeout, did not stall, and was
# credited past the door. A run with no credit is INVALID.
# Fix: mod-dungeon-clear pull 58 (ported onto the pin by no. 60, whose merge is
# eda7f705c1). Control arm is the image before no. 58.
decree: v1
id: deadmines-gunpowder-no-opener
proves:
  - {repo: quadseven/mod-dungeon-clear, issue: 54, criterion: "no Deadmines run times out with `next Mr. Smite`, and no `I can't progress the event at Iron Clad Door` line is followed by more than 5 minutes of silence from that tank"}
fix: {repo: quadseven/mod-dungeon-clear, commit: "9382cd7332aecbd03c2bf15b66ea48e906661feb"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 40m
cast:
  - who: family:grug
    set: {alive: true, health_pct: 100, at: {captured: deadmines-iron-clad-door}}
    ceiling: "nothing granted but position"
  - who: Bork
    set: {spells_remove: [1804]}                                    # Pick Lock: the one opener the party had
    ceiling: "one spell removed, nothing granted"
arrange:
  - instance: {map: "The Deadmines", as: dm, bind: family:grug}
  - group: {members: family:grug, leader: Grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "dungeon:deadmines"}
observe:
  - name: party-entered-deadmines
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_run
      WHERE map_id = 36 AND started_at >= @t0
    expect: {scalar: ">= 1"}
  # The judge needs the core's own credited-encounter record when an instance is arranged.
  - name: encounter-credited
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM log_encounter
      WHERE map = 36 AND time >= @t0
    expect: {scalar: ">= 1"}
  - name: no-opener-in-party
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_spell WHERE guid = @Bork AND spell = 1804
    expect: {scalar: "= 0"}
  - name: no-run-closed-on-the-smite-timeout
    role: check
    when: end
    sql: |
      SELECT id, ended_reason FROM overseer_dungeon_run
      WHERE map_id = 36 AND started_at >= @t0 AND ended_reason LIKE '%next Mr. Smite%'
    expect: {rows: 0}
  - name: no-run-stalled-silent-at-the-door
    role: check
    when: end
    sql: |
      SELECT id, outcome FROM overseer_dungeon_run
      WHERE map_id = 36 AND started_at >= @t0 AND outcome = 'stalled'
    expect: {rows: 0}
  - name: no-iron-clad-door-line
    role: check
    log: {pattern: "I can't progress the event at Iron Clad Door", expect: {count: 0}}
