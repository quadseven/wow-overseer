# A guild alchemist at Alchemy 165 on job craft with a raid-supply want for Fire Protection Potion buys
# the vendor recipe (item 6055) and the raid page counts potions (wow-overseer issue 892; the recipe vendor
# is the town's alchemy trainer area). The alchemist's rank is a bounded grant: the families do not reach
# 165 organically yet.
# Fix: wow-overseer pull 909.
decree: v1
id: raid-supply-fire-protection-recipe
proves:
  - {repo: quadseven/wow-overseer, issue: 892, criterion: "raid supply logs the alchemist buying Recipe: Fire Protection Potion and a Fire Protection Potion count above 0 on the raid page"}
fix: {repo: quadseven/wow-overseer, commit: "27a9a3032332668646bdd9e8670507e5b29d8116"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 2h
cast:
  - who: guild:Cave:alchemist
    set: {alive: true, skills: {Alchemy: {value: 165, max: 225}}, money: 50000, at: {creature: "Alchemist Mallory"}}
    ceiling: "the Alchemy rank the issue needs and gold for one recipe; no level or gear"
act:
  - at: 0s
    command: {who: "cast[0]", kind: job, text: "craft:alchemy"}
observe:
  - name: alchemist-is-at-165
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_skills WHERE guid = @cast0 AND skill = @skill_alchemy AND value >= 165
    expect: {scalar: "= 1"}
  - name: recipe-bought
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE kind = 'buy' AND target_arg = '6055' AND status IN ('delivered', 'applied') AND created_at >= @t0
    expect: {scalar: ">= 1"}
  - name: potions-exist
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE itemEntry = 6049
    expect: {scalar: ">= 1"}
