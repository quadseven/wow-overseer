# Blackrock Depths: a member who died inside the run releases at the mountain graveyard and the run
# is not closed split_failed mid-fight (mod-overseer issue 1472), and a dungeon module that stopped on a
# party wait is armed again while the party reassembles (issue 1500).
# Og starts dead beside the first boss and releases at the mountain graveyard (graveyard 1469), so the
# walk back and the stopped-module path are both reached. Nothing is granted.
# Scope: the module's party-wait stop is a log line, so 'while the module was stopped' is not asserted. What
# is proven by rows: the credited run opened, Og was alive AND back on the dungeon map by the end, and the
# clearing went on (a boss event was written after the start), with no run closed split_failed.
# Fixes: mod-overseer pulls 1473 (walk back) and 1501 (re-arm); the commit below is 1501, the later.
decree: v1
id: brd-member-dies-and-releases
proves:
  - {repo: quadseven/mod-overseer, issue: 1472, criterion: "a dead BRD member released at the mountain graveyard is back on the dungeon map alive and no run closes split_failed"}
  - {repo: quadseven/mod-overseer, issue: 1500, criterion: "after a BRD member dies and releases the run keeps clearing (a boss event follows) and is not closed split_failed (the party-wait stop is not asserted here)"}
fix: {repo: quadseven/mod-overseer, commit: "864b71ec085fcaaf75cac98b520ef5c6fbc9347b"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 45m
cast:
  - who: family:grug
    set: {alive: true, health_pct: 100, at: {areatrigger: 1466}}
    ceiling: "nothing granted but position"
  - who: Og
    set: {alive: false, corpse_at: {creature: "Lord Roccor"}, at: {graveyard: 1469}}
    ceiling: "nothing granted; the death is the scenario"
arrange:
  - instance: {map: "Blackrock Depths", as: brd, bind: family:grug}
  - group: {members: family:grug, leader: Grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "dungeon:blackrock-depths"}
observe:
  - name: og-started-dead
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM corpse WHERE guid = @Og
    expect: {scalar: "= 1"}
  - name: run-opened-in-brd
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_run WHERE map_id = 230 AND started_at >= @t0
    expect: {scalar: ">= 1"}
  # The judge needs the core's own credited-encounter record when an instance is arranged.
  - name: encounter-credited
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM log_encounter
      WHERE map = 230 AND time >= @t0
    expect: {scalar: ">= 1"}
  - name: no-run-closed-split-failed
    role: check
    when: end
    sql: |
      SELECT id, outcome FROM overseer_dungeon_run WHERE map_id = 230 AND started_at >= @t0 AND outcome = 'split_failed'
    expect: {rows: 0}
  - name: og-is-back-in-brd
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM characters WHERE guid = @Og AND map = 230 AND health > 0
    expect: {scalar: "= 1"}
  # A boss event after the STAGED_INSIDE reassembly phase, where Og's release and rejoin happen (issue 1500).
  - name: the-clearing-went-on
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_run_event s JOIN overseer_dungeon_run_event b ON b.family = s.family AND b.kind = 'boss' AND b.id > s.id
      WHERE s.family = 'Grug' AND s.created_at >= @t0 AND s.kind = 'phase' AND s.detail LIKE '%-> STAGED_INSIDE%'
    expect: {scalar: ">= 1"}
  - name: og-is-alive-again
    role: check
    when: end
    sql: |
      SELECT name FROM characters WHERE guid = @Og AND health = 0
    expect: {rows: 0}
