# Start at the Rut'theran flight master to isolate the same-map ride from the
# separate walk out of Darnassus. The requested Auberdine point is the island
# boat's stop used by the module.
decree: v1
id: teldrassil-same-map-ride-to-auberdine
proves:
  - {repo: quadseven/mod-overseer, issue: 1481, criterion: "a roster member's same-map ride-to-stop from Teldrassil is applied and the member reaches the Auberdine stop"}
fix: {repo: quadseven/mod-overseer, commit: "315494a46401c356059efee5071100566ddf1419"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 1h
cast:
  - who: Ugga
    set: {alive: true, at: {creature: "Vesprystus"}}
    ceiling: "position only; nothing granted"
act:
  - at: 0s
    command: {who: Ugga, kind: job, text: "ride-to-stop map:1 x:6341.4 y:557.7"}
observe:
  - name: cast-is-online
    role: precondition
    when: start
    online: cast
  - name: enabled-alliance-member-starts-at-ruttheran
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM characters c JOIN overseer_roster r ON r.name = c.name
      WHERE c.guid = @cast0 AND c.race = 1 AND c.map = 1 AND c.zone = 141
        AND c.instance_id = 0 AND c.health > 0 AND r.enabled = 1
    expect: {scalar: "= 1"}
  # Retain pricing refusals and crossings that ran. A refusal before pricing
  # or polling leaves the scenario unwitnessed.
  - name: the-ride-produced-a-terminal-crossing-receipt
    role: precondition
    when: end
    sql: |
      SELECT id, status, detail, JSON_UNQUOTE(JSON_EXTRACT(
        CASE WHEN JSON_VALID(result) THEN result ELSE '{}' END, '$.reason'))
      FROM overseer_command WHERE target_name = 'Ugga' AND kind = 'job'
        AND command = 'ride-to-stop map:1 x:6341.4 y:557.7'
        AND source = 'eph-judge' AND created_at >= @t0
        AND JSON_UNQUOTE(JSON_EXTRACT(
          CASE WHEN JSON_VALID(result) THEN result ELSE '{}' END, '$.map')) = '1'
        AND (status, JSON_UNQUOTE(JSON_EXTRACT(
          CASE WHEN JSON_VALID(result) THEN result ELSE '{}' END, '$.outcome')))
          IN (('applied', 'arrived'), ('error', 'refused'), ('unchanged', 'timeout'))
        AND (status <> 'error'
          OR detail = 'no transport the module knows sails from this map to that map for this faction'
          OR JSON_UNQUOTE(JSON_EXTRACT(
            CASE WHEN JSON_VALID(result) THEN result ELSE '{}' END, '$.steps')) + 0 > 0)
    expect: {rows: 1}
  - name: same-map-ride-command-was-applied
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command
      WHERE target_name = 'Ugga' AND kind = 'job'
        AND command = 'ride-to-stop map:1 x:6341.4 y:557.7'
        AND source = 'eph-judge' AND created_at >= @t0 AND status = 'applied'
        AND JSON_UNQUOTE(JSON_EXTRACT(
          CASE WHEN JSON_VALID(result) THEN result ELSE '{}' END, '$.outcome')) = 'arrived'
    expect: {scalar: "= 1"}
  - name: member-reaches-auberdine
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM characters
      WHERE guid = @cast0 AND map = 1
        AND POW(position_x - 6341.38, 2) + POW(position_y - 557.68, 2) <= 2500
    expect: {scalar: "= 1"}
