# The leader boards the Lady Mehley at the Theramore berth within the stop window and the family lands
# together on map 0 (mod-overseer issue 758). The family starts on the Theramore pier approach on map 1
# and its door is on the Eastern Kingdoms. The boarding steps and the 'released from its cross hold' line
# are what the criterion reads; here the observation is the outcome: everyone ashore on map 0.
# Fix: mod-overseer pull 849.
# Scope: the leader's 'steps aboard' line and his 'is aboard ... between maps' line for the Lady Mehley are
# worldserver text the module writes, and each is required at least once (wow-overseer issue 2767). Pairing
# every step with an aboard line before the same departure is a comparison of two lines, which one count per
# pattern does not make, so the pairing of each step is still outside this decree. Also proven by rows: the
# whole family ends on one map, the continent of the far berth (or the instance beyond it), and the leader is
# among them.
decree: v1
id: leader-boards-lady-mehley
proves:
  - {repo: quadseven/mod-overseer, issue: 758, criterion: "the leader steps aboard the Lady Mehley and is aboard between the maps, shown by both lines in the log, and the family is ashore together on map 0 after the Theramore to Menethil leg (each step is not paired with its own aboard line)"}
fix: {repo: quadseven/mod-overseer, commit: "d6fa94a7adf106bbc6d7abc449f65990cae1ef1d"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 1h
cast:
  - who: family:grug
    set: {alive: true, health_pct: 100, at: {captured: theramore-pier-guard}}
    ceiling: "nothing granted but position"
arrange:
  - group: {members: family:grug, leader: Grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "dungeon:blackrock-depths"}
observe:
  - name: family-starts-on-map-1
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE guid IN (@cast) AND map_id = 1
    expect: {scalar: "= 5"}
  - name: leader-ended-on-map-0
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE name = 'Grug' AND map_id IN (0, 230)
    expect: {scalar: "= 1"}
  - name: family-together-on-map-0
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE guid IN (@cast) AND map_id IN (0, 230)
    expect: {scalar: "= 5"}
  - name: family-is-on-one-map
    role: check
    when: end
    sql: |
      SELECT COUNT(DISTINCT map_id) FROM overseer_snapshot WHERE guid IN (@cast)
    expect: {scalar: "= 1"}
  - name: no-release-from-cross-hold-while-ship-docked
    role: check
    log: {pattern: "released from its cross hold - he is walking to the berth again", expect: {count: 0}}
  # The leader's two boarding lines; pinned to the module source by tests/test_eph_required_lines.py.
  - name: the-leader-stepped-aboard
    role: check
    log: {pattern: "'Grug' steps aboard 'Ship \\(The Lady Mehley\\)' at \\(", expect: {at_least: 1}}
  - name: the-leader-was-aboard-between-the-maps
    role: check
    log: {pattern: "the leader 'Grug' is aboard 'Ship \\(The Lady Mehley\\)' between maps [0-9]+ and [0-9]+", expect: {at_least: 1}}
