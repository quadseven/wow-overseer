# The Alliance family enters BRD with an active Attunement to the Core quest.
# Its clear order must visit the Core Fragment chest and loot the fragment.
# Scope: this starts with quest 7848 already active, so quest acquisition is not
# claimed. No fragment or other item is granted.
# Fix: mod-overseer PR 1464.
decree: v1
id: brd-core-fragment-chest
proves:
  - {repo: quadseven/mod-overseer, issue: 1456, criterion: "a BRD run with an Alliance 7848 holder reaches the Core Fragment chest and item 18412 appears on that holder"}
fix: {repo: quadseven/mod-overseer, commit: "64eb9ea81b8f897ed27c121044e3c6764000bcd1"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 2h
cast:
  - who: family:zug
    set: {alive: true, at: {areatrigger: 1466}, quests: {7848: incomplete}, free_backpack_slots: 1}
    ceiling: "only the active quest state, position and one free backpack slot; no levels, items, gold or gear"
arrange:
  - instance: {map: "Blackrock Depths", as: brd, bind: family:zug}
  - group: {members: family:zug, leader: Zug}
act:
  - at: 0s
    roster: {who: family:zug, job: "dungeon:blackrock-depths"}
observe:
  - name: the-family-holds-attunement-to-the-core
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_queststatus WHERE guid IN (@cast) AND quest = 7848 AND status = 3
    expect: {scalar: "= 5"}
  - name: no-family-member-starts-with-a-core-fragment
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE owner_guid IN (@cast) AND itemEntry = 18412
    expect: {scalar: "= 0"}
  - name: a-brd-encounter-was-credited
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM log_encounter
      WHERE map = 230 AND time >= @t0
    expect: {scalar: ">= 1"}
  - name: a-family-member-holds-the-fragment
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE owner_guid IN (@cast) AND itemEntry = 18412
    expect: {scalar: ">= 1"}
  - name: the-run-logged-a-fragment-loot
    role: check
    log: {pattern: "core fragment: .* looted", expect: {at_least: 1}}
