# A family with an Enchanter in the party runs the Deadmines with LootRollDisenchant on. A green or blue
# drop nobody can use is voted Disenchant and the Enchanter ends with enchanting materials in the bags.
# Scope: which drop falls is the core's own luck, so the check is the outcome (materials appeared in the
# Enchanter's bags, which only a disenchant produces here, and a start-of-run precondition holds the
# Enchanter owning none of them anywhere (bags or bank, the same scope the end check counts) so the end
# count cannot be stock that was already there) and the window is long. A run that never credits
# an encounter is INVALID. The party-chat Need and Greed wording (the criterion's third box) is log text
# and is not asserted here. Og holds Enchanting only as a grant, legal in the throwaway world.
decree: v1
id: enchanter-disenchants-unwearable-drops
proves:
  - {repo: quadseven/mod-overseer, issue: 160, criterion: "a watched dungeon run shows a green or blue unwearable drop producing enchanting materials in family bags, with LootRollDisenchant enabled"}
fix: {repo: quadseven/mod-overseer, commit: "0bb2e5c767b5685c44b08fb9c54f544eea94782f"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {Playerbots.LootRollDisenchant: 1}}
runs: {control: 3, treatment: 3}
duration: 90m
cast:
  - who: family:grug
    set: {alive: true, health_pct: 100, at: {captured: deadmines-iron-clad-door}}
    ceiling: "nothing granted but position"
  - who: Og
    set: {skills: {Enchanting: {value: 150, max: 150}}}
    ceiling: "Enchanting at 150 of 150, the skill the issue reports Og holding; nothing else granted"
arrange:
  - instance: {map: "The Deadmines", as: dm, bind: family:grug}
  - group: {members: family:grug, leader: Grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "dungeon:deadmines"}
observe:
  - name: party-entered-deadmines
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_run
      WHERE map_id = 36 AND started_at >= @t0
    expect: {scalar: ">= 1"}
  - name: encounter-credited
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM log_encounter
      WHERE map = 36 AND time >= @t0
    expect: {scalar: ">= 1"}
  - name: enchanter-holds-enchanting
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_skills WHERE guid = @cast1 AND skill = 333
    expect: {scalar: "= 1"}
  - name: enchanter-owns-no-enchanting-materials-at-the-start
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM item_instance
      WHERE owner_guid = @cast1 AND itemEntry IN (10940, 10938, 10939, 10978, 11083)
    expect: {scalar: "= 0"}
  - name: enchanting-materials-in-the-enchanters-bags
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM item_instance
      WHERE owner_guid = @cast1 AND itemEntry IN (10940, 10938, 10939, 10978, 11083)
    expect: {scalar: ">= 1"}
