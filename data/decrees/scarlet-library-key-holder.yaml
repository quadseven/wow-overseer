# Scarlet Monastery: after a Library clear the party approaches the
# required-key chest before leaving, so a new guild key holder exists and the
# Armory or Cathedral progression is eligible.
# Fix: mod-dungeon-clear pull 92.
# Start state: no cast character holds the key at the start, and the Library bosses were credited by the
# core in this run, so a key held at the end was earned by the clear and not carried in.
# item_instance has no creation time. The cast is seeded with nothing but a
# position, so a key owned by a cast character was picked up during the run.
decree: v1
id: scarlet-library-key-holder
proves:
  - {repo: quadseven/mod-dungeon-clear, issue: 91, criterion: "a new guild key holder exists after a Library clear and Armory or Cathedral progression follows"}
fix: {repo: quadseven/mod-dungeon-clear, commit: "9820e304b2477b1417a15805f7b15acdabf383ec"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 1h
cast:
  - who: family:grug
    set: {alive: true, health_pct: 100, at: {areatrigger: 614}}     # Scarlet Monastery - Library (Entrance)
    ceiling: "nothing granted but position"
arrange:
  - instance: {map: "Scarlet Monastery", as: sm, bind: family:grug}
  - group: {members: family:grug, leader: Grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "dungeon:scarlet-library"}
  - when: library-boss-credited
    roster: {who: family:grug, job: "dungeon:scarlet-armory"}
observe:
  - name: no-cast-member-held-the-key-at-the-start
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE itemEntry = 7146 AND owner_guid IN (@cast)
    expect: {scalar: "= 0"}
  # The judge needs the core's own credited-encounter record when an instance is arranged.
  - name: encounter-credited
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM log_encounter
      WHERE map = 189 AND time >= @t0
    expect: {scalar: ">= 1"}
  - name: library-run-opened
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_run
      WHERE map_id = 189 AND started_at >= @t0 AND portal_keyword = 'scarlet-library'
    expect: {scalar: ">= 1"}
  - name: library-boss-credited
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_run_event
      WHERE family = 'Grug' AND created_at >= @t0 AND kind = 'boss'
    expect: {scalar: ">= 1"}
  - name: a-key-holder-exists
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE itemEntry = 7146 AND owner_guid IN (@cast)
    expect: {scalar: ">= 1"}
  - name: armory-or-cathedral-entered-after
    role: check
    when: end
    sql: |
      SELECT id, portal_keyword FROM overseer_dungeon_run
      WHERE map_id = 189 AND started_at >= @t0 AND portal_keyword IN ('scarlet-armory', 'scarlet-cathedral')
    expect: {rows: ">= 1"}
