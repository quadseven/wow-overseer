# A family at the bag floor whose leader carries a vendor aim the ledger has no record of (a bridge
# restart, or a write that went round the town slot) keeps that sale trip until the orphan grace has run.
# A mail pass or a town errand must not take the traveller from it in the same call that first saw it
# (wow-overseer issue 1261). Recorded before the fix: "mail takes the traveller Zug from an unknown writer:
# 'vendor' has held the family's one travel column for 0s, past its 0s lease".
# Scope: the check is a bridge log assertion, so it proves the zero-second preemption is gone and nothing
# more. It does not assert that the sale lands. The family is cast with no seeded bags and the precondition
# reads the template's bag state, so a template with room is INVALID. The 120 second orphan grace
# (ORPHAN_GROUND_GRACE_SECONDS) still ends a trip that cannot finish, so the bound is not asserted here.
decree: v1
id: orphan-sale-trip-not-cut-at-zero
proves:
  - {repo: quadseven/wow-overseer, issue: 1261, criterion: "a sale or rescue trip the ledger cannot name is not taken off the leader at zero seconds by a lower-priority errand"}
fix: {repo: quadseven/wow-overseer, commit: "TODO"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 45m
cast:
  - who: family:zug
    set: {alive: true, at: {creature: "Gazlowe"}}
    ceiling: "nothing granted but position"
arrange:
  - group: {members: family:zug, leader: Zug}
act:
  - at: 0s
    roster: {who: family:zug, job: "quest"}
observe:
  - name: head-has-no-free-bag-slot
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_inventory i JOIN characters c ON c.guid = i.guid WHERE c.name = 'Zug' AND i.bag = 0 AND i.slot BETWEEN 23 AND 38
    expect: {scalar: ">= 16"}
  - name: no-pass-takes-an-unrecorded-vendor-trip-at-zero-seconds
    role: check
    log: {pattern: "takes the traveller Zug from an unknown writer: 'vendor' has held the family's one travel column for 0s", expect: {count: 0}}
