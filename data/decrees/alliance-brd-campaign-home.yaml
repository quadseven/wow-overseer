# Zug is the Alliance family in the proving template. The campaign begins at
# the Blackrock Depths door with a homebind at a Stormwind inn, far from the
# door's named Kargath home. The starting bind is a real inn anchor; nothing is
# granted.
# Scope: this checks the module's BRD run, Kargath walk/bind avoidance and
# Badlands death rows. It does not claim the campaign ran on the live realm.
# Fix: mod-overseer PR 1401.
decree: v1
id: alliance-brd-campaign-home
proves:
  - {repo: quadseven/mod-overseer, issue: 1400, criterion: "during an Alliance Blackrock Depths campaign, no member is walked or bound at Kargath and no member dies in the Badlands"}
fix: {repo: quadseven/mod-overseer, commit: "c85d8a85b3d4c3adf77b6c81a2a8c0bfc8b5304c"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 2h
cast:
  - who: family:zug
    set: {alive: true, at: {areatrigger: 1466}, homebind: {creature: "Innkeeper Allison"}}
    ceiling: "position and an Alliance inn homebind only; nothing granted"
arrange:
  - instance: {map: "Blackrock Depths", as: brd, bind: family:zug}
  - group: {members: family:zug, leader: Zug}
act:
  - at: 0s
    roster: {who: family:zug, job: "dungeon:blackrock-depths"}
observe:
  - name: the-cast-is-alliance
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM characters WHERE guid IN (@cast) AND race IN (1, 3, 4, 7, 11)
    expect: {scalar: "= 5"}
  - name: the-family-starts-bound-at-the-alliance-inn
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_homebind hb
      JOIN acore_world.creature c ON c.map = hb.mapId AND c.position_x = hb.posX AND c.position_y = hb.posY AND c.position_z = hb.posZ
      JOIN acore_world.creature_template ct ON ct.entry = c.id
      WHERE hb.guid IN (@cast) AND ct.name = 'Innkeeper Allison'
    expect: {scalar: "= 5"}
  - name: brd-encounter-was-credited
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM log_encounter
      WHERE map = 230 AND time >= @t0
    expect: {scalar: ">= 1"}
  - name: no-walk-or-bind-mentions-kargath
    role: check
    log: {pattern: "(walk|bind).*Kargath|Kargath.*(walk|bind)|Shul'kar.*(walk|bind)|(walk|bind).*Shul'kar", expect: {count: 0}}
  - name: alliance-named-home-refusal-was-recorded
    role: check
    log: {pattern: "the 'blackrock-depths' campaign's named home is a Horde inn, which does not serve a Alliance family; it binds at its own inn on the door's map instead", expect: {at_least: 1}}
  - name: nobody-is-bound-in-the-badlands
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM character_homebind WHERE guid IN (@cast) AND zoneId = 3
    expect: {scalar: "= 0"}
  - name: no-cast-member-died-in-the-badlands
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_death WHERE character_guid IN (@cast) AND zone = 3 AND created_at >= @t0
    expect: {scalar: "= 0"}
