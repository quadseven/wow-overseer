# The dungeon finder returns each member to the spot it queued from, so a family that queues scattered
# ends thousands of yards from its inn; the finder rung hearths the family to its inn first (mod-overseer
# issue 1510). The family starts spread over two continents' capitals.
# Scope: the start precondition now requires a PAIR of the cast more than 1000 yards apart (or on another
# map), and the end check requires every living member within 1000 yards of its own bind. The run must have
# ended first (an ended BRD run row is a precondition), so a family still inside the dungeon is INVALID, not
# a pass. The entry points are read against the bind too.
# Fix: mod-overseer pull 1511.
decree: v1
id: finder-rung-hearths-a-scattered-family
proves:
  - {repo: quadseven/mod-overseer, issue: 1510, criterion: "the next finder run of a family spread more than 1000 yards ends with the living members within 1000 yards of the inn"}
fix: {repo: quadseven/mod-overseer, commit: "5e44a0bc4b86d3476a82ef5d66fba645de9f13d2"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 1h
cast:
  - who: family:grug
    set: {alive: true, at: {creature: "Lord Grayson Shadowbreaker"}}
    ceiling: "nothing granted but position"
  - who: Og
    set: {alive: true, at: {creature: "Therum Deepforge"}}
    ceiling: "nothing granted but position"
  - who: Bork
    set: {alive: true, at: {creature: "Dungar Longdrink"}}
    ceiling: "nothing granted but position"
arrange:
  - group: {members: family:grug, leader: Grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "dungeon:blackrock-depths"}
observe:
  - name: family-starts-scattered-more-than-1000-yards
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot a JOIN overseer_snapshot b ON b.guid <> a.guid
      WHERE a.guid IN (@cast) AND b.guid IN (@cast)
        AND (a.map_id <> b.map_id OR POW(a.pos_x - b.pos_x, 2) + POW(a.pos_y - b.pos_y, 2) > 1000000)
    expect: {scalar: ">= 1"}
  - name: a-finder-run-ended
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_run WHERE map_id = 230 AND started_at >= @t0 AND state = 'ended'
    expect: {scalar: ">= 1"}
  - name: living-members-ended-within-1000-yards-of-the-inn
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM characters ch JOIN character_homebind h ON h.guid = ch.guid
      WHERE ch.guid IN (@cast) AND ch.health > 0
        AND (ch.map <> h.mapId OR POW(ch.position_x - h.posX, 2) + POW(ch.position_y - h.posY, 2) > 1000000)
    expect: {scalar: "= 0"}
  - name: entry-points-are-within-1000-yards-of-the-inn
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM character_entry_point e JOIN character_homebind h ON h.guid = e.guid
      WHERE e.guid IN (@cast)
        AND (e.joinMapId <> h.mapId OR POW(e.joinX - h.posX, 2) + POW(e.joinY - h.posY, 2) > 1000000)
    expect: {scalar: "= 0"}
  - name: entry-points-were-written
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM character_entry_point WHERE guid IN (@cast)
    expect: {scalar: ">= 1"}
  - name: no-run-ended-split-failed
    role: check
    when: end
    sql: |
      SELECT id FROM overseer_dungeon_run WHERE map_id = 230 AND started_at >= @t0 AND outcome = 'split_failed'
    expect: {rows: 0}
