# A use-portal row for the leader next to a mage portal walks to the portal, clicks it and reports the
# map before and after, or a named refusal (mod-overseer issue 410). Oz, the Zug family mage, casts a
# portal with the cast verb and Zug stands beside it on Kalimdor.
# Fix: mod-overseer pull 1057.
decree: v1
id: portal-click-by-the-leader
proves:
  - {repo: quadseven/mod-overseer, issue: 410, criterion: "a use-portal row for the leader walks to the mage's portal, clicks it and reports the crossing or a named refusal"}
fix: {repo: quadseven/mod-overseer, commit: "50046831eec63792af9270b77d33e8012e083bed"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 20m
cast:
  - who: family:zug
    set: {alive: true, at: {creature: "Gazlowe"}}
    ceiling: "nothing granted but position"
arrange:
  - group: {members: family:zug, leader: Zug}
act:
  - at: 0s
    command: {who: Oz, kind: cast, text: "portal"}
  - at: 2m
    command: {who: Zug, kind: quest, text: "use-portal"}
observe:
  - name: the-mage-cast-a-portal
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE target_name = 'Oz' AND kind = 'cast' AND created_at >= @t0 AND status IN ('applied', 'delivered')
    expect: {scalar: ">= 1"}
  - name: use-portal-row-resolved
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE target_name = 'Zug' AND kind = 'quest' AND command LIKE 'use-portal%' AND created_at >= @t0 AND status IN ('applied', 'unchanged', 'error')
    expect: {scalar: ">= 1"}
  - name: leader-changed-maps-or-was-refused-by-name
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE target_name = 'Zug' AND command LIKE 'use-portal%' AND created_at >= @t0 AND (status = 'applied' OR detail <> '')
    expect: {scalar: ">= 1"}
