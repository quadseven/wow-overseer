# A split family has its mage and leader on Kalimdor and another member in Undercity. The mage casts a
# portal to the family's map, then the leader uses it (mod-overseer issue 410). Oz must already know the
# spell and hold three Runes of Portals; the decree grants no items. Cast is ordered three times, 12 seconds
# apart, and the leader uses the portal at 56 seconds, within the minute of the last cast.
# Fix: mod-overseer pull 1057.
# Scope: the map before and after the click is read from the character table. A crossing means the row is
# applied AND the leader no longer stands on the start map; a refusal means an error row that carries a reason.
# An unchanged row, or a bare applied row with no crossing, no longer passes, and neither does the bare word
# "refused": measured live, the build before the fix answers a use-portal row with an error row whose whole detail
# is "refused", which is not a named reason (the fixed build crosses, Kalimdor to the Eastern Kingdoms).
decree: v1
id: portal-click-by-the-leader
proves:
  - {repo: quadseven/mod-overseer, issue: 410, criterion: "a use-portal row for the leader walks to the mage's portal, clicks it and reports the crossing or a named refusal"}
fix: {repo: quadseven/mod-overseer, commit: "50046831eec63792af9270b77d33e8012e083bed"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 20m
cast:
  - who: family:zug
    set: {alive: true, at: {captured: undercity-floor-by-the-mailbox}}
    ceiling: "position only; no levels, gear, items or gold are granted"
  - who: Zug
    set: {alive: true, at: {creature: "Gazlowe"}}
    ceiling: "position only; no levels, gear, items or gold are granted"
  - who: Oz
    set: {alive: true, at: {creature: "Gazlowe"}}
    ceiling: "position only; no levels, gear, items or gold are granted"
arrange:
  - group: {members: family:zug, leader: Zug}
act:
  - at: 20s
    command: {who: Oz, kind: cast, text: "11418"}
  - at: 32s
    command: {who: Oz, kind: cast, text: "11418"}
  - at: 44s
    command: {who: Oz, kind: cast, text: "11418"}
  - at: 56s
    command: {who: Zug, kind: quest, text: "use-portal"}
observe:
  - name: leader-starts-on-map-1
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE name = 'Zug' AND map_id = 1
    expect: {scalar: "= 1"}
  - name: family-member-starts-on-destination-map
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE name = 'Uzza' AND map_id = 0
    expect: {scalar: "= 1"}
  - name: mage-knows-spell-and-has-reagents
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_spell WHERE guid = @Oz AND spell = 11418
    expect: {scalar: "= 1"}
  - name: mage-has-three-portal-runes
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_inventory ci
      JOIN item_instance ii ON ii.guid = ci.item
      WHERE ci.guid = @Oz AND ii.itemEntry = 17032 AND ii.count >= 3
    expect: {scalar: ">= 1"}
  - name: the-mage-cast-a-portal
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE target_name = 'Oz' AND kind = 'cast' AND created_at >= @t0 AND status IN ('applied', 'delivered')
    expect: {scalar: ">= 1"}
  - name: use-portal-row-exists
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE target_name = 'Zug' AND kind = 'quest' AND command LIKE 'use-portal%' AND created_at >= @t0
    expect: {scalar: ">= 1"}
  - name: leader-crossed-or-was-refused-by-name
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command c JOIN characters ch ON ch.name = c.target_name
      WHERE c.target_name = 'Zug' AND c.kind = 'quest' AND c.command LIKE 'use-portal%' AND c.created_at >= @t0
        AND ((c.status = 'applied' AND ch.map = 0) OR (c.status = 'error' AND c.detail <> '' AND c.detail <> 'refused'))
    expect: {scalar: ">= 1"}
