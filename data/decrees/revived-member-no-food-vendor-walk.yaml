# A revived member with no food, on a vendor walk interrupted by a fight, has the revived-sickness hold
# released and retaken (mod-overseer issue 1377). Og is revived at the Stormwind graveyard with an empty
# food bag and walks to a vendor.
# Scope: the revived-sickness hold being released and retaken around a fight is a module decision that no row
# records, and a decree cannot start a fight, so neither is arranged nor asserted. What the rows prove: Og starts
# dead AND with no food in his bags (so the vendor walk is owed), and ends having bought food from a vendor, alive,
# with no second death. A generic buy no longer passes: the bought item must be food.
# Fix: mod-overseer pull 1421 (a vendor walk paused for a fight keeps its member).
decree: v1
id: revived-member-no-food-vendor-walk
proves:
  - {repo: quadseven/mod-overseer, issue: 1377, criterion: "a revived member with no food buys food from a vendor and does not die again (the sickness hold release and retake around a fight is not arranged or asserted here)"}
fix: {repo: quadseven/mod-overseer, commit: "e103daa3f042a3847f331833080a92b7aead66e2"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 30m
cast:
  - who: family:grug
    set: {alive: true, at: {creature: "Lord Grayson Shadowbreaker"}}
    ceiling: "nothing granted but position"
  - who: Og
    set: {alive: false, corpse_at: {creature: "Lord Grayson Shadowbreaker"}, at: {graveyard: 1}}
    ceiling: "nothing granted; the death is the scenario"
arrange:
  - group: {members: family:grug, leader: Grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "town run"}
observe:
  - name: og-started-dead
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM corpse WHERE guid = @Og
    expect: {scalar: "= 1"}
  - name: og-has-no-food-at-the-start
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_inventory i JOIN item_instance n ON n.guid = i.item
      JOIN acore_world.item_template t ON t.entry = n.itemEntry
      WHERE i.guid = @Og AND t.class = 0 AND t.subclass = 5 AND t.spellcategory_1 = 11
    expect: {scalar: "= 0"}
  - name: og-reached-a-vendor-and-bought-food
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command c JOIN acore_world.item_template t ON t.entry = CAST(c.target_arg AS UNSIGNED)
      WHERE c.target_name = 'Og' AND c.kind = 'buy' AND c.status = 'delivered' AND c.created_at >= @t0
        AND t.class = 0 AND t.subclass = 5 AND t.spellcategory_1 = 11
    expect: {scalar: ">= 1"}
  - name: og-holds-food-at-the-end
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM character_inventory i JOIN item_instance n ON n.guid = i.item
      JOIN acore_world.item_template t ON t.entry = n.itemEntry
      WHERE i.guid = @Og AND t.class = 0 AND t.subclass = 5 AND t.spellcategory_1 = 11
    expect: {scalar: ">= 1"}
  - name: og-is-alive-at-the-end
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM characters WHERE guid = @Og AND health > 0
    expect: {scalar: "= 1"}
  - name: og-did-not-die-again
    role: check
    when: end
    sql: |
      SELECT character_name, created_at FROM overseer_death WHERE created_at >= @t0 AND character_name = 'Og'
    expect: {rows: 0}
