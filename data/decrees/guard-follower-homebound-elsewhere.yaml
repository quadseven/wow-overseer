# Grug's guard names a safe place on the current map. Ugga's names her bind on
# another map. The fixed module must route the follower to the leader's guard.
# After the walk budget, the judge samples Ugga outside the guarded zone while
# both guards remain set. Clearing a guard and resuming questing is a separate proof.
# Observation aliases cast0 and cast1 refer to the leader and follower in that order.
decree: v1
id: guard-follower-homebound-elsewhere
proves:
  - {repo: quadseven/mod-overseer, issue: 163, criterion: "the follower walks to the leader's same-map guard and stays outside the dangerous zone at each sample after the walk budget"}
fix: {repo: quadseven/mod-overseer, commit: "c04592391453cd1acb77b0c25abab26cfe3f777e"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 45m
cast:
  - who: Grug
    set: {alive: true, health_pct: 100, homebind: {creature: "Hansel Heavyhands"}, at: {creature: "Hansel Heavyhands"}}
    ceiling: "position and homebind only"
  - who: Ugga
    set: {alive: true, health_pct: 100, homebind: {creature: "Gazlowe"}, at: {creature: "Franclorn Forgewright"}}
    ceiling: "position and homebind only"
arrange:
  - group: {members: [Grug, Ugga], leader: Grug}
act:
  - at: 0s
    travel_guard: {who: Grug, enabled: true}
  - at: 0s
    travel_guard: {who: Ugga, enabled: true}
  - at: 0s
    roster: {who: Grug, job: "quest"}
  - at: 0s
    roster: {who: Ugga, job: "quest"}
observe:
  - name: the-follower-starts-in-the-guarded-zone
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot s JOIN characters c ON c.guid = s.guid
      WHERE s.guid = @cast1 AND c.online = 1 AND s.group_leader = @cast0
        AND s.map_id = 0 AND s.zone_id IN (46, 25)
    expect: {scalar: "= 1"}
  - name: the-leader-starts-at-thorium-point
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot s JOIN characters c ON c.guid = s.guid
      JOIN character_homebind h ON h.guid = s.guid
      WHERE s.guid = @cast0 AND c.online = 1 AND s.map_id = h.mapId AND s.zone_id = 51
        AND POW(s.pos_x - h.posX, 2) + POW(s.pos_y - h.posY, 2) + POW(s.pos_z - h.posZ, 2) <= 1600
    expect: {scalar: "= 1"}
  - name: the-follower-and-leader-have-the-required-homebinds
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_homebind
      WHERE (guid = @cast1 AND mapId = 1) OR (guid = @cast0 AND mapId = 0)
    expect: {scalar: "= 2"}
  - name: both-are-in-the-leaders-group
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM `groups` g JOIN group_member m ON g.guid = m.guid
      WHERE g.leaderGuid = @cast0 AND m.memberGuid IN (@cast)
    expect: {scalar: "= 2"}
  - name: both-roster-aims-start-blank
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_roster WHERE name IN ('Grug', 'Ugga')
        AND enabled = 1 AND (travel_npc IS NULL OR travel_npc = '')
    expect: {scalar: "= 2"}
  - name: both-operator-guards-remain-set
    role: precondition
    when: continuous
    sql: |
      SELECT COUNT(*) FROM overseer_roster WHERE enabled = 1 AND (
        (name = 'Grug' AND travel_npc LIKE 'guard:0:%') OR
        (name = 'Ugga' AND travel_npc LIKE 'guard:1:%'))
    expect: {scalar: "= 2"}
  - name: the-quest-orders-were-applied
    role: precondition
    when: end
    sql: |
      SELECT COUNT(DISTINCT target_name) FROM overseer_command
      WHERE target_name IN ('Grug', 'Ugga') AND source = 'eph-judge' AND kind = 'job'
        AND command = 'quest' AND status = 'applied' AND created_at >= @t0
    expect: {scalar: "= 2"}
  - name: both-members-are-still-observable
    role: precondition
    when: continuous
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot s JOIN characters c ON c.guid = s.guid
      WHERE s.guid IN (@cast) AND c.online = 1 AND s.updated_at >= DATE_SUB(NOW(), INTERVAL 30 SECOND)
        AND (s.guid = @cast0 OR s.group_leader = @cast0)
    expect: {scalar: "= 2"}
  - name: a-snapshot-was-written-after-the-walk-budget
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE guid = @cast1
        AND updated_at >= DATE_ADD(@t0, INTERVAL 30 MINUTE)
    expect: {scalar: "= 1"}
  - name: the-follower-stays-at-thorium-point-after-the-walk-budget
    role: check
    when: continuous
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot s
      JOIN character_homebind h ON h.guid = @cast0
      WHERE s.guid = @cast1 AND (
        NOW() < DATE_ADD(@t0, INTERVAL 30 MINUTE) OR
        (s.map_id = h.mapId AND s.zone_id = 51 AND s.health > 0
        AND POW(s.pos_x - h.posX, 2) + POW(s.pos_y - h.posY, 2) + POW(s.pos_z - h.posZ, 2) <= 1600))
    expect: {scalar: "= 1"}
