# Ugga's complete aimed quest is handed in at Marshal McBride; her second,
# incomplete quest is already being worked when a new errand names it. The
# drive must hand in the first quest, clear its aim, then issue one reset for
# the second quest rather than silently keeping a stale objective pointer
# (mod-overseer issue 180).
# Scope: the quest log and the NPC position are the only seeded facts. The new
# aim is exercised by the quest job after the hand-in; no level, item or gold
# is granted. The 35-minute run bounds the issue's 30-minute re-issue count.
# Fix: mod-overseer commit b4a8d52 (hand-in and new-errand reissue).
decree: v1
id: aimed-quest-complete-handin
proves:
  - {repo: quadseven/mod-overseer, issue: 180, criterion: "a COMPLETE aimed quest is handed in and rewarded, then a genuinely new errand naming a quest already being worked causes one reissue; repeated reissues stay in single figures over 30 minutes"}
fix: {repo: quadseven/mod-overseer, commit: "b4a8d52ed13fc02cd3d1415a5d97d47004b5cd85"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 35m
cast:
  - who: family:zug
    set: {alive: true, at: {creature: "Marshal McBride"}}
    ceiling: "nothing granted but position"
  - who: Ugga
    set: {alive: true, quests: {783: complete, 233: incomplete}, at: {creature: "Marshal McBride"}}
    ceiling: "two quest states the issue describes; nothing granted but position"
act:
  - at: 90s
    roster: {who: family:zug, job: "quest"}
observe:
  - name: quest-is-complete-at-the-start
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_queststatus WHERE guid = @Ugga AND quest = 783 AND status = 1
    expect: {scalar: "= 1"}
  - name: second-quest-is-already-being-worked
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_queststatus WHERE guid = @Ugga AND quest = 233 AND status = 3
    expect: {scalar: "= 1"}
  - name: ugga-starts-beside-the-turn-in-npc
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM characters ch JOIN acore_world.creature c ON c.map = ch.map
      JOIN acore_world.creature_template t ON t.entry = c.id
      WHERE ch.guid = @Ugga AND t.name = 'Marshal McBride'
        AND POW(ch.position_x - c.position_x, 2) + POW(ch.position_y - c.position_y, 2) <= 1600
    expect: {scalar: ">= 1"}
  - name: quest-was-handed-in
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM character_queststatus_rewarded WHERE guid = @Ugga AND quest = 783
    expect: {scalar: "= 1"}
  - name: reward-event-written
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_event WHERE character_name = 'Ugga' AND kind = 'quest_reward' AND first_seen >= @t0 AND first_seen <= DATE_ADD(@t0, INTERVAL 30 MINUTE)
    expect: {scalar: ">= 1"}
  - name: the-complete-quest-was-handed-in-to-its-taker
    role: check
    log: {pattern: "'Ugga' handed chosen quest 783 .* in to 'Marshal McBride'", expect: {at_least: 1}}
  - name: the-completed-quest-aim-cleared
    role: check
    when: end
    sql: |
      SELECT drive_quest FROM overseer_roster WHERE name = 'Ugga'
    expect: {scalar: "= 0"}
  - name: the-new-errand-reissues-the-quest-already-being-worked
    role: check
    log: {pattern: "'Ugga' was already on quest 233 .* re-issuing for the new errand", expect: {exactly: 1}}
  - name: quest-reissues-stay-in-single-figures-over-the-observation
    role: check
    log: {pattern: "(re-issuing for the new errand|was already on quest)", expect: {at_most: 9}}
