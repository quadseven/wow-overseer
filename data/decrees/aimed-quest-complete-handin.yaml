# Ugga hands in her complete aimed quest. Separately, Grug selects a quest
# from his own log before a new aim names it. The control already has the
# reissue guard, so the chosen hand-in distinguishes the two arms.
decree: v1
id: aimed-quest-complete-handin
proves:
  - {repo: quadseven/mod-overseer, issue: 180, criterion: "a COMPLETE aimed quest is handed in and rewarded, then a genuinely new errand naming a quest already being worked causes one reissue; repeated reissues stay in single figures over 30 minutes"}
fix: {repo: quadseven/mod-overseer, commit: "b4a8d52ed13fc02cd3d1415a5d97d47004b5cd85"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 35m
cast:
  - who: Ugga
    set: {alive: true, quests: {783: complete}, at: {creature: "Marshal McBride"}}
    ceiling: "quest 783 status and turn-in position only"
  - who: Grug
    set: {alive: true, quests: {233: incomplete}, at: {creature: "Marshal McBride"}}
    ceiling: "quest 233 status and position only"
act:
  - at: 0s
    quest_aim: {who: Ugga, quest: 783}
  - at: 0s
    roster: {who: Ugga, job: "quest"}
  - at: 0s
    roster: {who: Grug, job: "quest"}
  - when: leader-selected-quest-from-own-log
    by: 5m
    quest_aim: {who: Grug, quest: 233}
observe:
  - name: actors-are-online-with-idle-aims
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM characters c JOIN overseer_roster r ON r.name = c.name
      WHERE c.guid IN (@cast) AND c.online = 1 AND r.enabled = 1 AND r.drive_quest = 0
        AND (r.travel_npc IS NULL OR r.travel_npc = '')
    expect: {scalar: "= 2"}
  - name: quest-is-complete-at-the-start
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_queststatus WHERE guid = @cast0 AND quest = 783 AND status = 1
    expect: {scalar: "= 1"}
  - name: complete-quest-is-unrewarded
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_queststatus_rewarded WHERE guid = @cast0 AND quest = 783
    expect: {scalar: "= 0"}
  - name: leader-holds-the-incomplete-quest
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_queststatus WHERE guid = @cast1 AND quest = 233 AND status = 3
    expect: {scalar: "= 1"}
  - name: ugga-starts-within-hand-in-reach
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot s JOIN acore_world.creature c ON c.map = s.map_id
      JOIN acore_world.creature_questender e ON e.id = c.id AND e.quest = 783
      WHERE s.guid = @cast0 AND c.id = 197 AND s.updated_at >= DATE_SUB(NOW(), INTERVAL 30 SECOND)
        AND POW(s.pos_x - c.position_x, 2) + POW(s.pos_y - c.position_y, 2)
          + POW(s.pos_z - c.position_z, 2) <= 400
    expect: {scalar: ">= 1"}
  - name: the-two-quest-jobs-were-applied
    role: precondition
    when: end
    sql: |
      SELECT COUNT(DISTINCT target_name) FROM overseer_command
      WHERE target_name IN ('Ugga', 'Grug') AND source = 'eph-judge'
        AND kind = 'job' AND command = 'quest' AND status = 'applied' AND created_at >= @t0
    expect: {scalar: "= 2"}
  - name: leader-selected-quest-from-own-log
    role: check
    log: {pattern: "'Grug' now working quest 233 .* picked from its own log", expect: {at_least: 1}}
  - name: quest-was-handed-in
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM character_queststatus_rewarded WHERE guid = @cast0 AND quest = 783
    expect: {scalar: "= 1"}
  - name: reward-event-written
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_event WHERE character_guid = @cast0
        AND kind = 'quest_reward' AND subject_id = 783 AND first_seen >= @t0
    expect: {scalar: ">= 1"}
  - name: the-complete-quest-was-handed-in-to-its-taker
    role: check
    log: {pattern: "'Ugga' handed chosen quest 783 .* in to 'Marshal McBride'", expect: {at_least: 1}}
  - name: the-completed-quest-aim-cleared
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_roster WHERE name = 'Ugga' AND drive_quest = 0
    expect: {scalar: "= 1"}
  - name: the-new-errand-reissues-the-quest-already-being-worked
    role: check
    log: {pattern: "'Grug' was already on quest 233 .* re-issuing for the new errand", expect: {exactly: 1}}
  - name: quest-reissues-stay-in-single-figures-over-the-observation
    role: check
    log: {pattern: "('Grug' was already on quest 233 |'Ugga' was already on quest 783 )", expect: {at_most: 9}}
