# An aimed council quest that reaches COMPLETE on a family member is handed in and the rewarded row
# appears within 30 minutes (mod-overseer issue 180). Ugga holds 'A Threat Within' (quest 783) as complete
# beside the quest's turn-in NPC; the drive must hand it in.
# Scope: the reward event must fall inside the first 30 minutes of a 35 minute window (an upper bound the
# issue states), so a hand-in at minute 31 does not pass. The handed-in line ("handed chosen quest 783 ... in
# to") is worldserver text and is required at least once, and the re-issue line for quest 783 ("was already on
# quest ... re-issuing for the new errand", one line carrying both phrases) may appear at most 9 times
# (wow-overseer issue 2767). That count runs over the whole 35 minute window, which is stricter than the 30
# minutes the issue names, never looser. The rewarded row is the game's own record of the hand-in.
# Ugga starts at Marshal McBride, the turn-in NPC of quest 783, and a precondition witnesses she is within 40
# yards of his spawn, so the run tests the hand-in and not a long route.
# Fix: mod-overseer pull 1103 (the hand-in and aim stability check).
decree: v1
id: aimed-quest-complete-handin
proves:
  - {repo: quadseven/mod-overseer, issue: 180, criterion: "an aimed quest that reaches COMPLETE is handed in: the log shows the handed chosen quest line, a rewarded row exists, the reward event falls within 30 minutes, and re-issue lines for the quest stay in single figures"}
fix: {repo: quadseven/mod-overseer, commit: "c1aef8cd489f78fb768a420166086909006ef4ed"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 35m
cast:
  - who: Ugga
    set: {alive: true, quests: {783: complete}, at: {creature: "Marshal McBride"}}
    ceiling: "one quest state the issue describes; no level, item or gold"
act:
  - at: 0s
    roster: {who: Ugga, job: "quest"}
observe:
  - name: quest-is-complete-at-the-start
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_queststatus WHERE guid = @Ugga AND quest = 783 AND status = 1
    expect: {scalar: "= 1"}
  - name: ugga-starts-beside-the-turn-in-npc
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM characters ch JOIN acore_world.creature c ON c.map = ch.map
      JOIN acore_world.creature_template t ON t.entry = c.id
      WHERE ch.guid = @Ugga AND t.name = 'Marshal McBride'
        AND POW(ch.position_x - c.position_x, 2) + POW(ch.position_y - c.position_y, 2) <= 1600
    expect: {scalar: ">= 1"}
  - name: quest-was-handed-in
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM character_queststatus_rewarded WHERE guid = @Ugga AND quest = 783
    expect: {scalar: "= 1"}
  - name: reward-event-written
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_event WHERE character_name = 'Ugga' AND kind = 'quest_reward' AND first_seen >= @t0 AND first_seen <= DATE_ADD(@t0, INTERVAL 30 MINUTE)
    expect: {scalar: ">= 1"}
  # The two lines issue 180 names; pinned to the module source by tests/test_eph_required_lines.py.
  - name: the-hand-in-was-logged
    role: check
    log: {pattern: "'Ugga' handed chosen quest 783 \\(.*\\) in to '", expect: {at_least: 1}}
  - name: re-issue-lines-stay-in-single-figures
    role: check
    log: {pattern: "'Ugga' was already on quest 783 \\(.*\\) by its own choice - re-issuing for the new errand", expect: {at_most: 9}}
