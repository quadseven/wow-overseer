# A raid-supply cook seat with campfire reagents casts once per step after the town-stop craft change
# (wow-overseer issue 1897). Grog is the cook; the reagents (Spice Bread ingredients) are a bounded
# grant for this scenario only. Evidence is overseer_command rows of kind cast from the raidsupply source.
# Scope: both counts are scoped to the cook cast character, so another seat's casts cannot satisfy or flood them.
# Fix: wow-overseer pull 1903.
decree: v1
id: raid-supply-cook-casts-once-per-step
proves:
  - {repo: quadseven/wow-overseer, issue: 1897, criterion: "the raid-supply cooking count per hour after the change is recorded"}
fix: {repo: quadseven/wow-overseer, commit: "479c6b9a32b7bc5ba26329d7a3ef09246b58fcb4"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 1h
cast:
  - who: guild:Cave:cook
    set: {alive: true, skills: {Cooking: {value: 150, max: 150}}, items: [{name: "Mild Spices", count: 20}, {name: "Simple Flour", count: 40}], at: {creature: "Stephen Ryback"}}
    ceiling: "a Cooking rank the issue reports and two stackable reagents; no level, gold or gear"
act:
  - at: 0s
    command: {who: "cast[0]", kind: job, text: "craft:cooking"}
observe:
  - name: cook-holds-the-reagents
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_inventory i JOIN item_instance n ON n.guid = i.item WHERE i.guid = @cast0 AND n.itemEntry IN (2678, 30817)
    expect: {scalar: ">= 1"}
  - name: cook-cast-rows-written
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command c JOIN characters ch ON ch.name = c.target_name
      WHERE ch.guid IN (@cast) AND c.kind = 'cast' AND c.source LIKE 'raidsupply:cook%' AND c.created_at >= @t0
    expect: {scalar: ">= 1"}
  - name: one-cast-per-step-not-a-flood
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command c JOIN characters ch ON ch.name = c.target_name
      WHERE ch.guid IN (@cast) AND c.kind = 'cast' AND c.source LIKE 'raidsupply:cook%' AND c.created_at >= @t0
    expect: {scalar: "<= 60"}
