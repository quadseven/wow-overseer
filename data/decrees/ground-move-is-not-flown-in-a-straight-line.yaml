# A ground move longer than the navmesh's point limit is not flown as a straight spline (issue 2937).
# On the dev realm a family leader ran a ruler-straight line to a trainer 3000 yards away, 186 yards over
# the ground, because MovementAction::MoveTo launches the two-point path PathGenerator gives a player when
# the navmesh cannot carry the move (a route past 74 points is PATHFIND_SHORT, an off-mesh end is
# NOT_USING_PATH). This reproduces it with the playerbots `go x;y` command, which hands MoveTo a point with
# no distance bound.
# Why the cast is the grouped family (issue 3279): at the pinned mod-playerbots commit, GoAction::Execute
# returns false immediately when GetMaster() is null. A solo headless bot has no master, so `go` rows were
# marked delivered and silently did nothing in batch 1bd18f. Seeding family:zug grouped at Gorrik lets
# KeepRosterFollowing assign a non-null master (KeepLeaderItsOwnMaster for the leader, SetMaster(leader)
# for followers) within one 30s PARTY_POLL_MS poll.
# Act: after 45s (past one party poll), an initial 40-yard on-mesh `go` step along the bearing toward
# Stonard moves Uzza away from Gorrik in both arms so `uzza-moved-from-start` proves `go` actually moves
# her (a run where nothing moved is INVALID, never PASS). Repeated `go` commands 350 yards further along
# that bearing (390 yards from Gorrik, past the 296-yard point limit) then trigger PATHFIND_SHORT.
# Control: MoveTo launches the straight line and Uzza is carried onto the far point (FAIL).
# Treatment: MoveTo refuses it (mod-overseer patch 0029, the build's 0053), so she stays near the 40-yard
# step and is never carried onto the far point (PASS).
# The family is put on job 'rest' so no errand of the module's walks them there by road instead.
# Scope: what is asserted is the end position against the start and the commanded point, not the height of
# the line on the way (the ground under a moving character is not in any table); the airborne guard's own
# line is not asserted, because the control image has no guard and a check must fail there for the same
# reason.
# Fix: mod-overseer pull 1630, named by its squash merge on main: fix presence asks whether the commit is an
# ancestor of each image's pin, and the branch commit of the pull is an ancestor of neither.
decree: v1
id: ground-move-is-not-flown-in-a-straight-line
proves:
  - {repo: quadseven/wow-overseer, issue: 2937, criterion: "a ground move past the navmesh point limit is refused rather than launched as a straight spline, so the character is not carried onto the commanded point"}
fix: {repo: quadseven/mod-overseer, commit: "b4f28d4f4fb1b7e55f335f3586d11684e22e7d90"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 7m
cast:
  - who: family:zug
    set: {alive: true, health_pct: 100, at: {creature: "Gorrik"}}
    ceiling: "nothing granted but position"
arrange:
  - group: {members: family:zug, leader: Zug}
act:
  - at: 0s
    roster: {who: family:zug, job: "rest"}
  - at: 45s
    command: {who: family:zug, kind: bot, text: "go -6670.5;-2189.0"}
  - at: 90s
    command: {who: family:zug, kind: bot, text: "go -7007.0;-2285.1"}
  - at: 150s
    command: {who: family:zug, kind: bot, text: "go -7007.0;-2285.1"}
  - at: 210s
    command: {who: family:zug, kind: bot, text: "go -7007.0;-2285.1"}
  - at: 270s
    command: {who: family:zug, kind: bot, text: "go -7007.0;-2285.1"}
observe:
  - name: cast-online
    role: precondition
    when: start
    online: cast
  - name: uzza-starts-at-kargath
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE name = 'Uzza' AND map_id = 0
        AND SQRT(POW(pos_x + 6632.0, 2) + POW(pos_y + 2178.0, 2)) < 15
    expect: {scalar: "= 1"}
  - name: the-go-rows-reached-the-bot
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE target_name = 'Uzza' AND kind = 'bot' AND command LIKE 'go %' AND created_at >= @t0 AND status IN ('applied', 'delivered', 'unchanged')
    expect: {scalar: ">= 2"}
  - name: uzza-moved-from-start
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE name = 'Uzza' AND map_id = 0
        AND SQRT(POW(pos_x + 6632.0, 2) + POW(pos_y + 2178.0, 2)) >= 20
    expect: {scalar: "= 1"}
  - name: uzza-was-not-carried-onto-the-point
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE name = 'Uzza' AND map_id = 0
        AND SQRT(POW(pos_x + 7007.0, 2) + POW(pos_y + 2285.1, 2)) < 40
    expect: {scalar: "= 0"}
  - name: uzza-did-not-die
    role: check
    when: end
    sql: |
      SELECT character_name, created_at FROM overseer_death WHERE created_at >= @t0 AND character_name = 'Uzza'
    expect: {rows: 0}
