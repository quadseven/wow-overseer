# A family member starts at the reported Fishing value of 49/75, fishes to 75, then visits the
# Journeyman trainer. The check reads the skill maximum in character_skills, not a command status
# (mod-overseer issue 447). The pole and sufficient trainer money must already be in the world.
# This decree proves the Journeyman cap change only; Expert, Artisan and the Master quest remain outside it.
# Fix: mod-overseer pull 1110.
decree: v1
id: fishing-rank-up-at-the-journeyman-trainer
proves:
  - {repo: quadseven/mod-overseer, issue: 447, criterion: "after a trainer visit past Apprentice, the skill maximum for Fishing reflects the new cap"}
fix: {repo: quadseven/mod-overseer, commit: "f03e59ec87c2cee6b17a25e3b52ca1dd499a3049"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 4h
cast:
  - who: Ugga
    set: {alive: true, skills: {Fishing: {value: 49, max: 75}}, at: {creature: "Lee Brown"}}
    ceiling: "only the issue's reported Fishing value and cap; no levels, gear, items or gold are granted"
act:
  - at: 0s
    roster: {who: Ugga, job: "fish"}
  - when: fishing-reached-75
    roster: {who: Ugga, job: "train"}
observe:
  - name: fishing-starts-at-49-of-75
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_skills WHERE guid = @Ugga AND skill = @skill_fishing AND value = 49 AND max = 75
    expect: {scalar: "= 1"}
  - name: pole-already-in-bags
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_inventory ci
      JOIN item_instance ii ON ii.guid = ci.item
      WHERE ci.guid = @Ugga AND ii.itemEntry = 6256
    expect: {scalar: ">= 1"}
  - name: trainer-money-already-available
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM characters WHERE guid = @Ugga AND money >= 5000
    expect: {scalar: "= 1"}
  - name: fishing-reached-75
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM character_skills WHERE guid = @Ugga AND skill = @skill_fishing AND value >= 75
    expect: {scalar: "= 1"}
  - name: fishing-maximum-rose
    role: check
    when: end
    sql: |
      SELECT max FROM character_skills WHERE guid = @Ugga AND skill = @skill_fishing
    expect: {scalar: "> 75"}
  - name: trainer-fee-was-paid
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM characters WHERE guid = @Ugga AND money < @money_start
    expect: {scalar: "= 1"}
