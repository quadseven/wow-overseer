# Scope note: only the ten roster characters can be cast by name, so this decree runs the raid with
# ten seats. The 40-seat case in the issue is not representable here; the check is the per-seat behaviour.
# The seats come from overseer_raid_seat, which the bridge writes from an operator order, so the first
# precondition witnesses them: a world with no seats is INVALID, never a pass.
# Majordomo Executus is not a creature spawn row (a script summons him after the prerequisite bosses), so
# the family is placed at Golemagg and the run must reach him. At the encounter, casters hold on the Magic
# Reflection shield (issue 767) including for an area spell (issue 1659), and no raider dies to reflected
# damage. The precondition reads the core's credit for Majordomo himself and fails the run as INVALID if the
# encounter is never reached.
# Scope: the holding line ("[MC] majordomo: N casters holding, magic reflection on <add>", patch 0017, logger
# playerbots at info) is required at least once in the run's log (wow-overseer issue 2767). The tank retaking
# adds after Teleport Target is still not claimed: patch 0020 logs nothing and leaves no row. The damage-target
# path and the area-target path (issue 1659) write the same holding line, so a world still does not tell them
# apart. Also proven: the encounter is reached and credited by the core, no raider is killed by the shielded
# adds or by Majordomo, at most three raiders die at the encounter, and no death line names reflection.
# Fix: wow-overseer pull 1663 (area-target reflect hold).
decree: v1
id: majordomo-reflect-hold
proves:
  - {repo: quadseven/wow-overseer, issue: 767, criterion: "casters hold on a Magic Reflection add, shown by the holding line in the log, and no raider dies to reflected damage at Majordomo (the tank re-take is outside this decree)"}
  - {repo: quadseven/wow-overseer, issue: 1659, criterion: "no raider dies to the shielded adds in a credited Majordomo encounter (area versus damage targeting is not distinguishable here)"}
fix: {repo: quadseven/wow-overseer, commit: "e40c8878685ccac66320288a253eb4c3b0d7ac18"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 2h
cast:
  - who: family:grug
    set: {alive: true, at: {creature: "Golemagg the Incinerator"}}
    ceiling: "nothing granted but position"
arrange:
  - instance: {map: "Molten Core", as: mc, bind: family:grug}
  - group: {members: family:grug, leader: Grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "raid:moltencore"}
observe:
  - name: seats-were-written
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_raid_seat WHERE family IN ('Grug', 'Zug')
    expect: {scalar: ">= 5"}
  # The core marks Majordomo DONE in the bound instance when the last add dies and he surrenders.
  - name: majordomo-encounter-credited
    role: precondition
    when: end
    encounter: {instance: mc, boss: "Majordomo Executus"}
  - name: no-raider-died-to-reflected-damage
    role: check
    when: end
    sql: |
      SELECT character_name, killer_name FROM overseer_death WHERE created_at >= @t0 AND map = 409 AND (killer_name LIKE '%Flamewaker%' OR killer_name LIKE '%Majordomo%')
    expect: {rows: 0}
  - name: few-raiders-died-at-the-encounter
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_death WHERE created_at >= @t0 AND map = 409
    expect: {scalar: "<= 3"}
  - name: no-reflected-damage-death-line
    role: check
    log: {pattern: "died to (reflected|its own) (damage|spell)", expect: {count: 0}}
  # The line patch 0017 writes when casters hold; pinned to that patch by tests/test_eph_required_lines.py.
  - name: casters-held-on-a-magic-reflection-add
    role: check
    log: {pattern: "\\[MC\\] majordomo: [0-9]+ casters holding, magic reflection on ", expect: {at_least: 1}}
