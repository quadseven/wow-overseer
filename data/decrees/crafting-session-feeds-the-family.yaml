# A crafting session with a gatherer, a crafter and a trade: the crafted item carries its creator on the
# bags, the skill rises, and the town errand to the trainer happens (mod-overseer issue 1012). Grug crafts
# smithing, Grog mines and engineers; the family trades what the family wants.
# Scope: the skill rise and the trainer errand (issue 1012) are NOT asserted. A decree has no start value for
# a skill the cast does not seed, and the errand is bridge log text a decree can only forbid. The trade is
# scoped to the two cast characters and to the window (settled_at), and the crafted items must carry one of
# their creator guids.
# Fix: mod-overseer pull 1061.
decree: v1
id: crafting-session-feeds-the-family
proves:
  - {repo: quadseven/mod-overseer, issue: 1012, criterion: "crafted items carry a cast creator and a trade settles for the two characters in the session (the skill rise and the trainer errand are not asserted here)"}
fix: {repo: quadseven/mod-overseer, commit: "f00db15e0ebe6ff4833c00b4429c88aabd90073d"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 2h
cast:
  - who: Grug
    set: {alive: true, at: {creature: "Karen Taylor"}}
    ceiling: "nothing granted but position"
  - who: Grog
    set: {alive: true, at: {creature: "Karen Taylor"}}
    ceiling: "nothing granted but position"
act:
  - at: 0s
    roster: {who: family:grug, job: "craft"}
observe:
  - name: both-are-on-craft
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_roster WHERE name IN ('Grug', 'Grog') AND job <> ''
    expect: {scalar: "= 2"}
  - name: crafts-were-recorded
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_event WHERE character_name = 'Grug' AND last_seen >= @t0 AND kind = 'craft'
    expect: {scalar: ">= 1"}
  - name: crafted-items-carry-a-creator
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE creatorGuid IN (@cast0, @cast1)
    expect: {scalar: ">= 1"}
  - name: a-trade-was-settled-for-the-two-characters
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_trade WHERE character_name IN ('Grug', 'Grog') AND status = 'settled' AND settled_at >= @t0
    expect: {scalar: ">= 1"}
