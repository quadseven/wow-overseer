# A bounded Uldaman and Maraudon run observes the party walking through each
# EXIT door without the five-minute backstop giving up (mod-overseer issue 1414).
# Scope: this demonstrates one bounded exit per dungeon; the 72-hour live rates
# remain a separate check and are not claimed here.
# Fix: mod-overseer pull 1415.
decree: v1
id: long-dungeon-exits-count-walking-progress
proves:
  - {repo: quadseven/mod-overseer, issue: 1414, criterion: "a bounded Uldaman and Maraudon EXIT lets a walking party reach its door instead of being given up on after five minutes"}
fix: {repo: quadseven/mod-overseer, commit: "02fc60117173db51df10559788933473d86b704f"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 90m
cast:
  - who: family:grug
    set: {alive: true, health_pct: 100, at: {creature: "Archaedas"}}
    ceiling: "nothing granted but position"
  - who: family:zug
    set: {alive: true, health_pct: 100, at: {creature: "Princess Theradras"}}
    ceiling: "nothing granted but position"
arrange:
  - group: {members: family:grug, leader: Grug}
  - instance: {map: "Uldaman", as: uld, bind: family:grug}
  - group: {members: family:zug, leader: Zug}
  - instance: {map: "Maraudon", as: mara, bind: family:zug}
act:
  - at: 90s
    roster: {who: family:grug, job: "dungeon:uldaman"}
  - at: 90s
    roster: {who: family:zug, job: "dungeon:maraudon"}
observe:
  - name: uldaman-encounter-credited
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM log_encounter
      WHERE map = 70 AND time >= @t0
    expect: {scalar: ">= 1"}
  - name: maraudon-encounter-credited
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM log_encounter
      WHERE map = 349 AND time >= @t0
    expect: {scalar: ">= 1"}
  - name: uldaman-party-walks-out-through-trigger-288
    role: check
    log:
      pattern: "all 5 roster members came back out through areatrigger 288 and are on map 0 - the run is over"
      expect: {at_least: 1}
  - name: maraudon-party-walks-out-through-trigger-3131
    role: check
    log:
      pattern: "all 5 roster members came back out through areatrigger 3131 and are on map 0 - the run is over"
      expect: {at_least: 1}
  - name: no-uldaman-run-stalled
    role: check
    when: end
    sql: |
      SELECT id FROM overseer_dungeon_run
      WHERE map_id = 70 AND started_at >= @t0 AND outcome = 'stalled'
    expect: {rows: 0}
  - name: no-maraudon-run-stalled
    role: check
    when: end
    sql: |
      SELECT id FROM overseer_dungeon_run
      WHERE map_id = 349 AND started_at >= @t0 AND outcome = 'stalled'
    expect: {rows: 0}
  - name: no-exit-hearth-was-used
    role: check
    when: end
    sql: |
      SELECT id FROM overseer_dungeon_run_event
      WHERE created_at >= @t0 AND kind = 'exit_hearth' AND family IN ('Grug', 'Zug')
    expect: {rows: 0}
