# Classification of every acore_characters table for the ephemeral-world forge.
#
# Format: <table>: <class> [<spec>]
#   keep           rows survive unchanged (config, bookkeeping, learned data)
#   truncate       every row removed (logs, stale runtime state, pending work)
#   scrub          rows survive, named columns reset (spec names the rule in forge/scrub.py)
#   per-character rows survive only for kept characters (spec: key column,
#                  or `col > parent.col` to follow a parent table that is trimmed first)
#
# tests/test_forge_classes.py fails when a table in the schema fixture has no class,
# so a new table cannot leak stale state into every future world.

