  card.append(head, meta, stream, bar, hp, where, warn, quests, btn, note, box);
  fcards.appendChild(card);
  c = { card, nm, chip, combat, lead, meta, stream, bar, fill, hp, where, warn,
        quests, qhead, qlist, btn, note, box, video, vnote, full, stop };
  c.player = makePlayer(video, (t, cls) => setNote(vnote, t, cls), box);
  btn.onclick = () => familyWatch(name);
  stop.onclick = () => familyStop();
  full.onclick = () => goFullscreen(box, video, (t, cls) => setNote(vnote, t, cls));
  fam.cards.set(name, c);
  return c;
}

// --- the broadcasts, one per character card (infra#2892, moved infra#3110) -
//
// Independent of the watch/POV cards above: those five paths are ALREADY
// live, continuously, from encoders this page never starts and never stops -
// family.broadcast_path's own docstring covers why the URL comes from the
// server rather than being built here. There is no "requested/starting/
// live" lifecycle and no heartbeat for these, only a WHEP handshake per
// tile, reusing the SAME makePlayer() this file already built to be shared
// across surfaces (the panel and the watch cards were the "TWO SURFACES" in
// makePlayer's own comment; this is the third).
//
// TILES ARE BUILT ONCE, exactly like the cards above and for the same
// reason, and MOVED rather than rebuilt: re-parenting an existing <video>
// node keeps its PeerConnection alive, while recreating the element would
// tear the connection down and re-buffer a stream that was already playing
// fine, over a click that only meant "look at this one instead".
//
// WHAT infra#3110 CHANGED, AND WHAT IT DID NOT. A tile is now parented into
// its own character's card rather than into a shared focus slot and a
// thumbnail strip; "focused" became a class on the tile instead of a place
// it gets moved to. The handshake, the retry, the offline message and the
// focused-tile-only fullscreen and native controls are all untouched.
const broadcasts = { tiles: new Map(), focus: null, connected: false };

function broadcastTile(name) {
  let t = broadcasts.tiles.get(name);
  if (t) return t;
  const tile = el("div", "ftile");
  const video = document.createElement("video");
  video.muted = true; video.autoplay = true; video.playsInline = true;
  video.setAttribute("muted", ""); video.setAttribute("playsinline", "");
  const ov = el("div", "fov");
  const top = el("div", "ftop");
  const nm = el("span", "fovname");
  // The button lives in the overlay's top row rather than beside the tile so
  // it travels with it: layoutBroadcasts() re-parents this same node into
  // whichever card the member belongs to, and anything anchored outside it
  // would have to be moved in step and would drift the first time that was
  // forgotten.
  const full = el("button", "ffull", "fullscreen");
  const fsnote = el("span", "ffsnote");
  top.append(nm, full, fsnote);
  const bottom = el("div");
  const bar = el("div", "fovbar");
  const fill = el("div", "fovfill");
  bar.appendChild(fill);
  const zone = el("div", "fovzone");
  bottom.append(bar, zone);
  ov.append(top, bottom);
  const off = el("div", "foffline");
  tile.append(video, ov, off);
  tile.onclick = () => promoteBroadcast(name);
  // stopPropagation because the tile's own click promotes it: without this the
  // tap would ALSO run promoteBroadcast, which on the focused tile is a no-op
  // today and would silently become a second action the day that changes.
  //
  // A REFUSAL IS SHOWN, not swallowed - goFullscreen already insists on that
  // (see its comment), and it is only true if the caller actually renders the
  // sentence. It clears itself so a stale complaint cannot sit over a picture
  // that has since gone fullscreen fine.
  full.onclick = (e) => {
    e.stopPropagation();
    goFullscreen(tile, video, (text) => {
      fsnote.textContent = text;
      window.setTimeout(() => {
        if (fsnote.textContent === text) fsnote.textContent = "";
      }, 6000);
    });
  };
  const player = makePlayer(video, (text, cls) => {
    // Honest degrade (requirement #3 of the Twitch view): "warn" is
    // makePlayer's word for every way this can fail to be a live picture -
    // no encoder on the path yet, the gaming box not answering, a dropped
    // connection - and each already carries its own sentence (whepFailure,
    // above). The overlay shows THAT sentence rather than a generic
    // "offline", the same "own the handshake, own the explanation" rule the
    // panel's player follows - and it beats a frozen or black rectangle
    // either way.
    if (cls === "warn") {
      tile.classList.add("offline");
      off.textContent = name + " - " + (text || "not broadcasting");
    } else if (cls === "live") {
      tile.classList.remove("offline");
    }
  }, tile);
  t = { tile, video, nm, fill, zone, off, player, started: false };
  broadcasts.tiles.set(name, t);
  return t;
}

// Moves the DOM node, not the connection - see the block comment above.
function layoutBroadcasts() {
  for (const [name, t] of broadcasts.tiles) {
    const big = name === broadcasts.focus;
    t.tile.classList.toggle("focused", big);
    // NATIVE CONTROLS ON THE FOCUSED TILE ONLY, and this is the thing that
    // actually makes fullscreen reachable on a phone. The `fullscreen` button
    // added alongside goFullscreen() is a scripted call, and iOS Safari gives
    // a <video> its own fullscreen affordance for free through the native
    // control bar - the same one a person already knows from YouTube. Asking
    // them to find our button instead of the one their thumb expects was the
    // wrong half of the problem to solve.
    //
    // ONLY the focused tile. Controls on a thumbnail would put a play/scrub
    // bar over a 150px picture and, worse, swallow the tap that promotes it,
    // so the grid would stop responding to the gesture it exists for.
    t.video.controls = big;
    // HOME IS THE CHARACTER'S OWN CARD, focused or not. familyCard() builds
    // the card on demand and is idempotent, so this works whichever of the
    // two polls answers first - the quest log alone is enough to draw a card
    // for somebody who is not in the world.
    const target = familyCard(name).stream;
    // The SLOT carries the size, because the tile's own display is
    // makePlayer's to set - see the .fstream comment in the stylesheet.
    target.classList.toggle("big", big);
    if (t.tile.parentElement !== target) target.appendChild(t.tile);
  }
}

function promoteBroadcast(name) {
  if (broadcasts.focus === name) return;
  broadcasts.focus = name;
  layoutBroadcasts();
}

function renderBroadcasts(p) {
  if (!broadcasts.focus && p.members.length) broadcasts.focus = p.members[0].name;
  const now = Date.now();
  for (const m of p.members) {
    const t = broadcastTile(m.name);
    // classList operations, never a className RESET: "offline" and
    // "focused" are set from elsewhere between polls (the WHEP note
    // callback, a thumbnail click) and a wholesale reset here would erase
    // whichever fired most recently since the last render.
    t.tile.classList.remove("c-ok", "c-hurt", "c-dead", "c-gone");
    t.tile.classList.add(m.present ? "c-" + m.condition : "c-gone");
    t.tile.classList.toggle("focused", m.name === broadcasts.focus);
    t.nm.textContent = m.present ? m.name + " - L" + m.level + " " + m["class"] : m.name;
    t.fill.style.width = (m.present ? m.health_pct : 0) + "%";
    t.zone.textContent = m.present ? m.zone : "not in the world";
    // t.off's text is NOT set here - the note callback above owns it, with
    // the exact reason the connection is not live. Overwriting it on every
    // 5s poll would replace a real answer ("the gaming box is not
    // answering") with a placeholder before anyone had a chance to read it.
    if (!broadcasts.connected || !m.broadcast_url) continue;
    // A tile that has never connected starts immediately. One already
    // marked offline gets a slow retry - the encoder it is waiting on is
    // one of five real WoW clients, not something this page controls, and
    // it can start publishing at any time with nobody having touched the
    // tab. makePlayer.start() no-ops on a repeat of the SAME url, so a
    // genuine retry needs stop() first - deliberate, not a workaround: it
    // is the same "tear the old one down before asking for the next" rule
    // familyWatch already follows when switching characters.
    const isOffline = t.tile.classList.contains("offline");
    if (!t.started) {
      t.started = true;
      t.lastAttempt = now;
      t.player.start(m.name, m.broadcast_url);
    } else if (isOffline && (!t.lastAttempt || now - t.lastAttempt > 20000)) {
      t.lastAttempt = now;
      t.player.stop();
      t.player.start(m.name, m.broadcast_url);
    }
  }
  layoutBroadcasts();
}

// Opened here, but the CONNECTIONS happen from renderBroadcasts on the next
// poll - showView calls pollFamily() right after this, and renderBroadcasts
// is the one place that already knows each member's current broadcast_url.
function startBroadcasts() {
  broadcasts.connected = true;
}

// Same rule showView already follows for the watch cards: leaving the tab
// stops the PICTURE, never the broadcast itself - these encoders are not
// this page's to stop, and nothing here has ever asked them to run.
function stopBroadcasts() {
  broadcasts.connected = false;
  for (const [, t] of broadcasts.tiles) {
    t.player.stop();
    t.started = false;
    t.tile.classList.remove("offline");
  }
}

function renderFamily(p) {
  fam.byName = new Map(p.members.map((m) => [m.name, m]));
  renderBroadcasts(p);
  const bits = [p.here + " of " + p.expected + " here"];
  if (p.dead) bits.push(p.dead === 1 ? "1 DEAD" : p.dead + " DEAD");
  if (p.in_combat) bits.push(p.in_combat + " fighting");
  fheadline.textContent = bits.join("  -  ");
  fheadline.className = p.dead ? "alarm" : "";
  for (const m of p.members) {
    const c = familyCard(m.name);
    c.card.className = "fcard c-" + m.condition;
    c.nm.textContent = m.name;
    c.chip.style.display = "";
    if (m.condition === "dead") c.chip.className = "fchip dead", c.chip.textContent = "DEAD";
    else if (m.condition === "gone") c.chip.className = "fchip gone", c.chip.textContent = "not in the world";
    else if (m.condition === "hurt") c.chip.className = "fchip hurt", c.chip.textContent = "hurt";
    else c.chip.style.display = "none";
    c.combat.style.display = m.combat ? "" : "none";
    c.lead.style.display = m.leader ? "" : "none";
    if (!m.present) {
      // Still says WHO is missing. A card stripped down to a name is how a
      // logged-out character stops being noticed, which is the whole
      // complaint this tab answers.
      c.meta.textContent = m["class"] + " - " + m.role;
      c.bar.style.display = "none";
      c.hp.textContent = "";
      c.where.textContent = "not in the world - logged out, or the "
        + "worldserver dropped them.";
      c.warn.style.display = "none";
      continue;
    }
    c.meta.textContent = "L" + m.level + " " + m["class"] + " - " + m.role;
    c.bar.style.display = "";
    c.fill.style.width = m.health_pct + "%";
    c.hp.textContent = m.condition === "dead"
      ? "dead - 0 / " + m.max_health
      : m.health + " / " + m.max_health + "  (" + m.health_pct + "%)";
    c.where.textContent = m.zone;
    // stream.pov_changes_the_family says in as many words that the UI must
    // not hide this, and until now nothing on this page said it out loud.
    c.warn.style.display = m.pov_changes_the_family ? "" : "none";
    c.warn.textContent = m.pov_changes_the_family
      ? "watching " + m.name + " in POV makes him a selfbot, and the other "
        + "four take him as their master and follow. It stops when you stop."
      : "";
  }
  updateFamilyButtons();
}

function updateFamilyButtons() {
  const ch = fam.channels;
  const full = ch !== null && ch.used >= ch.max;
  for (const [name, c] of fam.cards) {
    const m = fam.byName.get(name);
    const mine = fam.open === name;
    c.stop.style.display = mine ? "" : "none";
    c.full.style.display = mine ? "" : "none";
    c.btn.style.display = mine ? "none" : "";
    if (mine) continue;
    if (m && !m.present) {
      c.btn.disabled = true;
      c.btn.textContent = "not in the world";
    } else if (full && !fam.open) {
      // BOTH CHANNELS ARE SPOKEN FOR. One GPU runs two clients, so a third
      // tap cannot succeed - and saying so on the button is the difference
      // between an honest no and forty seconds of spinner ending in a
      // refusal. The button is where the person is already looking.
      c.btn.disabled = true;
      c.btn.textContent = "both channels busy (" + ch.used + "/" + ch.max + ")";
    } else if (fam.open) {
      c.btn.disabled = false;
      c.btn.textContent = "switch to " + name;
    } else {
      c.btn.disabled = false;
      c.btn.textContent = "watch " + name;
    }
  }
}

// --- the quest log (infra#3110) -------------------------------------------
//
// WHAT IT IS FOR. Two defects that shape every play session were invisible
// because nothing anywhere counted them (questlog.py's docstring carries the
// measurements). Both are COMPARISONS, which is why they belong on a page
// that already draws all five characters at once:
//
//   mod-overseer#73 - a quest log at the client's cap of 25 silently refuses
//   every new quest, and a character that CANNOT take quests looks exactly
//   like one that has chosen not to. The slot count is the whole fix here.
//
//   mod-overseer#28 - five separate quest logs, so the same kill pays only
//   whoever holds the quest. Every quest says who else is carrying it, and
//   the ones nobody else is carrying are marked.
//
// Nothing on this page decides any of that: questlog.py does, and this
// renders what it decided. A second opinion in the browser about what counts
// as a full log is a second answer that can disagree with the first.
const fquesthead = document.getElementById("fquesthead");
// The last-rendered shape of each member's log. Quest rows ARE rebuilt - they
// are text, not a live connection - but only when something actually moved,
// so a poll that changes nothing does not throw away a half-read list under
// somebody's thumb.
const quested = new Map();
// HOW MANY QUESTS A CARD SHOWS BEFORE IT FOLDS. Sixty-five quests across five
// characters is nine thousand pixels of phone scrolling, and a card whose log
// runs to twenty-two rows buries the next character's stream under it. The
// FOLD IS SAFE ONLY BECAUSE THE HEADER LINE ALREADY CARRIES EVERY NUMBER the
// two defects are made of - slots used against the cap, how many nobody else
// holds, how many are far below their level. Folding a list whose totals were
// not stated would be hiding the thing this view exists to show.
const QUEST_PREVIEW = 5;
const questsOpen = new Set();

function questSignature(m) {
  return m.quests.map((q) => q.id + ":" + q.status + ":" + q.held_by.length
    + ":" + q.objectives.map((o) => o.have).join("/")).join(",");
}

function questHeadline(m) {
  if (!m.present) return "no saved character to read a quest log from";
  // Slots FIRST and always, even at four of twenty-five. It is the number
  // that was missing, and a number that only appears once it is bad is a
  // number nobody learns to read.
  const bits = [m.used + " of " + m.slots + " quest slots"];
  if (m.ready) bits.push(m.ready + " ready to hand in");
  if (m.failed) bits.push(m.failed + " failed");
  if (m.outleveled) bits.push(m.outleveled + " far below their level");
  if (m.used) bits.push(m.alone + " nobody else holds");
  bits.push(m.turned_in + " turned in");
  return bits.join("  -  ");
}

function questRow(q, me) {
  const box = el("div", "fq " + q.status + (q.alone ? " alone" : "")
    + (q.outleveled ? " old" : ""));
  const top = el("div", "fqtop");
  top.append(el("span", "fqlvl", "L" + (q.level || "?")),
             el("span", "fqname", q.title));
  // A chip only where there is something to say. "active" on twenty rows is
  // twenty pieces of furniture; the bar underneath already says that much.
  if (q.ready) top.appendChild(el("span", "fqchip", "hand in"));
  else if (q.failed) top.appendChild(el("span", "fqchip", "failed"));
  if (q.outleveled) top.appendChild(el("span", "fqchip", "outlevelled"));
  box.appendChild(top);
  if (q.progress_pct !== null) {
    const bar = el("div", "fqbar");
    const fill = el("div", "fqfill");
    fill.style.width = q.progress_pct + "%";
    bar.appendChild(fill);
    box.appendChild(bar);
  }
  for (const o of q.objectives) {
    box.appendChild(el("div", "fqobj" + (o.done ? " done" : ""),
      o.what + "  " + o.have + " / " + o.need));
  }
  // Said out loud rather than left blank. Plenty of quests count nothing at
  // all - a delivery, a conversation, a place to walk to - and an empty space
  // under a title reads as "the page failed to load the objectives".
  if (!q.objectives.length && !q.ready) {
    box.appendChild(el("div", "fqobj", "nothing counted - a delivery, a "
      + "conversation, or somewhere to walk to"));
  }
  // THE #28 LINE. Who else is carrying this, by name, on every single quest.
  // Four names means the fight pays four of them; no names means it pays one.
  const others = q.held_by.filter((n) => n !== me);
  box.appendChild(el("div", "fqheld" + (others.length ? "" : " alone"),
    others.length ? "also " + others.join(", ") : "nobody else holds this"));
  return box;
}

function renderQuestLog(m) {
  const c = familyCard(m.name);
  c.qhead.textContent = questHeadline(m);
  c.qhead.className = "fqhead" + (m.full ? " alarm" : "");
  const sig = questSignature(m);
  if (quested.get(m.name) === sig) return;
  quested.set(m.name, sig);
  const open = questsOpen.has(m.name);
  const rows = (open ? m.quests : m.quests.slice(0, QUEST_PREVIEW))
    .map((q) => questRow(q, m.name));
  if (!rows.length && m.present) {
    rows.push(el("div", "fqobj", "an empty quest log - nothing accepted"));
  }
  if (m.quests.length > QUEST_PREVIEW) {
    // Says how many and WHERE they are, because the order is meaningful:
    // what is hidden is the oldest and least-progressed end of the log,
    // which is exactly the dead weight worth going to look at.
    const more = el("button", "fqmore", open ? "show fewer"
      : (m.quests.length - QUEST_PREVIEW) + " more, oldest last");
    more.onclick = () => {
      if (open) questsOpen.delete(m.name); else questsOpen.add(m.name);
      // Force the rebuild the signature would otherwise skip: nothing about
      // the DATA changed, which is the whole reason that guard exists.
      quested.delete(m.name);
      renderQuestLog(m);
    };
    rows.push(more);
  }
  // replaceChildren, and ONLY here: this list is text the server just
  // recomputed, with no <video> and no PeerConnection anywhere in it. The
  // cards themselves are still built once and updated in place.
  c.qlist.replaceChildren(...rows);
}

function renderQuests(p) {
  const spread = p.turn_in_spread;
  const bits = [p.held + " quests across " + p.expected + " logs"];
  if (p.held) bits.push(p.alone + " held by only one of them");
  bits.push(p.everyone ? p.everyone + " held by all of them"
                       : "none held by all of them");
  if (spread && spread.gap) {
    bits.push("turn-ins " + spread.most + " " + spread.most_count
      + " to " + spread.least + " " + spread.least_count);
  }
  fquesthead.textContent = bits.join("  -  ");
  // Loud when most of the work is being carried alone, which is the state
  // mod-overseer#28 describes and the state the family has been in all along.
  fquesthead.className = p.alone > p.shared ? "alarm" : "";
  for (const m of p.members) renderQuestLog(m);
}

// THIRTY seconds, and the departure from the page's 5s cadence is deliberate
// - the same reasoning the Armory tab's poll carries at the foot of this
// file. Quest rows are SAVED state: the core writes them on its own player
// save timer, so they physically cannot change faster than that, and a 5s
// poll would re-fetch an identical 23KB payload six times per actual change.
// Entering the tab polls immediately, so it is never blank while waiting.
async function pollQuests() {
  if (view !== FAMILY_VIEW) return;
  try {
    const r = await fetch("/api/questlog");
    if (!r.ok) throw new Error(r.status);
    renderQuests(await r.json());
  } catch (e) {
    // Keep the logs that are drawn, for the same reason the cards are kept:
    // an empty quest log means "they have nothing to do", which is the
    // opposite of what a failed read actually found out.
    fquesthead.textContent = "the world is unreachable - these quest logs "
      + "may be stale";
    fquesthead.className = "alarm";
  }
}

// POV AND ONLY POV. "watch them" (follow-cam) is not implemented and answers
// with a refusal after about forty seconds of pointless client bring-up
// (infra#2887), so this tab does not offer it at all - a button whose only
// outcome is a wasted minute is worse than no button.
async function familyWatch(name) {
  // Tear the previous one down BEFORE asking for the next, or a switch leaves
  // the first character's video playing under the second character's name -
  // the exact confusion this whole feature exists to remove.
  if (fam.open && fam.open !== name) await familyStop();
  fam.open = name;
  const c = familyCard(name);
  setNote(c.note, "asking for a client...");
  updateFamilyButtons();
  const res = await requestWatch(name, "pov");
  if (fam.open !== name) return;
  if (!res.ok) {
    setNote(c.note, res.body.error || "could not start", "warn");
    fam.open = null;
    updateFamilyButtons();
    return;
  }
  refreshFamilyWatch();
}

async function familyStop() {
  const name = fam.open;
  if (!name) return;
  fam.open = null;
  const c = fam.cards.get(name);
  if (c) { c.player.stop(); setNote(c.note, ""); }
  if (watch.timer) { clearInterval(watch.timer); watch.timer = null; }
  watch.name = null;
  updateFamilyButtons();
  await watchPost(name, "stop").catch(() => {});
}

async function refreshFamilyWatch() {
  if (view !== FAMILY_VIEW) return;
  // Polled even with nobody being watched, for two reasons: it is how the
  // cards learn that both channels are spoken for by somebody else, and every
  // read of this endpoint is also the SWEEP that expires streams whose viewer
  // went quiet. Merely having this tab open keeps the world tidy.
  const name = fam.open || "";
  let s;
  try {
    const r = await fetch("/api/watch?name=" + encodeURIComponent(name));
    s = await r.json();
  } catch (e) { return; }
  fam.channels = { used: s.channels_in_use, max: s.max_channels };
  if (s.heartbeat_seconds) watch.every = s.heartbeat_seconds * 1000;
  if (!name || fam.open !== name) { updateFamilyButtons(); return; }
  const c = fam.cards.get(name);
  if (!c) return;
  const v = watchView(s);
  setNote(c.note, v.text, v.cls);
  if (v.embed) c.player.start(name, v.embed); else c.player.stop();
  if (!s.watching) {
    // The row ended - honoured, refused, or swept. The reason is already on
    // screen above; the card goes back to offering a watch underneath it.
    fam.open = null;
    if (watch.timer) { clearInterval(watch.timer); watch.timer = null; }
    watch.name = null;
  }
  updateFamilyButtons();
}

async function pollFamily() {
  if (view !== FAMILY_VIEW) return;
  try {
    const r = await fetch("/api/family");
    if (!r.ok) throw new Error(r.status);
    renderFamily(await r.json());
  } catch (e) {
    // Keep the cards that are drawn. A Family tab that blanks on a failed
    // poll is indistinguishable from a family who all logged out at once.
    fheadline.textContent = "the world is unreachable - these cards may be stale";
    fheadline.className = "alarm";
  }
}

function markTabs() {
  for (const b of document.querySelectorAll("#tabs button")) {
    // This was a two-view ternary hard-coded to the Family tab, which meant a
    // third button fell into the map branch, compared an undefined dataset.id
    // against `current`, and could never light up at all. Now a button either
    // names its own view or it is a continent.
    const on = b.dataset.view
      ? view === b.dataset.view
      : view === MAP_VIEW && b.dataset.id === current;
    b.classList.toggle("on", on);
  }
}

// The view IS the address (infra#3110). Before this the page had no routing
// at all: every load landed on the map, and there was no way to send anybody
// a link to anything else. The family is now the front door, so IT is the
// bare URL and the other views name themselves.
function hashFor(v) {
  // The map carries its continent, or a link to it would forget which one
  // was being looked at - the one piece of state that view actually has.
  if (v === MAP_VIEW) return "#" + MAP_VIEW + "/" + current;
  return "#" + v;
}

// replaceState, never an assignment to the hash. Assigning fires hashchange,
// which calls straight back into here, and a tab tap is a change of view
// rather than a new page in somebody's history - five taps should not mean
// five presses of Back to leave the site. Typed and pasted hashes still
// arrive through the hashchange listener at the foot of the file, which is
// the case that actually matters.
function showView(v) {
  view = v;
  const want = hashFor(v);
  if (location.hash !== want) history.replaceState(null, "", want);
  const isFam = v === FAMILY_VIEW;
  const isArm = v === ARMORY_VIEW;
  fsection.style.display = isFam ? "block" : "none";
  asection.style.display = isArm ? "block" : "none";
  // Every non-map view hides the canvas and its legend. This used to read
  // "not Family means map", which would have drawn the map underneath the
  // Armory tab the moment a third view existed.
  wrapEl.style.display = view === MAP_VIEW ? "block" : "none";
  legend.style.display = view === MAP_VIEW ? "" : "none";
  markTabs();
  if (isFam) {
    // The panel is a map thing, and leaving it open behind a hidden canvas
    // would keep a second heartbeat and a second player alive off screen.
    closePanel();
    startBroadcasts();
    pollFamily();
    pollQuests();
    refreshFamilyWatch();
    return;
  }
  if (isArm) {
    // Nothing to tear down: the Armory is a read, with no player and no
    // heartbeat of its own. It still closes the panel and stops the grid,
    // which are map and Family things that would otherwise go on running
    // behind a view that does not show them.
    closePanel();
    stopBroadcasts();
    pollArmory();
    return;
  }
  stopBroadcasts();
  // LEAVING THE TAB DOES NOT STOP THE STREAM, for the same reason closing the
  // panel does not: a viewer may well switch to the map, or put the phone
  // down, and keep watching elsewhere. The video goes now because it is
  // pulling 6Mbit across the tailnet into something nobody can see; the
  // heartbeat stopping is what ends the stream, and the server's staleness
  // sweep is the one mechanism that cannot be fooled by how a page was left.
  if (fam.open) {
    const c = fam.cards.get(fam.open);
    if (c) { c.player.stop(); setNote(c.note, ""); }
    fam.open = null;
    if (watch.timer) { clearInterval(watch.timer); watch.timer = null; }
    watch.name = null;
    updateFamilyButtons();
  }
}

setInterval(pollFamily, 5000);         // the family rides the same 5s cadence
setInterval(refreshFamilyWatch, 5000); // and so does the watch it owns
setInterval(pollQuests, 30000);        // quest rows are a save, not a stream

loadZones().then(() => { poll(); setInterval(poll, 5000); });
setInterval(fetchPanel, 5000);  // panel rides the same 5s snapshot cadence
setInterval(refreshMind, 5000);  // and so does the thought stream
setInterval(refreshFrame, 5000);  // and so does their own screen
// AND SO DOES THE WATCH STATE, which it did not until infra#2663's player
// landed. requested -> starting -> live happens over a MINUTE on the agent's
// clock, entirely on the other side of the database; without a poll the panel
// said "waiting for a client" until somebody thought to click the dot again,
// and a stream that had genuinely come up was never rendered at all.
setInterval(refreshWatch, 5000);
setInterval(render, 200);  // combat pulse
window.addEventListener("resize", render);

// --- the Armory tab (infra#3096) -----------------------------------------
// Deliberately at the FOOT of the script, AFTER loadZones().then(...). The
// Family tab's tests slice this page from its own banner down to that call,
// so anything dropped between the two gets swept into a slice it has nothing
// to do with and starts failing assertions about a different tab.

const asection = document.getElementById("armory");
const acols = document.getElementById("acols");
const aheadline = document.getElementById("aheadline");
// Set here rather than in the markup so the sentence lives with the code that
// makes it true. Every number on this tab is a SAVE, not a live read.
document.getElementById("asaved").textContent =
  "gear and talents as the world last saved them - the core writes these on "
  + "its own timer, so something equipped in the last few minutes may not be "
  + "here yet.";

// Columns and their slot rows are built ONCE and updated in place, the same
// rule the Family cards follow. Five columns of nineteen rows rebuilt every
// poll would throw away the scroll position mid-read on a phone, which is
// the one device this is most likely to be checked from.
const arm = { cols: new Map() };

function armoryColumn(name) {
  let c = arm.cols.get(name);
  if (c) return c;
  const col = el("article", "acol");
  const nm = el("div", "aname", name);
  const meta = el("div", "ameta");
  const sum = el("div", "asum");
  const slots = el("div", "aslots");
  const spec = el("div", "aspec");
  const budget = el("div");
  const trees = el("div");
  col.append(nm, meta, el("div", "asect", "gear"), sum, slots,
             el("div", "asect", "build"), spec, budget, trees);
  acols.appendChild(col);
  c = { col, nm, meta, sum, slots, spec, budget, trees, rows: new Map() };
  arm.cols.set(name, c);
  return c;
}

function armorySlot(c, slot) {
  let r = c.rows.get(slot);
  if (r) return r;
  const row = el("div", "aslot");
  const k = el("span", "k", slot);
  const v = el("span", "v");
  row.append(k, v);
  c.slots.appendChild(row);
  r = { row, k, v };
  c.rows.set(slot, r);
  return r;
}

function renderSlot(r, s) {
  r.row.className = "aslot" + (s.empty ? " empty" : "")
    + (s.cosmetic ? " cosmetic" : "") + (s.broken ? " broken" : "");
  r.v.textContent = "";
  if (s.empty) {
    // The word, not a blank. A blank cell reads as "nothing to report", and
    // an empty head slot on a level 25 warrior is very much something to
    // report - it is the entire reason for looking.
    r.v.textContent = "empty";
    return;
  }
  // No quality class at all when the item is not in item_template: better an
  // uncoloured name than a confident wrong colour.
  r.v.appendChild(el("span", s.quality === null ? "" : "q" + s.quality, s.name));
  if (s.item_level !== null) {
    r.v.appendChild(el("span", "ailvl", " " + s.item_level));
  }
  if (s.broken) r.v.appendChild(el("span", "", " BROKEN"));
}

function renderSpec(c, spec) {
  c.spec.textContent = spec.primary
    ? spec.distribution + "  " + spec.primary
    : "nothing spent";
  let budget = spec.available === null
    ? spec.spent + " points spent"
    : spec.spent + " / " + spec.available + " points";
  if (spec.unspent) budget += "  -  " + spec.unspent + " UNSPENT";
  c.budget.textContent = budget;
  c.budget.className = spec.unspent ? "aunspent" : "";
  c.trees.textContent = "";
  // Only the trees with points in them. Three headers where two are always
  // zero is three lines of furniture per character; the distribution above
  // already says the shape.
  for (const t of spec.trees.concat(
         spec.unplaced.length
           ? [{ name: "not in the talent tables", points: spec.unplaced.length,
                talents: spec.unplaced }]
           : [])) {
    if (!t.points) continue;
    const box = el("div", "atree");
    box.appendChild(el("div", "t", t.name + "  " + t.points));
    for (const tal of t.talents) {
      const line = el("div", "atal");
      line.appendChild(el("span", "r",
        tal.rank === null ? "?" : tal.rank + "/" + tal.max_rank));
      line.appendChild(el("span", "n", tal.name));
      box.appendChild(line);
    }
    c.trees.appendChild(box);
  }
}

function renderArmory(p) {
  const present = p.members.filter((m) => m.present);
  const empty = present.reduce((n, m) => n + m.gear.empty_slots.length, 0);
  const broken = present.reduce((n, m) => n + m.gear.broken.length, 0);
  const idle = present.filter((m) => m.spec.unspent);
  const bits = [present.length + " of " + p.expected + " shown"];
  if (empty) bits.push(empty + (empty === 1 ? " empty slot" : " empty slots"));
  if (broken) bits.push(broken + " broken");
  if (idle.length) {
    bits.push("unspent: "
      + idle.map((m) => m.name + " " + m.spec.unspent).join(", "));
  }
  aheadline.textContent = bits.join("  -  ");
  // Loud only for the two things a person can act on TODAY. Empty slots are
  // ordinary at these levels and would leave the headline permanently pink,
  // which is the same as leaving it permanently unread.
  aheadline.className = broken || idle.length ? "alarm" : "";
  for (const m of p.members) {
    const c = armoryColumn(m.name);
    // Green edge means logged in right now, the same thing green means on
    // the Family cards. Absent the character entirely and it goes grey.
    c.col.className = "acol" + (m.present ? (m.online ? " c-ok" : "") : " c-gone");
    if (!m.present) {
      // Still says who, and still says what. A column stripped to a name is
      // how a missing character stops being noticed.
      c.meta.textContent = m["class"] + " - " + m.role;
      c.sum.textContent = "no saved character - deleted, or never made.";
      c.slots.textContent = "";
      c.rows.clear();
      c.spec.textContent = "";
      c.budget.textContent = "";
      c.trees.textContent = "";
      continue;
    }
    c.meta.textContent = "L" + m.level + " " + m.race + " " + m["class"]
      + " - " + m.role;
    c.sum.textContent = m.gear.worn + " / " + m.gear.slots + " worn"
      + (m.gear.average_item_level === null ? ""
         : "  -  item level " + m.gear.average_item_level);
    const bySlot = new Map(m.slots.map((s) => [s.slot, s]));
    // Driven by the SERVER's slot list, not by this member's rows, so every
    // column has the same rows in the same order and the grid reads across.
    for (const spec of p.slots) {
      renderSlot(armorySlot(c, spec.slot), bySlot.get(spec.slot));
    }
    renderSpec(c, m.spec);
  }
}

async function pollArmory() {
  if (view !== ARMORY_VIEW) return;
  try {
    const r = await fetch("/api/armory");
    if (!r.ok) throw new Error(r.status);
    renderArmory(await r.json());
  } catch (e) {
    // Keep the grid that is drawn, exactly as the Family tab does. A blank
    // Armory reads as "they are wearing nothing", which is a worse lie than
    // an old answer honestly labelled.
    aheadline.textContent = "the world is unreachable - this may be stale";
    aheadline.className = "alarm";
  }
}

// THIRTY seconds, and the departure from the page's 5s cadence is the point.
// The core writes gear and talents to the database on its own save timer -
// fifteen minutes on this realm - so these rows physically cannot change any
// faster. Polling them every five seconds would re-fetch an identical 20KB
// payload a hundred and eighty times per actual change. Entering the tab
// still polls immediately, so it is never blank while waiting for the timer.
setInterval(pollArmory, 30000);

// --- the front door (infra#3110) ------------------------------------------
//
// THE FAMILY IS THE HOMEPAGE. Opening this page used to land on the map, and
// the map answers "who is in the world" - five hundred dots, on a phone,
// when the question actually being asked is "are my five all right". The
// Family tab has been the first button under the thumb since infra#2892;
// this makes it the first thing on the screen as well.
//
// AND EVERY OTHER VIEW IS STILL A LINK. #map, #map/530 and #armory all open
// straight onto themselves, which nothing on this page could do before -
// there was no routing at all, so "send me the Armory" was not a thing that
// could be said. Anything unrecognised falls back to the family rather than
// to a blank page.
//
// DECLARED HERE AND READ FROM loadZones(), which is called further up the
// file. That is safe rather than lucky: loadZones awaits its two fetches on
// its first line, so everything after the await runs in a microtask, and a
// microtask cannot run until this script has finished executing.
let wantedContinent = "";

function adoptContinent() {
  // Only once zones.json is in: before that there is nothing to check an id
  // against, and adopting an unchecked one draws an empty map.
  if (wantedContinent && zones && zones[wantedContinent]) current = wantedContinent;
  wantedContinent = "";
}

function applyHash() {
  const raw = (location.hash || "").replace(/^#/, "");
  const cut = raw.indexOf("/");
  const name = cut < 0 ? raw : raw.slice(0, cut);
  if (name === MAP_VIEW) {
    wantedContinent = cut < 0 ? "" : raw.slice(cut + 1);
    adoptContinent();
    showView(MAP_VIEW);
    render();
    return;
  }
  showView(name === ARMORY_VIEW ? ARMORY_VIEW : FAMILY_VIEW);
}

window.addEventListener("hashchange", applyHash);
// Synchronously, at the foot of the script rather than inside loadZones's
// promise, for two reasons. The family view needs no map data, so waiting on
// two JSON fetches to draw it would put a blank page in front of the one
// question this page exists to answer. And showView touches the Armory tab's
// own elements, which are `const`s declared in the block above this one -
// calling it any earlier than here is a temporal-dead-zone ReferenceError.
applyHash();
</script>
</body>
</html>
