<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Where this copy is mounted (basepath.py). Every URL the app builds
     starts from this, never from the origin, so a realm served under a
     prefix reads its own world. -->
<meta name="overseer-base" content="__OVERSEER_BASE__">
<meta name="overseer-page" content="__OVERSEER_PAGE__">
<!-- The app build this page was served with (appbuild.py); app/update.js
     compares it with /api/realm's app_build. -->
<meta name="overseer-build" content="__OVERSEER_BUILD__">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overseer">
<!-- The bar color behind the page: each theme's background token (tokens.css).
     Once the app is up, main.js sets both to the theme in use. -->
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161826">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e4e7f5">
<title>Overseer</title>
<link rel="manifest" href="__OVERSEER_BASE__/manifest.webmanifest">
<link rel="apple-touch-icon" href="__OVERSEER_BASE__/apple-touch-icon.png">
<link rel="icon" type="image/png" href="__OVERSEER_BASE__/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<script>
  // The theme the operator picked, before the first paint, so a light
  // choice never flashes dark. No choice means the system's.
  (function () {
    try {
      var t = window.localStorage.getItem("overseer.theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* storage off: the system decides */ }
  })();
</script>
<link rel="stylesheet" href="__OVERSEER_BASE__/app/tokens.css">
<link rel="stylesheet" href="__OVERSEER_BASE__/app/app.css">
<!-- Phosphor icons, regular and fill, pinned with integrity hashes. -->
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" integrity="sha384-6p9AefaqUhEVheRlj1mpAkbngHXy9mbYMrIdcIt4Jlc9lOLIablJq3bBsLOjGwZ7" crossorigin="anonymous">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" integrity="sha384-pPVoXE8ft+zxKtxIDDI7SfTK6y95NHm4qa+hKEg/hs8VkjW5IP+9/dGOPCbDpUPl" crossorigin="anonymous">
<script type="application/json" id="overseer-nav">__OVERSEER_NAV__</script>
</head>
<body>
<button type="button" class="skip" data-action="skip">Skip to the page</button>
<div id="app" class="app"></div>
<noscript><p style="padding:24px">Overseer needs JavaScript to show the realm.</p></noscript>
<script type="module" src="__OVERSEER_BASE__/app/main.js"></script>
</body>
</html>
