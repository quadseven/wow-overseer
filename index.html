<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azeroth Overseer</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3;
          --dim:#8b949e; --alliance:#4d9fff; --horde:#ff4d4d; --neutral:#d4b106;
          --mortal:#7ee787; --thought:#a371f7; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text);
         font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { display:flex; align-items:baseline; gap:1rem; padding:.7rem 1rem;
           border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { font-size:1.05rem; }
  #census { color:var(--dim); }
  /* Pushed to the far end of the header: it leaves this site for a
     different machine, so it should not sit among the live readouts. */
  #recordings { margin-left:auto; color:var(--dim); text-decoration:none;
                border:1px solid var(--line); border-radius:4px;
                padding:.15rem .5rem; font-size:.85rem; }
  #recordings:hover { color:var(--text); }
  #stale { display:none; background:#6e2c00; color:#ffd8a8; padding:.3rem 1rem; }
  nav { display:flex; gap:.4rem; padding:.6rem 1rem; flex-wrap:wrap; }
  nav button { background:var(--panel); color:var(--text); border:1px solid var(--line);
               padding:.3rem .8rem; border-radius:6px; cursor:pointer; font:inherit; }
  nav button.on { border-color:var(--alliance); color:var(--alliance); }
  #wrap { position:relative; margin:0 1rem 1rem; }
  canvas { width:100%; background:var(--panel); border:1px solid var(--line);
           border-radius:8px; display:block; }
  #tip { position:absolute; pointer-events:none; display:none; background:#000c;
         border:1px solid var(--line); border-radius:6px; padding:.35rem .6rem;
         white-space:nowrap; }
  footer { color:var(--dim); padding:0 1rem 1rem; }
  .sw { display:inline-block; width:.7em; height:.7em; border-radius:50%; }
  /* Character panel: a fixed overlay so opening it never reflows the map
     and never widens the page (the no-horizontal-scroll rule). */
  #panel { display:none; position:fixed; top:0; right:0; bottom:0;
           width:min(340px, 92vw); overflow-y:auto; overflow-x:hidden;
           background:var(--panel); border-left:1px solid var(--line);
           padding:.8rem 1rem; z-index:10; }
  #panel h2 { font-size:1rem; }
  #phead { display:flex; justify-content:space-between; align-items:baseline; }
  #pclose { background:none; border:1px solid var(--line); border-radius:6px;
            color:var(--dim); cursor:pointer; font:inherit; padding:0 .5rem; }
  #panel .sect { color:var(--dim); margin:.8rem 0 .2rem;
                 border-bottom:1px solid var(--line); }
  #panel .bar-track { background:var(--bg); border:1px solid var(--line);
                      border-radius:4px; height:.8em; overflow:hidden; }
  #panel .bar-fill { background:var(--mortal); height:100%; }
  #panel .row { display:flex; gap:.6rem; }
  #panel .row .k { color:var(--dim); min-width:5.5em; flex-shrink:0; }
  #panel .row .v { overflow-wrap:anywhere; }
  #panel .note { color:var(--dim); }
  #pwbtns { display:flex; gap:.4rem; flex-wrap:wrap; }
  #pwbtns button { background:var(--bg); color:var(--text); border:1px solid var(--line);
                   padding:.3rem .6rem; cursor:pointer; font:inherit; }
  #pwbtns button:disabled { opacity:.45; cursor:default; }
  #pwnote { margin-top:.35rem; white-space:pre-wrap; overflow-wrap:anywhere; }
  /* The live player (infra#2663). 16:9 so the box is the shape of the
     stream before a single frame has arrived - a player that resizes when
     video appears makes the whole panel jump under the cursor. */
  #pwvideo { margin-top:.5rem; display:none; position:relative; }
  #pwvid { width:100%; aspect-ratio:16/9; display:block; background:#000;
           border:1px solid var(--line); border-radius:6px; }
  #pwvnote { margin-top:.25rem; }
  #pwvnote.warn { color:#d29922; }
  #pwvnote.live { color:#7ee787; }
  #pwframe { margin-top:.5rem; display:none; }
  #pwimg { width:100%; display:block; border:1px solid var(--line); border-radius:6px;
           background:var(--bg); }
  #pwfnote { margin-top:.25rem; }
  #pwfnote.warn { color:#d29922; }
  #pwnote.live { color:#7ee787; }
  #pwnote.warn { color:#d29922; }
  #panel .gone { color:#ffd8a8; }
  /* Thought timeline (infra#2604): one stream, both surfaces. The left
     border is the source, so a Discord line and a web line are told apart
     at a glance without reading them. */
  #ptimeline { max-height:38vh; overflow-y:auto; overflow-x:hidden;
               border:1px solid var(--line); border-radius:6px;
               background:var(--bg); padding:.3rem; }
  .th { border-left:3px solid var(--dim); padding:.15rem .4rem; margin:.25rem 0;
        overflow-wrap:anywhere; }
  .th .meta { color:var(--dim); font-size:.85em; }
  .th.s-event { border-left-color:var(--dim); }
  .th.s-chat { border-left-color:var(--alliance); }
  .th.s-command { border-left-color:var(--neutral); }
  .th.s-goal { border-left-color:var(--mortal); }
  .th.s-reflection { border-left-color:var(--thought); }
  .th.overseer { background:#161b2288; }
  .th.pending { opacity:.55; }
  #pmore { width:100%; margin-top:.3rem; background:var(--panel); color:var(--dim);
           border:1px solid var(--line); border-radius:6px; cursor:pointer;
           font:inherit; padding:.2rem; }
  #pchat { display:flex; gap:.3rem; margin-top:.4rem; }
  #pinput { flex:1; min-width:0; background:var(--bg); color:var(--text);
            border:1px solid var(--line); border-radius:6px; padding:.3rem .4rem;
            font:inherit; }
  #psay { background:var(--panel); color:var(--text); border:1px solid var(--line);
          border-radius:6px; cursor:pointer; font:inherit; padding:.3rem .6rem; }
  #psay:disabled, #pinput:disabled { opacity:.5; cursor:default; }
  /* --- the Armory tab (infra#3096) ---------------------------------------
     Gear and build for all five at once. The columns are CHARACTERS and the
     rows are SLOTS, and that arrangement is the whole feature: a slot that is
     empty in one column and filled in the other four is the thing you are
     looking for, and it is invisible until they are beside each other. Five
     separate pages would each look perfectly reasonable on their own.

     Same responsive posture as the Family cards - one column on a phone,
     auto-fit on a desktop - with one extra step: the moment there is room for
     five it is exactly five, because auto-fit would otherwise settle into
     three-and-a-gap and quietly stop being a side-by-side view. */
  #armory { display:none; margin:0 1rem 1rem; }
  #aheadline { margin-bottom:.2rem; overflow-wrap:anywhere; }
  #aheadline.alarm { color:#ff9d9d; }
  /* Said out loud because these numbers are OLD and nobody can tell by
     looking. The core writes gear and talents on its own save timer, so a
     sword equipped a minute ago is genuinely not here yet - and a page that
     let someone conclude "the tab is broken" would be worse than no page. */
  #asaved { color:var(--dim); margin-bottom:.6rem; font-size:.9rem; }
  #acols { display:grid; gap:.6rem; grid-template-columns:1fr; }
  @media (min-width:820px) {
    #acols { grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
  }
  @media (min-width:1480px) { #acols { grid-template-columns:repeat(5,1fr); } }
  .acol { background:var(--panel); border:1px solid var(--line);
          border-left:5px solid var(--line); border-radius:8px;
          padding:.6rem .7rem; min-width:0; }
  .acol.c-ok { border-left-color:var(--mortal); }
  .acol.c-gone { border-left-color:var(--line); opacity:.6; }
  .aname { font-weight:bold; }
  .ameta { color:var(--dim); overflow-wrap:anywhere; }
  .asum { margin:.4rem 0; overflow-wrap:anywhere; }
  .asect { color:var(--dim); border-top:1px solid var(--line);
           margin-top:.5rem; padding-top:.4rem; font-size:.9rem; }
  .aslot { display:flex; gap:.4rem; align-items:baseline; }
  .aslot .k { color:var(--dim); flex:0 0 5.4rem; font-size:.85rem; }
  .aslot .v { flex:1; min-width:0; overflow-wrap:anywhere; }
  .ailvl { color:var(--dim); font-size:.85rem; }
  /* An empty slot is the headline finding, so it is amber and it says the
     word - the same amber the Family card already uses for "hurt", because it
     means the same kind of thing. Shirt and tabard are only ever cosmetic, so
     an empty one is merely dim: an alarm that fires on every character
     forever is an alarm nobody reads. */
  .aslot.empty .v { color:#d29922; }
  .aslot.empty.cosmetic .v { color:var(--dim); }
  .aslot.broken .v { color:var(--horde); }
  .aspec { font-weight:bold; }
  .aunspent { color:#d29922; }
  .atree { margin-top:.3rem; }
  .atree .t { color:var(--dim); font-size:.85rem; }
  .atal { display:flex; gap:.4rem; align-items:baseline; }
  .atal .r { color:var(--dim); flex:0 0 2.2rem; font-size:.85rem;
             text-align:right; }
  .atal .n { flex:1; min-width:0; overflow-wrap:anywhere; }
  /* ITEM QUALITY, in the game's own colours, because the operator already
     reads them without thinking. One deliberate departure: rare is lifted
     from the client's #0070dd, which the game draws on a near-black tooltip
     and which lands under 3:1 on this panel - a name nobody can read is not a
     colour code, it is a bug. The hue is unmistakably still rare blue. */
  .q0 { color:#9d9d9d; }
  .q1 { color:#ffffff; }
  .q2 { color:#1eff00; }
  .q3 { color:#3f9bf5; }
  .q4 { color:#a335ee; }
  .q5 { color:#ff8000; }
  .q6 { color:#e6cc80; }
  .q7 { color:#00ccff; }
  /* --- the Family tab (infra#2892) ---------------------------------------
     Five cards instead of five dots among five hundred. Sized for a thumb on
     a 390px phone FIRST and widened on a desktop, rather than the other way
     round: the map is already the desktop's answer, and this tab exists
     because that answer does not survive being shrunk to a phone. */
  #family { display:none; margin:0 1rem 1rem; }
  #fheadline { margin-bottom:.6rem; overflow-wrap:anywhere; }
  #fheadline.alarm { color:#ff9d9d; }
  #fcards { display:grid; gap:.6rem; grid-template-columns:1fr; }
  /* One column until there is honestly room for two. minmax(320px,1fr) with
     a 1fr floor means a card never gets narrower than its own content and
     never forces the page to scroll sideways. */
  @media (min-width:820px) {
    #fcards { grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); }
  }
  /* The left edge IS the health readout. A person scanning five cards on a
     phone reads colour before they read digits, so the state has to survive
     being seen and not read. */
  .fcard { background:var(--panel); border:1px solid var(--line);
           border-left:5px solid var(--line); border-radius:8px;
           padding:.6rem .7rem; min-width:0; }
  .fcard.c-ok   { border-left-color:var(--mortal); }
  .fcard.c-hurt { border-left-color:#d29922; }
  /* Dead is LOUD, not dim. The whole complaint was that a family dying on a
     loop looked like nothing at all. */
  .fcard.c-dead { border-left-color:var(--horde); background:#2a1416; }
  .fcard.c-gone { border-left-color:var(--line); opacity:.6; }
  .fhead { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
  .fname { font-size:1.15rem; font-weight:bold; }
  .fchip { border:1px solid var(--line); border-radius:99px;
           padding:.05rem .5rem; font-size:.78rem; letter-spacing:.04em; }
  .fchip.dead   { background:var(--horde); border-color:var(--horde); color:#1a0000;
                  font-weight:bold; }
  .fchip.hurt   { color:#d29922; border-color:#d29922; }
  .fchip.gone   { color:var(--dim); }
  .fchip.combat { color:var(--neutral); border-color:var(--neutral); }
  .fchip.leader { color:var(--alliance); border-color:var(--alliance); }
  .fmeta { color:var(--dim); margin-top:.15rem; }
  .fbar { background:var(--bg); border:1px solid var(--line); border-radius:4px;
          height:.85em; overflow:hidden; margin:.45rem 0 .25rem; }
  .ffill { height:100%; background:var(--mortal); transition:width .3s linear; }
  .fcard.c-hurt .ffill { background:#d29922; }
  .fcard.c-dead .ffill { background:var(--horde); }
  .fline { overflow-wrap:anywhere; }
  .fline.dim { color:var(--dim); }
  /* 44px MINIMUM, everywhere a finger goes. */
  .fwatch, .fbtn { min-height:44px; width:100%; margin-top:.5rem;
                   background:var(--bg); color:var(--text);
                   border:1px solid var(--line); border-radius:6px;
                   cursor:pointer; font:inherit; padding:.4rem .6rem; }
  .fwatch { border-color:var(--alliance); color:var(--alliance); }
  .fwatch:disabled, .fbtn:disabled { opacity:.45; cursor:default;
                                     border-color:var(--line); color:var(--dim); }
  .fpbtns { display:flex; gap:.4rem; }
  .fpbtns .fbtn { width:auto; flex:1; }
  .fcard .note.warn { color:#d29922; }
  .fcard .note.live { color:var(--mortal); }
  .fcard .note { margin-top:.35rem; white-space:pre-wrap; overflow-wrap:anywhere; }
  .fwarn { color:var(--neutral); margin-top:.35rem; }
  /* Same 16:9 reservation as the panel player, for the same reason: a box
     that grows when the first frame lands makes the card jump under a thumb
     that is already reaching for it. */
  .fplayer { display:none; margin-top:.5rem; }
  .fvid { width:100%; aspect-ratio:16/9; display:block; background:#000;
          border:1px solid var(--line); border-radius:6px; }
  /* Fullscreen letterboxes rather than crops - a stretched game is unreadable
     and a cropped one hides the hotbars, which are half of why POV is worth
     watching at all. */
  .fplayer:fullscreen { background:#000; display:flex; align-items:center; }
  .fplayer:fullscreen .fvid { max-height:100vh; border:0; border-radius:0; }
  .fplayer:fullscreen .fpbtns, .fplayer:fullscreen .note { display:none; }
  /* A tab is a finger target too, and .3rem of padding is 28px of button.
     Only on touch, so the desktop keeps its compact strip. */
  @media (pointer:coarse) {
    nav button { min-height:44px; padding:.3rem 1rem; }
  }
  /* --- the broadcast tile, inside its own character's card (infra#3110) --
     Was a Twitch-style grid of its own above the cards (infra#2892): one
     focused player and a strip of five thumbnails, with the names in a
     separate list underneath. The operator's complaint was that this reads
     as a wall of video plus a wall of people, and matching one to the other
     is the viewer's job. So the tile now lives in the card of the character
     it is showing, and "focused" is a state of a tile rather than a place
     it gets moved to.

     ALL FIVE TILES ARE STILL BUILT ONCE AND MOVED, NEVER REBUILT, which is
     the rule that keeps a PeerConnection alive across a promotion: tapping a
     thumbnail changes a class, not a connection. */
  /* THE SLOT RESERVES THE SHAPE, NOT THE TILE, and that distinction is
     load-bearing rather than a preference. makePlayer owns the tile's
     `display` - it is set to none until start() is called and back to none
     by stop() - so a reservation hung on the tile itself is worth nothing in
     exactly the window it is needed. The quest log poll can also draw a card
     before the family poll has said whether there is a stream, and a box
     that appears half a second later shoves the log down under a thumb that
     is already reaching for it. So the empty slot holds the space. */
  .fstream { margin:.5rem 0; width:170px; max-width:100%; aspect-ratio:16/9; }
  /* The focused stream fills its card. There is one at a time, and it is the
     card you tapped - so "the big one" and "whose it is" are the same fact,
     which is the whole point of moving them in here. */
  .fstream.big { width:100%; }
  .ftile { position:relative; background:#000; border:1px solid var(--line);
           border-radius:6px; overflow:hidden; aspect-ratio:16/9;
           cursor:pointer; width:100%; height:100%; }
  .ftile.focused { cursor:default; outline:2px solid var(--alliance);
                   outline-offset:-2px; }
  .ftile video { width:100%; height:100%; display:block; object-fit:cover;
                 background:#000; }
  /* The focused player letterboxes rather than crops, the same rule the
     panel's fullscreen view follows: a cropped POV hides the hotbars, which
     is half of why watching it is worth doing. A thumbnail is too small for
     that distinction to matter, so it stays cropped-to-fill. */
  .ftile.focused video { object-fit:contain; }
  /* Metadata rides ON the video, exactly the way Twitch overlays a channel's
     name - reading who-and-how-hurt must not cost a look away from the
     picture. pointer-events:none so the overlay never eats the click that
     promotes a thumbnail. */
  .ftile .fov { position:absolute; inset:0; display:flex; flex-direction:column;
                justify-content:space-between; pointer-events:none;
                background:linear-gradient(to bottom, #000a, transparent 30%,
                            transparent 70%, #000c); padding:.3rem .4rem; }
  .ftile .ftop { display:flex; align-items:center; gap:.35rem; flex-wrap:wrap; }
  /* The name is on the card above it now, so the overlay says it small and
     only as a label on the picture - it is not the heading any more. */
  .ftile .fovname { font-weight:bold; overflow-wrap:anywhere; font-size:.75rem; }
  .ftile.focused .fovname { font-size:1rem; }
  .ftile .fovbar { background:#ffffff33; border-radius:3px; height:.4em;
                    overflow:hidden; }
  .ftile .fovfill { height:100%; background:var(--mortal); }
  .ftile.c-hurt .fovfill { background:#d29922; }
  .ftile.c-dead .fovfill { background:var(--horde); }
  .ftile .fovzone { color:#e6edf3cc; font-size:.75rem; overflow-wrap:anywhere; }
  /* A thumbnail has no room for the zone; the card already says it in full. */
  .ftile:not(.focused) .fovzone { display:none; }
  /* Offline is a message, not a black rectangle - requirement #3: a path
     with nothing publishing must read as itself, never as a dead player. */
  .ftile .foffline { position:absolute; inset:0; display:none;
                      align-items:center; justify-content:center;
                      text-align:center; padding:.5rem; color:var(--dim);
                      background:var(--panel); font-size:.75rem; }
  .ftile.offline .foffline { display:flex; }
  .ftile.offline video { visibility:hidden; }
  .ftile:not(.focused):hover { outline:1px solid var(--dim); }
  /* FULLSCREEN, AND ONLY ON THE FOCUSED TILE. The grid shipped without any
     fullscreen affordance at all: goFullscreen() existed but only the panel's
     card player ever called it, so on a phone - the device this tab was built
     for - there was nothing to tap and no way to fill the screen.
     pointer-events:auto because .fov above is deliberately none, so the
     overlay never eats a tap meant to promote a thumbnail; this button opts
     back in for itself alone. Hidden on thumbnails on purpose: a tap there
     already means "make this the big one", and one tap carrying two meanings
     is how a person ends up fullscreen on a stream they were only pointing
     at. */
  .ftile .ffull { display:none; pointer-events:auto; cursor:pointer;
                  background:#0d1117cc; color:#e6edf3; font:inherit;
                  font-size:.75rem; padding:.15rem .5rem;
                  border:1px solid var(--line); border-radius:4px; }
  .ftile.focused .ffull { display:inline-block; }
  .ftile .ffsnote { font-size:.75rem; color:#d29922; overflow-wrap:anywhere; }
  /* --- the quest log, in the card of whoever is carrying it (infra#3110) --
     Five logs side by side is the arrangement, and it is the arrangement
     because the two defects it exists to expose are both COMPARISONS:
     mod-overseer#73 is one character's slot count against the cap, and
     mod-overseer#28 is one character's quests against the other four's. A
     single log on its own screen would hide both. */
  #fquesthead { color:var(--dim); margin-bottom:.6rem; overflow-wrap:anywhere; }
  #fquesthead.alarm { color:#ff9d9d; }
  .fquests { margin-top:.5rem; border-top:1px solid var(--line);
             padding-top:.4rem; }
  .fqhead { color:var(--dim); font-size:.85rem; overflow-wrap:anywhere; }
  /* Loud, not dim, when the log is nearly full - the same rule the dead card
     follows. A quest log at the cap silently refuses every new quest, and
     greying the one number that says so would repeat the bug. */
  .fqhead.alarm { color:#ff9d9d; }
  .fqlist { margin-top:.35rem; display:grid; gap:.3rem; }
  .fq { border-left:3px solid var(--line); padding:.1rem .5rem; min-width:0; }
  .fq.ready { border-left-color:var(--mortal); }
  .fq.failed { border-left-color:var(--horde); }
  /* The #28 marker: a quest nobody else is carrying. Amber rather than red -
     it is not broken, it is unshared, and there are a lot of them. */
  .fq.alone { border-left-color:#d29922; }
  .fqtop { display:flex; align-items:baseline; gap:.35rem; flex-wrap:wrap; }
  .fqlvl { color:var(--dim); font-size:.8rem; }
  .fqname { overflow-wrap:anywhere; }
  .fq.old .fqname { color:var(--dim); }
  .fqchip { font-size:.72rem; letter-spacing:.04em; border-radius:99px;
            border:1px solid currentColor; padding:0 .4rem; }
  .fq.ready .fqchip { color:var(--mortal); }
  .fq.failed .fqchip { color:var(--horde); }
  .fq.old .fqchip { color:var(--dim); }
  .fqbar { background:var(--bg); border:1px solid var(--line); border-radius:3px;
           height:.4em; overflow:hidden; margin:.2rem 0; }
  .fqfill { height:100%; background:var(--alliance); }
  .fq.ready .fqfill { background:var(--mortal); }
  .fqobj { color:var(--dim); font-size:.82rem; overflow-wrap:anywhere; }
  .fqobj.done { color:var(--mortal); }
  .fqheld { font-size:.78rem; color:var(--dim); overflow-wrap:anywhere; }
  .fqheld.alone { color:#d29922; }
  /* 44px, because it is a control and this page is read with a thumb. */
  .fqmore { min-height:44px; width:100%; margin-top:.2rem; background:var(--bg);
            color:var(--dim); border:1px solid var(--line); border-radius:6px;
            cursor:pointer; font:inherit; padding:.3rem .6rem; }
</style>
</head>
<body>
<header>
  <h1>Azeroth Overseer</h1>
  <span id="census">reaching the world...</span>
  <!-- SAME ORIGIN, AND HIDDEN UNTIL PROVEN. The footage is on the recorder
       box, which a pod cannot reach, so Caddy proxies /recordings on this
       host straight to that box - which also keeps the link on HTTPS, since
       an HTTPS page may not load http://<box>:8078.

       This page is served under BOTH overseer hostnames from the same image,
       but only the dev one has the recordings route, and the box behind it is
       a desktop that is offline by design much of the time. So the link is
       revealed only when it answers, rather than sitting there as a promise
       that 404s on one host and 502s on the other. -->
  <a id="recordings" href="recordings/?c=dev-grug" hidden
     title="watch the recording back">Recordings</a>
</header>
<script>
  // One HEAD-ish probe, and the link appears only if playback answers. Costs a
  // request on load; the alternative is a header link that is dead on the live
  // host and dead again whenever the recorder box is asleep.
  fetch("recordings/healthz", { cache: "no-store" })
    .then(r => { if (r.ok) document.getElementById("recordings").hidden = false; })
    .catch(() => {});
</script>
<div id="stale"></div>
<nav id="tabs"></nav>
<section id="family">
  <div id="fheadline">reaching the world...</div>
  <!-- The one quest-log fact that belongs to nobody in particular: how
       badly the five logs disagree with each other (infra#3110). The
       per-character logs live INSIDE the cards, because a quest log belongs
       to a character. -->
  <div id="fquesthead"></div>
  <!-- ONE CARD PER CHARACTER, and the card carries everything about them:
       their name, their state, THEIR OWN broadcast tile, and their quest
       log. The tiles used to sit in a separate grid above this list
       (infra#2892's Twitch view), which read as a wall of video over a wall
       of names and left a viewer matching one to the other by position. The
       encoders, the paths and the WHEP handshake are all unchanged - the
       only thing infra#3110 moved is where a tile is parented. -->
  <div id="fcards"></div>
</section>
<section id="armory">
  <div id="aheadline">reaching the world...</div>
  <div id="asaved"></div>
  <div id="acols"></div>
</section>
<div id="wrap"><canvas id="map"></canvas><div id="tip"></div></div>
<aside id="panel">
  <div id="phead"><h2 id="pname"></h2><button id="pclose" title="close">x</button></div>
  <div id="pbody"></div>
  <div class="sect">watch live</div>
  <div id="pwatch">
    <div id="pwbtns">
      <!-- ORDER IS THE FIX, AND IT COST A REAL SESSION. `watch them` sat here
           first, read as the primary action, and is NOT IMPLEMENTED: it spends
           forty seconds bringing a client up and then answers with a refusal
           about needing a GM account that is not one of the family (infra#2887).
           Evan tapped it on his phone, waited, got nothing, and reasonably
           concluded streaming was broken - on the day it was proven working.
           `be them` is the one that works, so it leads, and follow-cam is
           disabled rather than merely demoted: a control that cannot succeed
           must not be spendable. It stays visible because it is a real planned
           mode, and the title says why it is off. -->
      <button id="pwpov" title="Log in as them with the AI playing. Their own hotbars, bags and camera - the Twitch view.">be them</button>
      <button id="pwcam" disabled title="Not implemented yet: a follow-cam needs a dedicated GM account that is not one of the family, because using one of theirs would turn that character into a selfbot - the exact thing a follow-cam exists to avoid (infra#2887).">watch them (not yet)</button>
      <button id="pwshot" title="Log a client in as them just long enough for one picture, then let it go. Costs a login, so it is not free - but it needs nobody to sit and watch.">look at them</button>
      <button id="pwstop" style="display:none">stop watching</button>
    </div>
    <div id="pwnote" class="note"></div>
    <!-- MUTED AND AUTOPLAY ARE BOTH LOAD-BEARING, not defaults copied in.
         A browser refuses to autoplay audible video, and the refusal is
         silent: the element stays black and the reason goes to a console
         nobody has open. The stream carries no audio anyway - it is a
         window capture - so muting costs nothing and buys the play.
         playsinline stops iOS taking the video fullscreen out of the panel.
         controls is here for the one case autoplay cannot cover: a browser
         that refuses to start the video on its own leaves a person with
         nothing to press, which is the same dead end as showing nothing. -->
    <div id="pwvideo"><video id="pwvid" muted autoplay playsinline controls></video>
      <div id="pwvnote" class="note"></div></div>
    <div id="pwframe"><img id="pwimg" alt=""><div id="pwfnote" class="note"></div></div>
  </div>
  <div class="sect">mind</div>
  <div id="ptimeline"></div>
  <button id="pmore">older thoughts</button>
  <form id="pchat" autocomplete="off">
    <input id="pinput" maxlength="500" placeholder="speak to them...">
    <button id="psay" type="submit">say</button>
  </form>
  <div id="pchatnote" class="note"></div>
</aside>
<footer>
  <span class="sw" style="background:var(--horde)"></span> Horde
  <span class="sw" style="background:var(--alliance)"></span> Alliance
  <span class="sw" style="background:var(--mortal)"></span> mortal (you)
  &nbsp; square = inside an instance, at its entrance &nbsp; pulsing = in combat
</footer>
<script>
"use strict";
const MAP_VIEW = "map";
const ARMORY_VIEW = "armory";
const CONTINENT_ORDER = ["0", "1", "530", "571", "quelthalas", "azuremyst"];
// A serif on purpose - the map should not read in the same voice as the
// console around it. Deliberately a local stack: this page is tailnet-only
// and must not gain a font CDN as a new way to look broken.
const MAPFONT = "Georgia, 'Times New Roman', serif";
let zones = null, shapes = null, dots = [], current = "1", freshest = null;
let hoverZone = null;

const canvas = document.getElementById("map"), ctx = canvas.getContext("2d");
const tip = document.getElementById("tip");

async function loadZones() {
  const [z, sh] = await Promise.all([
    (await fetch("/zones.json")).json(),
    (await fetch("/shapes.json")).json(),
  ]);
  zones = z.continents;
  shapes = sh;
  // A #map/<id> deep link arrives before this fetch finishes, so the id it
  // named is checked and adopted here, the moment there is something to check
  // it against.
  adoptContinent();
  const tabs = document.getElementById("tabs");
  // FAMILY FIRST. The map answers "who is in the world"; the Family tab
  // answers "are my five all right", which is the question that actually gets
  // asked from a phone - so it is the first thing under the thumb, not the
  // seventh (infra#2892).
  const fb = document.createElement("button");
  fb.textContent = "Family";
  fb.dataset.view = FAMILY_VIEW;
  fb.onclick = () => showView(FAMILY_VIEW);
  tabs.appendChild(fb);
  // Second, next to the family it describes: it answers "why did that go
  // badly", which is the question asked straight after "are they all right".
  const ab = document.createElement("button");
  ab.textContent = "Armory";
  ab.dataset.view = ARMORY_VIEW;
  ab.onclick = () => showView(ARMORY_VIEW);
  tabs.appendChild(ab);
  for (const id of CONTINENT_ORDER) {
    const b = document.createElement("button");
    b.textContent = zones[id].name;
    b.dataset.id = id;
    b.onclick = () => { current = id; showView("map"); render(); };
    tabs.appendChild(b);
  }
  markTabs();
}

async function poll() {
  try {
    const r = await fetch("/api/map");
    if (!r.ok) throw new Error(r.status);
    const p = await r.json();
    dots = p.dots; freshest = p.freshest_seconds;
    const mortals = dots.filter(d => !d.bot).length;
    document.getElementById("census").textContent =
      `${dots.length} souls (${mortals} mortal) - ${p.unplaced} unplaced - ${new Date().toLocaleTimeString()}`;
    banner(dots.length === 0 && freshest === null ? "empty" : freshest);
  } catch (e) {
    banner("unreachable");
  }
  render();
}

function banner(fresh) {
  const el = document.getElementById("stale");
  if (fresh === "unreachable") {
    el.textContent = "The world is unreachable - showing the last thing the overseer saw.";
    el.style.display = "block";
  } else if (fresh === "empty") {
    // A successful poll with zero rows is a real state: the module sweeps
    // logged-out rows, so an empty world drains the table. Say so - do not
    // cry outage over an empty tavern.
    el.textContent = "Nobody walks the world right now.";
    el.style.display = "block";
  } else if (fresh > 30) {
    el.textContent = `Snapshots are ${fresh}s old - the worldserver may be down.`;
    el.style.display = "block";
  } else el.style.display = "none";
}

// --- the world map (infra#2597) -------------------------------------------
//
// The land comes from shapes.json: the same WorldMapArea rectangles that
// place the dots, resolved into regions (the smallest box containing a point
// wins) and clipped to a coastline by tools/gen_shapes.py. Drawing those
// rectangles raw is what made this page a heap of overlapping outlines.
//
// Everything expensive is cached per size. render() runs five times a second
// for the combat pulse; rebuilding 25 paths and a label layout at that
// cadence would burn a core to redraw the same coastline.
let built = null;

function fitContinent(s, W, H) {
  // Letterbox at the continent's TRUE aspect. The height used to be clamped
  // to 760px, which squashed a 2:1 Eastern Kingdoms into a 1.4:1 blob - as
  // much of why this read as squares as the rectangles were.
  const cw = Math.min(W - 36, (H - 36) / s.aspect);
  const ch = cw * s.aspect;
  return { cw: cw, ch: ch, x0: (W - cw) / 2, y0: (H - ch) / 2 };
}

function fitLabel(label, room) {
  // measureText at a reference size and scale down: text width is linear in
  // font size, so one measurement per candidate is enough.
  const words = label.split(" ");
  const cands = [[label]];
  if (words.length > 1) {
    const cut = Math.ceil(words.length / 2);
    cands.push([words.slice(0, cut).join(" "), words.slice(cut).join(" ")]);
  }
  let best = null;
  for (const lines of cands) {
    ctx.font = "100px " + MAPFONT;
    let wide = 0;
    for (const t of lines) wide = Math.max(wide, ctx.measureText(t).width);
    const cap = room * (lines.length > 1 ? 0.85 : 1.4);
    const fs = Math.min(15, 100 * (1.85 * room) / wide, cap);
    if (!best || fs > best.fs) best = { fs: fs, lines: lines, per: wide / 100 };
  }
  return { fs: Math.max(8.5, best.fs), lines: best.lines, per: best.per };
}

function layoutLabels(s, fit) {
  // Biggest region first, and only vertical nudges: a sideways shove walks a
  // name out of its own zone and into a neighbour's, which is the collision
  // it was meant to avoid. A name that still will not fit is dropped rather
  // than shrunk into noise - cities keep their marker regardless.
  const k = fit.cw / 1000, out = [], placed = [];
  const order = s.zones.slice().sort((a, b) => b.cells - a.cells);
  for (const z of order) {
    let room = z.room * k, put = null;
    for (;;) {
      const f = fitLabel(z.label, room);
      const bw = f.per * f.fs + 6, bh = f.lines.length * f.fs * 1.16 + 4;
      const x = fit.x0 + z.cx * k, y = fit.y0 + z.cy * k;
      for (const oy of [0, -bh * 0.8, bh * 0.8]) {
        const b = [x - bw / 2, y + oy - bh / 2, x + bw / 2, y + oy + bh / 2];
        if (!placed.some(q => b[0] < q[2] && q[0] < b[2] && b[1] < q[3] && q[1] < b[3])) {
          put = { x: x, y: y + oy, fs: f.fs, lines: f.lines, box: b, city: z.city };
          break;
        }
      }
      if (put || f.fs <= 8.6) break;
      room *= 0.86;
    }
    if (!put) continue;
    placed.push(put.box);
    out.push(put);
  }
  return out;
}

function buildMap(id, W, H) {
  const s = shapes[id], fit = fitContinent(s, W, H);
  const m = new DOMMatrix().translateSelf(fit.x0, fit.y0).scaleSelf(fit.cw / 1000);
  const land = new Path2D();
  for (const d of s.coast) land.addPath(new Path2D(d), m);
  const regions = s.zones.map(z => {
    const path = new Path2D();
    path.addPath(new Path2D(z.d), m);
    return { name: z.label, fill: z.fill, path: path };
  });
  const k = fit.cw / 1000;
  const marks = s.marks.map(mk => ({ x: fit.x0 + mk.cx * k, y: fit.y0 + mk.cy * k,
                                     label: mk.label }));
  return { id: id, W: W, H: H, fit: fit, land: land, regions: regions,
           marks: marks, labels: layoutLabels(s, fit),
           yardsPerPx: (zones[id].left - zones[id].right) / fit.cw };
}

function drawSea(W, H) {
  const g = ctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, Math.max(W, H) * 0.78);
  g.addColorStop(0, "#25405a");
  g.addColorStop(1, "#101f2e");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#8fb4d2";
  ctx.globalAlpha = 0.07;
  ctx.lineWidth = 1;
  for (let i = 1; i < 9; i++) {
    ctx.beginPath(); ctx.moveTo(0, H * i / 9); ctx.lineTo(W, H * i / 9); ctx.stroke();
  }
  for (let i = 1; i < 12; i++) {
    ctx.beginPath(); ctx.moveTo(W * i / 12, 0); ctx.lineTo(W * i / 12, H); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawCompass(cx, cy, r) {
  for (let k = 0; k < 4; k++) {
    const a = k * Math.PI / 2;
    for (const [side, alpha] of [[1, 0.85], [-1, 0.5]]) {
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + r * Math.cos(a), cy - r * Math.sin(a));
      ctx.lineTo(cx + r * 0.22 * Math.cos(a + side * Math.PI / 4),
                 cy - r * 0.22 * Math.sin(a + side * Math.PI / 4));
      ctx.closePath();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = side > 0 ? "#8a6c33" : "#a3813f";
      ctx.fill();
    }
  }
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = "#a3813f"; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.arc(cx, cy, r * 1.22, 0, 7); ctx.stroke();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = "#a3813f"; ctx.textAlign = "center";
  ctx.font = "13px " + MAPFONT;
  ctx.fillText("N", cx, cy - r * 1.36);
  ctx.globalAlpha = 1;
}

function drawScale(x, y, yardsPerPx) {
  // Real yards, off the same extents that place the dots.
  const px = 2000 / yardsPerPx;
  ctx.strokeStyle = "#9dc0d8"; ctx.fillStyle = "#9dc0d8"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + px, y);
  ctx.moveTo(x, y - 4); ctx.lineTo(x, y + 4);
  ctx.moveTo(x + px, y - 4); ctx.lineTo(x + px, y + 4);
  ctx.stroke();
  ctx.globalAlpha = 0.8;
  ctx.font = "10.5px ui-monospace, monospace"; ctx.textAlign = "center";
  ctx.fillText("2000 yards", x + px / 2, y - 9);
  ctx.globalAlpha = 1;
}

function render() {
  if (!shapes) return;
  // ONE OWNER FOR THE SELECTED TAB (infra#2892). This used to mark tabs from
  // `current` alone, five times a second for the combat pulse - which meant
  // it silently un-highlighted the Family tab 200ms after it was tapped,
  // leaving the Family view on screen with a continent lit up above it.
  markTabs();
  const W = canvas.clientWidth;
  // Fill what is left of the window rather than a fixed box: a tall
  // continent needs the height, and the leftover is sea either way.
  const top = canvas.getBoundingClientRect().top;
  const foot = document.querySelector("footer");
  // Reserve the legend's own height: sizing to the raw viewport pushed the
  // footer below the fold and put a scrollbar on a page that has nothing to
  // scroll to.
  const H = Math.max(420, Math.round(
    window.innerHeight - top - (foot ? foot.offsetHeight : 0) - 26));
  if (canvas.width !== W * devicePixelRatio || canvas.height !== H * devicePixelRatio) {
    canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio;
    canvas.style.height = H + "px";
  }
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  if (!built || built.id !== current || built.W !== W || built.H !== H)
    built = buildMap(current, W, H);

  drawSea(W, H);

  // A dark halo under the coast, then parchment, then the zones on top of it
  // - the gaps between regions read as the unclaimed ground they are.
  ctx.save();
  ctx.strokeStyle = "#0c1926"; ctx.globalAlpha = 0.55;
  ctx.lineWidth = 34 * built.fit.cw / 1000;
  ctx.stroke(built.land);
  ctx.restore();
  ctx.fillStyle = "#cdb994";
  ctx.fill(built.land);

  ctx.lineJoin = "round";
  ctx.strokeStyle = "#7a6238";
  ctx.lineWidth = Math.max(0.7, 1.6 * built.fit.cw / 1000);
  for (const r of built.regions) {
    ctx.fillStyle = r.fill;
    ctx.globalAlpha = r.name === hoverZone ? 0.72 : 1;
    ctx.fill(r.path);
    ctx.globalAlpha = 1;
    ctx.stroke(r.path);
  }
  ctx.strokeStyle = "#5c4526";
  ctx.lineWidth = Math.max(1, 3.6 * built.fit.cw / 1000);
  ctx.stroke(built.land);

  // Names, over a parchment halo so a long one stays readable where it
  // overhangs a neighbour.
  ctx.textAlign = "center";
  ctx.lineJoin = "round";
  for (const l of built.labels) {
    ctx.font = l.fs.toFixed(1) + "px " + MAPFONT;
    ctx.strokeStyle = "#d3c19b"; ctx.lineWidth = 2.6;
    ctx.fillStyle = "#3b2c14";
    const n = l.lines.length;
    for (let i = 0; i < n; i++) {
      const y = l.y + (i - (n - 1) / 2) * l.fs * 1.16 + l.fs * 0.34;
      ctx.strokeText(l.lines[i], l.x, y);
      ctx.fillText(l.lines[i], l.x, y);
    }
  }
  for (const mk of built.marks) {
    ctx.save();
    ctx.translate(mk.x, mk.y); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = "#e8c35d"; ctx.strokeStyle = "#5e4514"; ctx.lineWidth = 1.2;
    ctx.fillRect(-3.5, -3.5, 7, 7); ctx.strokeRect(-3.5, -3.5, 7, 7);
    ctx.restore();
    ctx.font = "9.5px " + MAPFONT;
    ctx.strokeStyle = "#d3c19b"; ctx.lineWidth = 2.4; ctx.fillStyle = "#3b2c14";
    ctx.strokeText(mk.label, mk.x, mk.y + 16);
    ctx.fillText(mk.label, mk.x, mk.y + 16);
  }

  // dots
  const t = Date.now() / 400, f = built.fit;
  for (const d of dots) {
    if (d.continent !== current) continue;
    const x = f.x0 + d.u * f.cw, y = f.y0 + d.v * f.ch;
    ctx.fillStyle = !d.bot ? "#7ee787" :
      d.faction === "alliance" ? "#4d9fff" : d.faction === "horde" ? "#ff4d4d" : "#d4b106";
    const r = d.combat ? 3 + Math.sin(t) * 1.2 : (d.bot ? 2.4 : 4);
    if (d.instance) ctx.fillRect(x - r, y - r, r * 2, r * 2);
    else { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
  }

  drawCompass(W - 78, 84, 34);
  drawScale(W - 150, H - 26, built.yardsPerPx);
  ctx.textAlign = "start";
}

function zoneAt(mx, my) {
  // isPointInPath takes the point in canvas coordinates UNAFFECTED by the
  // current transform, while the path it tests IS transformed by it. The
  // paths are built in CSS pixels and the context is scaled by the device
  // ratio, so the point has to be scaled to match - passing CSS pixels
  // simply never hits on a retina screen, silently.
  if (!built) return null;
  const x = mx * devicePixelRatio, y = my * devicePixelRatio;
  for (const r of built.regions) if (ctx.isPointInPath(r.path, x, y)) return r.name;
  return null;
}

function nearestDot(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (!built) return { best: null, mx: mx, my: my };
  const f = built.fit;
  let best = null, bd = 12 * 12;
  for (const d of dots) {
    if (d.continent !== current) continue;
    const dx = f.x0 + d.u * f.cw - mx, dy = f.y0 + d.v * f.ch - my;
    const dist = dx * dx + dy * dy;
    if (dist < bd) { bd = dist; best = d; }
  }
  return { best, mx, my };
}

canvas.addEventListener("mousemove", (e) => {
  const { best, mx, my } = nearestDot(e);
  const zone = best ? null : zoneAt(mx, my);
  if (zone !== hoverZone) { hoverZone = zone; render(); }
  if (best || zone) {
    tip.style.display = "block";
    tip.style.left = (mx + 14) + "px"; tip.style.top = (my + 6) + "px";
    tip.textContent = best
      ? `${best.name} - L${best.level} - ${best.zone}` +
        (best.combat ? " - fighting" : "") + (best.bot ? "" : " - MORTAL")
      : zone;
  } else tip.style.display = "none";
});
canvas.addEventListener("mouseleave", () => {
  tip.style.display = "none";
  if (hoverZone !== null) { hoverZone = null; render(); }
});

// --- character panel (infra#2603): click a dot, inspect a colonist ---
// All text lands via textContent, never innerHTML: names and item names
// come from the database and must render inert.
let selected = null;
const panel = document.getElementById("panel");
const pbody = document.getElementById("pbody");
const pname = document.getElementById("pname");

canvas.addEventListener("click", (e) => {
  const { best } = nearestDot(e);
  if (best) {
    // Tear the player down BEFORE switching, or clicking a second dot leaves
    // the first character's video playing under the second character's name -
    // which is the exact confusion this whole feature exists to remove.
    stopPlayer();
    selected = best.name; pname.textContent = best.name; panel.style.display = "block";
    watchNote(""); fetchPanel(); openMind(best.name); refreshWatch(); refreshFrame();
  } else closePanel();
});
document.getElementById("pclose").onclick = closePanel;

// ---- watch live (infra#2663) ------------------------------------------
//
// THE HEARTBEAT IS THE PRODUCT. A client rendering the game for nobody costs
// a GPU and 300MB and is invisible, which is the failure #2663 names in its
// own acceptance criteria. So this page promises "still here" on a timer, and
// SILENCE is what ends a stream - closing the tab, crashing, sleeping the
// laptop or losing the tailnet all stop the beat, and all of them tear the
// client down. Nothing here needs an unload handler to be correct.
const watch = { name: null, timer: null, every: 10000 };
const pwcam = document.getElementById("pwcam");
const pwpov = document.getElementById("pwpov");
const pwstop = document.getElementById("pwstop");
const pwshot = document.getElementById("pwshot");
const pwnote = document.getElementById("pwnote");

function watchNote(text, cls) {
  pwnote.textContent = text || "";
  pwnote.className = "note" + (cls ? " " + cls : "");
}

async function watchPost(name, action, mode) {
  const r = await fetch("/api/watch", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ name: name, action: action, mode: mode || "cam" }),
  });
  let body = {};
  try { body = await r.json(); } catch (e) { body = {}; }
  return { ok: r.ok, body: body };
}

// Ask for a client and, if it was granted, START PROMISING TO BE HERE. Split
// out of startWatch (infra#2892) because the Family tab needs exactly these
// two steps in exactly this order, and a surface that asks without beating
// leaves a client rendering the game for nobody - the precise cost #2663
// exists to avoid. ONE PAGE, ONE BEAT: whichever surface asked last owns
// watch.name, which is why only one thing on this page watches at a time.
async function requestWatch(name, mode) {
  const res = await watchPost(name, "start", mode);
  if (res.ok && mode !== "shot") {
    // A shot has no viewer to fall silent, so it needs no heartbeat - and
    // beating for it would keep alive a row whose entire point is to end.
    watch.name = name;
    beat();
  }
  return res;
}

async function startWatch(mode) {
  if (!selected) return;
  const name = selected;
  pwcam.disabled = pwpov.disabled = true;
  watchNote("asking for a client...");
  const res = await requestWatch(name, mode);
  if (name !== selected) return;
  if (!res.ok) {
    // A refusal is a sentence a person can read - both channels busy, or
    // already watching - not a silent no-op.
    watchNote(res.body.error || "could not start", "warn");
    // pwcam is deliberately NOT re-enabled: follow-cam is not implemented
  // (infra#2887) and a control that cannot succeed must not be spendable.
  pwpov.disabled = pwshot.disabled = false;
    return;
  }
  refreshWatch();
}

async function stopWatch() {
  const name = watch.name || selected;
  if (!name) return;
  await watchPost(name, "stop");
  stopPlayer();
  watch.name = null;
  if (watch.timer) { clearInterval(watch.timer); watch.timer = null; }
  if (name === selected) refreshWatch();
}

function beat() {
  if (watch.timer) clearInterval(watch.timer);
  watch.timer = setInterval(() => {
    if (!watch.name) return;
    // Fire and forget: a dropped beat is survivable by design (the server's
    // timeout is several beats long), and a failed keepalive must never throw
    // into the console every ten seconds.
    watchPost(watch.name, "beat").catch(() => {});
  }, watch.every);
}

// ---- the player (infra#2663, the last piece) ----------------------------
//
// Everything upstream of here already produces a URL a browser can open. Up
// to now this page PRINTED that URL and asked a person to copy it into
// another tab, which is not "click a character and watch them play".
//
// WHEP SPOKEN DIRECTLY, rather than an <iframe> of MediaMTX's own player
// page. The iframe works and costs every sentence on this screen: its
// failures are MediaMTX's wording ("bad status code 404") inside a document
// we cannot read, and the whole discipline here is that a person can find out
// why nothing is happening. Owning the handshake means owning the
// explanation.
//
// MIXED CONTENT IS THE FAILURE THAT LOOKS EXACTLY LIKE NOTHING. This page is
// HTTPS. The stream comes from the Caddy vhost wow.stream.ts.ehumps.me, which
// terminates TLS in front of MediaMTX on the gaming box precisely so this
// fetch is https-to-https. If `detail` ever arrives as plain http:// the
// browser blocks it silently, the player stays black, and the reason goes
// only to a console nobody has open - so it is checked here and SAID.
//
// ONLY THE SIGNALLING GOES OVER HTTPS. The video itself flows browser-to-box
// over UDP 8189 across the tailnet, from the one ICE candidate MediaMTX
// advertises. That is why this is fast (85ms measured) and why a slow Caddy
// could delay a stream starting but cannot throttle one that has.
const pwvideo = document.getElementById("pwvideo");
const pwvid = document.getElementById("pwvid");
const pwvnote = document.getElementById("pwvnote");

function playerNote(text, cls) {
  pwvnote.textContent = text || "";
  pwvnote.className = "note" + (cls ? " " + cls : "");
}

// Non-trickle WHEP: gather first, then send ONE complete offer. MediaMTX
// answers with all of its own candidates in the SDP, so there is nothing to
// receive later - which lets the whole ICE-fragment PATCH machinery go.
// The timeout is a backstop, never the normal path: with no STUN configured
// the browser has only host candidates and finishes in milliseconds. Without
// it, a browser that never declares gathering complete would hang the player
// forever with nothing on screen, which is the one outcome forbidden here.
function iceGathered(pc) {
  if (pc.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((resolve) => {
    const done = () => {
      clearTimeout(timer);
      pc.removeEventListener("icegatheringstatechange", check);
      resolve();
    };
    const check = () => { if (pc.iceGatheringState === "complete") done(); };
    const timer = setTimeout(done, 3000);
    pc.addEventListener("icegatheringstatechange", check);
  });
}

// Every status a person could actually hit, in words that name the thing to
// go and look at. "bad status code" names nothing.
function whepFailure(status) {
  if (status === 404) {
    return "the media server has no stream on that path yet - the client is "
      + "up but its encoder has not started publishing.";
  }
  if (status === 502 || status === 504) {
    return "the gaming box is not answering. It is switched off far more "
      + "often than it is on, and that is normal rather than a fault.";
  }
  return "the media server refused the connection (HTTP " + status + ").";
}

// ONE WHEP PATH, TWO SURFACES (infra#2892). This was a singleton bound to the
// panel's own <video>. The Family tab needs the same handshake against a
// different element, and a SECOND copy of it - a second offer, a second set
// of autoplay lies to fall for, a second opinion about what a 404 means - is
// how two surfaces start disagreeing about whether a stream is up. So the
// state moved into a closure and the element became an argument. The panel's
// behaviour is unchanged because it is running the same code it was.
function makePlayer(video, note, box) {
  const player = { url: null, pc: null, session: null };

  async function whepExchange(pc, url) {
    await pc.setLocalDescription(await pc.createOffer());
    await iceGathered(pc);
    const r = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/sdp" },
      body: pc.localDescription.sdp,
    });
    if (r.status !== 201) throw new Error(whepFailure(r.status));
    // Best effort: the session URL only comes back to us if MediaMTX exposes
    // Location across origins. Without it the DELETE below is skipped and
    // closing the PeerConnection is what ends the session - slower, not wrong.
    try {
      const loc = r.headers.get("location");
      if (loc) player.session = new URL(loc, url).toString();
    } catch (e) { player.session = null; }
    await pc.setRemoteDescription({ type: "answer", sdp: await r.text() });
  }

  function watchConnection(pc) {
    pc.onconnectionstatechange = () => {
      if (player.pc !== pc) return;
      if (pc.connectionState === "failed") {
        note("the video connection failed - the browser and the box "
          + "agreed on a stream and no media crossed the tailnet.", "warn");
      } else if (pc.connectionState === "disconnected") {
        note("the video connection dropped.", "warn");
      }
    };
  }

  async function start(name, base) {
    const url = base.replace(/\/+$/, "") + "/whep";
    if (player.url === url) return;   // already playing this character
    stop();
    player.url = url;
    box.style.display = "block";
    if (location.protocol === "https:" && /^http:/i.test(url)) {
      note("the stream address is plain http:// and this page is https://"
        + ", so the browser will block it as mixed content and show nothing. "
        + "The stream needs its TLS vhost in front of it.", "warn");
      return;
    }
    note("connecting to the video...");
    const pc = new RTCPeerConnection();
    player.pc = pc;
    pc.addTransceiver("video", { direction: "recvonly" });
    pc.addTransceiver("audio", { direction: "recvonly" });
    pc.ontrack = (e) => {
      if (player.pc !== pc) return;
      // ontrack FIRES ONCE PER TRACK - video and audio - and re-assigning the
      // same MediaStream restarts loading for no reason, which is what aborted
      // the first play() below and produced a "would not start" warning over a
      // picture that was playing perfectly.
      if (video.srcObject !== e.streams[0]) video.srcObject = e.streams[0];
      note("live from " + name + "'s screen", "live");
      // THE autoplay ATTRIBUTE IS NOT ENOUGH, and this was measured rather than
      // reasoned about: connected, 1280x720, readyState 4 - and paused, with
      // currentTime stuck at 0. A stream handed to an element AFTER load does
      // not always trip the attribute, and a tab that was not focused when the
      // track arrived is the common case here, because the wait is a minute
      // long and people go and do something else. The symptom is the worst one
      // available: a still frame that looks exactly like a live game.
      //
      // play() returns a promise and a REJECTION IS A SENTENCE. If a browser
      // ever refuses (an autoplay policy stricter than muted-video), the person
      // is told to press play rather than left watching a frozen picture.
      // AND THE REJECTION IS CHECKED BEFORE IT IS BELIEVED. A rejected play()
      // is not always a refusal: an interrupted promise rejects while the video
      // plays on, and the first live run said "would not start it" underneath
      // Ugga running through a forest at 30fps. A warning that contradicts what
      // is on screen costs more trust than saying nothing would.
      video.play().catch(() => {
        if (!video.paused) return;
        note("the video is connected but this browser would not start it "
          + "on its own - press play on the picture.", "warn");
      });
    };
    watchConnection(pc);
    try {
      await whepExchange(pc, url);
    } catch (e) {
      if (player.pc !== pc) return;
      note("could not start the video: " + (e.message || e), "warn");
    }
  }

  function stop() {
    if (player.session) {
      // Fire and forget. A session MediaMTX keeps for a few seconds longer than
      // it should is far cheaper than an exception thrown while closing a panel.
      fetch(player.session, { method: "DELETE" }).catch(() => {});
    }
    if (player.pc) { try { player.pc.close(); } catch (e) { /* already gone */ } }
    player.pc = null; player.session = null; player.url = null;
    video.srcObject = null;
    box.style.display = "none";
    note("");
  }

  return { start: start, stop: stop };
}

const panelPlayer = makePlayer(pwvid, playerNote, pwvideo);
function startPlayer(name, base) { return panelPlayer.start(name, base); }
function stopPlayer() { panelPlayer.stop(); }

// WHAT TO SAY WHILE NOTHING IS ON SCREEN YET, and why it is three sentences
// and not a spinner. The agent takes 45-60 REAL seconds: it launches a
// client, types a login, waits for the world, and then proves the selfbot
// attached (#2781 - an AI-less character in the party freezes group loot for
// the whole family, so that check is not optional). A minute of unexplained
// blankness is how a working feature gets reported as broken.
//
// AND "NOTHING PICKED IT UP" IS SAID SEPARATELY, because it is a different
// problem with a different fix: the agent is started by hand on the box, so
// not-running is a normal state of the world, and on screen it is otherwise
// indistinguishable from a slow login that will succeed.
function waitingWords(w, s) {
  const budget = s.startup_seconds || 60;
  const soFar = (w.waited_seconds === null || w.waited_seconds === undefined)
    ? "" : " - " + w.waited_seconds + "s so far";
  if (w.unclaimed) {
    return "nothing has picked this request up" + soFar + ".\nThe stream "
      + "agent polls every 5s and claims a request immediately, so this is "
      + "not a slow login - it is the agent not running on the gaming box.";
  }
  if (w.state === "requested") return "asked for a client" + soFar + "...";
  return "bringing a client up and checking their AI is attached. This "
    + "honestly takes about " + budget + "s" + soFar + ".";
}

// WHAT A /api/watch PAYLOAD MEANS, with no opinion about who is drawing it
// (infra#2892). Two surfaces render this state now, and them reaching
// different conclusions from the same row would be worse than either being
// wrong: only one of the two is ever on screen to be corrected.
function watchView(s) {
  const w = s.watching;
  if (!w) {
    // The row is over. A request the agent could not honour comes back as a
    // finished row with a REASON, and showing it VERBATIM is the difference
    // between "it refused, and here is why" and a control that silently
    // re-enables itself. The agent writes whole sentences - the selfbot did
    // not attach, so the stream was stopped rather than left wedging the
    // party's loot rolls - and a bare "ended" throws all of that away.
    const why = s.outcome && s.outcome.detail;
    if (why) return { phase: "ended", text: why, cls: "warn" };
    if (s.channels_in_use >= s.max_channels) {
      return { phase: "busy", cls: "warn",
               text: "both channels busy (" + s.channels_in_use
                     + "/" + s.max_channels + ")" };
    }
    return { phase: "idle", text: "", cls: "" };
  }
  if (w.state !== "live") {
    return { phase: "waiting", mode: w.mode,
             text: waitingWords(w, s), cls: w.unclaimed ? "warn" : "" };
  }
  // Sunshine has NO browser player - its 47990 is a config UI, and video
  // leaves over Moonlight. So a live stream is INSTRUCTIONS unless the server
  // says it is genuinely embeddable. Rendering a player for a Moonlight
  // stream would be a black rectangle and a bug report.
  if (w.delivery === "embed" && w.detail) {
    // The two modes look similar and mean very different things: POV is their
    // own hotbars, bags and camera; cam is a GM standing next to them with the
    // observer's UI. Say WHOSE interface is on screen.
    return { phase: "live", mode: w.mode, embed: w.detail, cls: "live",
             text: w.mode === "pov"
               ? "live - their own screen, their own interface"
               : "live - an observer's camera following them" };
  }
  // Printed VERBATIM. The agent writes detail as the sentence it wants read -
  // which instance to open, and what you are actually looking at - so
  // prefixing it gave "live on Moonlight - Open Moonlight on the Switch and
  // launch...". It says that better than a label can.
  return { phase: "elsewhere", mode: w.mode, cls: "live",
           text: w.detail || "live on Moonlight" };
}

async function refreshWatch() {
  if (!selected) return;
  const name = selected;
  let s;
  try {
    const r = await fetch("/api/watch?name=" + encodeURIComponent(name));
    s = await r.json();
  } catch (e) { return; }
  if (name !== selected) return;
  if (s.heartbeat_seconds) watch.every = s.heartbeat_seconds * 1000;
  const w = s.watching;
  const v = watchView(s);
  if (!w) {
    // Nothing left to render, and a player left connected would keep pulling
    // video across the tailnet for a stream the world has already torn down.
    stopPlayer();
    pwstop.style.display = "none";
    // pwcam is deliberately NOT re-enabled: follow-cam is not implemented
  // (infra#2887) and a control that cannot succeed must not be spendable.
  pwpov.disabled = pwshot.disabled = false;
    watchNote(v.text, v.cls);
    return;
  }
  pwstop.style.display = w.mode === "shot" ? "none" : "";
  pwcam.disabled = pwpov.disabled = pwshot.disabled = true;
  watchNote(v.text, v.cls);
  if (v.embed) startPlayer(name, v.embed); else stopPlayer();
}

// --- their own screen (infra#2663) ---------------------------------------
//
// The stream is for Evan; this still is for everyone else, including whatever
// is reading the overseer's tables. It is the only instrument here that shows
// the game instead of describing it.
//
// The token exists because an <img> whose src never changes is never
// re-fetched, no-store or not. It advances only when a genuinely NEWER frame
// arrives - a capture that failed leaves the last good picture on screen with
// its age showing, rather than blanking a panel that had something useful.
const pwframe = document.getElementById("pwframe");
const pwimg = document.getElementById("pwimg");
const pwfnote = document.getElementById("pwfnote");
let frameSeen = { name: null, ago: null, token: 0 };

function ageWords(seconds) {
  if (seconds === null || seconds === undefined) return "";
  if (seconds < 2) return "just now";
  if (seconds < 90) return seconds + "s ago";
  return Math.round(seconds / 60) + "m ago";
}

async function refreshFrame() {
  if (!selected) { pwframe.style.display = "none"; return; }
  const name = selected;
  let m;
  try {
    const r = await fetch("/api/frame?meta=1&name=" + encodeURIComponent(name));
    m = await r.json();
  } catch (e) { return; }
  if (name !== selected) return;
  if (!m.has_frame && !m.status) { pwframe.style.display = "none"; return; }
  pwframe.style.display = "block";
  if (m.has_frame) {
    if (frameSeen.name !== name || m.captured_seconds_ago < frameSeen.ago) {
      frameSeen = { name: name, ago: m.captured_seconds_ago, token: frameSeen.token + 1 };
      pwimg.src = "/api/frame?name=" + encodeURIComponent(name) + "&t=" + frameSeen.token;
    } else {
      frameSeen.ago = m.captured_seconds_ago;
    }
    pwimg.style.display = "block";
  } else {
    pwimg.style.display = "none";
    pwimg.removeAttribute("src");
  }
  // A failure says WHY. "failed" on its own tells a viewer exactly as much as
  // showing nothing did, which is the reason the status exists at all.
  const bad = m.status && m.status !== "ok";
  const why = bad ? (m.detail || m.status) : "";
  const age = m.has_frame ? "their screen, " + ageWords(m.captured_seconds_ago) : "";
  pwfnote.textContent = bad ? (age ? age + " - " + why : why) : age;
  pwfnote.className = "note" + (bad ? " warn" : "");
}

pwshot.onclick = () => startWatch("shot");
pwcam.onclick = () => startWatch("cam");
pwpov.onclick = () => startWatch("pov");
pwstop.onclick = stopWatch;

function closePanel() {
  // Closing the panel stops the heartbeat but does NOT stop the stream: a
  // viewer may well close the map and keep watching on the Switch. The
  // server's staleness sweep ends it if nobody is really there, which is the
  // one mechanism that cannot be fooled by how the page was left.
  if (watch.timer) { clearInterval(watch.timer); watch.timer = null; }
  watch.name = null;
  // The video, on the other hand, goes NOW. Leaving a PeerConnection open
  // holds a MediaMTX session and keeps pulling a 6Mbit stream across the
  // tailnet into a panel nobody can see. Stopping it is not the same as
  // stopping the stream - the heartbeat above decides that.
  stopPlayer();
  selected = null; panel.style.display = "none";
  pwframe.style.display = "none";
  pwimg.removeAttribute("src");
  frameSeen = { name: null, ago: null, token: frameSeen.token };
  // Closing the panel also stops the thought stream: a hidden panel must
  // not keep polling a mind nobody is watching.
  mind.name = null;
}

async function fetchPanel() {
  if (!selected) return;
  const name = selected;
  try {
    const r = await fetch("/api/character?name=" + encodeURIComponent(name));
    if (!r.ok) throw new Error(r.status);
    const p = await r.json();
    if (name === selected) renderPanel(p);
  } catch (e) {
    // Keep whatever was drawn; just say the refresh failed.
    if (name === selected) note("world unreachable - panel may be stale");
  }
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function row(parent, k, v) {
  const r = el("div", "row");
  r.appendChild(el("span", "k", k));
  r.appendChild(el("span", "v", v));
  parent.appendChild(r);
}

function sect(parent, title) { parent.appendChild(el("div", "sect", title)); }

function note(text) {
  let n = pbody.querySelector(".flash");
  if (!n) { n = el("div", "note flash"); pbody.prepend(n); }
  n.textContent = text;
}

function renderPanel(p) {
  pbody.replaceChildren();
  if (!p.present) {
    // Logged out mid-view: the calm state, not an error.
    pbody.appendChild(el("div", "gone", p.name + " has left the world."));
    return;
  }
  pname.textContent = p.name;
  const b = pbody;
  b.appendChild(el("div", "note",
    "L" + p.level + " " + p.race + " " + p["class"] +
    (p.bot ? "" : " - MORTAL") + (p.combat ? " - fighting" : "")));

  sect(b, "vitals");
  const track = el("div", "bar-track"), fill = el("div", "bar-fill");
  fill.style.width = (p.vitals.max_health ? Math.round(100 * p.vitals.health / p.vitals.max_health) : 0) + "%";
  track.appendChild(fill); b.appendChild(track);
  row(b, "health", p.vitals.health + " / " + p.vitals.max_health);
  if (p.vitals.power)
    // No max power in the DB, and the value updates on character save,
    // not on the snapshot cadence - a number, not a bar, is the honest form.
    row(b, p.vitals.power.kind.toLowerCase(), String(p.vitals.power.value) + " (at last save)");
  if (p.target) {
    const label = p.target.kind === "player"
      ? p.target.name + " (L" + p.target.level + " player)"
      : p.target.name + (p.target.kind === "creature" ? "" : " (?)");
    row(b, "target", label);
  }

  if (p.guild !== null || p.group !== null) sect(b, "company");
  if (p.guild !== null) row(b, "guild", p.guild);
  if (p.group !== null)
    for (const m of p.group.members)
      row(b, m.leader ? "leader" : "party", m.name + " - L" + m.level + " " + m["class"]);

  sect(b, "hotbar");
  if (p.hotbar.length === 0) b.appendChild(el("div", "note", "(no buttons bound)"));
  for (const bar of p.hotbar)
    for (const btn of bar.buttons)
      row(b, bar.bar + "." + (btn.slot + 1), btn.label);

  sect(b, "equipment");
  if (p.equipment.length === 0) b.appendChild(el("div", "note", "(bare)"));
  for (const it of p.equipment) row(b, it.slot, it.name);

  sect(b, "backpack");
  if (p.backpack.length === 0) b.appendChild(el("div", "note", "(empty)"));
  for (const it of p.backpack) row(b, it.count > 1 ? "x" + it.count : "", it.name);

  for (const bag of p.bags) {
    sect(b, bag.name);
    if (bag.items.length === 0) b.appendChild(el("div", "note", "(empty)"));
    for (const it of bag.items) row(b, it.count > 1 ? "x" + it.count : "", it.name);
  }
  if (p.stored_elsewhere > 0)
    b.appendChild(el("div", "note", "+ " + p.stored_elsewhere + " items in the bank, keyring or buyback"));
}

// --- thought timeline + chat (infra#2604) ----------------------------------
// One mind across surfaces: this stream is the same overseer_thought table
// the Discord bridge writes, so a line said there shows up here and a line
// typed here shows up there. Text lands via textContent only - thoughts are
// model output out of a database and must render inert.
const timelineEl = document.getElementById("ptimeline");
const moreBtn = document.getElementById("pmore");
const chatForm = document.getElementById("pchat");
const chatInput = document.getElementById("pinput");
const chatSend = document.getElementById("psay");
const chatNote = document.getElementById("pchatnote");
// byId, not an array: the 5s refresh re-fetches the newest page, and merging
// by id is what stops a poll from duplicating or reordering what is already
// on screen (older pages loaded above stay put).
let mind = { name: null, byId: new Map(), cursor: null, more: false, pending: [], busy: false };

function openMind(name) {
  if (mind.name === name) return;   // same colonist: keep their history
  mind = { name: name, byId: new Map(), cursor: null, more: false, pending: [], busy: false };
  timelineEl.replaceChildren();
  chatNote.textContent = "";
  chatInput.value = "";
  moreBtn.style.display = "none";
  // Closing the panel mid-send leaves the form disabled (its own handler
  // deliberately skips a character nobody is looking at any more); opening
  // a mind must always hand back a usable box.
  chatSend.disabled = false; chatInput.disabled = false;
  fetchThoughts(null);
}

async function fetchThoughts(before) {
  const name = mind.name;
  if (!name) return;
  let url = "/api/thoughts?name=" + encodeURIComponent(name);
  if (before !== null) url += "&before=" + encodeURIComponent(before);
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    const p = await r.json();
    if (mind.name !== name) return;   // the Overseer moved on mid-flight
    for (const t of p.thoughts) mind.byId.set(t.id, t);
    // Only a page walked backwards moves the "older" cursor; the 5s refresh
    // of the newest page must not rewind it.
    if (before !== null || mind.cursor === null) { mind.cursor = p.next_before; mind.more = p.has_more; }
    renderTimeline(before === null);
  } catch (e) {
    if (mind.name === name && mind.byId.size === 0)
      timelineEl.replaceChildren(el("div", "note", "cannot read this mind right now"));
  }
}

function thoughtEl(t) {
  const n = el("div", "th s-" + t.source + (t.speaker === "overseer" ? " overseer" : "") +
                     (t.pending ? " pending" : ""));
  n.appendChild(el("div", "meta",
    (t.speaker === "overseer" ? "you" : t.source) + " - " + t.when));
  n.appendChild(el("div", "", t.text));
  return n;
}

function renderTimeline(autoscroll) {
  // Oldest at the top, newest at the bottom: a transcript, read downward.
  const items = [...mind.byId.values()].sort((a, b) => a.id - b.id);
  // Near the bottom means the Overseer is watching the present; further up
  // means they are reading history and must not be yanked back down.
  const atBottom = timelineEl.scrollHeight - timelineEl.scrollTop - timelineEl.clientHeight < 40;
  timelineEl.replaceChildren();
  if (items.length === 0 && mind.pending.length === 0)
    timelineEl.appendChild(el("div", "note", "(no thoughts yet)"));
  for (const t of items) timelineEl.appendChild(thoughtEl(t));
  for (const t of mind.pending) timelineEl.appendChild(thoughtEl(t));
  moreBtn.style.display = mind.more ? "block" : "none";
  if (autoscroll && atBottom) timelineEl.scrollTop = timelineEl.scrollHeight;
}

moreBtn.onclick = () => { if (mind.cursor !== null) fetchThoughts(mind.cursor); };

chatForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = chatInput.value.trim();
  if (!text || mind.busy || !mind.name) return;
  const name = mind.name;
  mind.busy = true; chatSend.disabled = true; chatInput.disabled = true;
  chatNote.textContent = "the voice is thinking...";
  // Optimistic: the line appears immediately, greyed, and is replaced by
  // the real row when the timeline reconciles a moment later.
  mind.pending = [{ id: -1, source: "chat", speaker: "overseer", text: text,
                    when: "just now", pending: true }];
  chatInput.value = "";
  renderTimeline(true);
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, text: text }),
    });
    const p = r.ok ? await r.json() : null;
    if (mind.name !== name) return;
    if (p === null) {
      chatNote.textContent = r.status === 404 ? "no such character" : "the world is unreachable";
    } else if (!p.present) {
      // Logged out: the words were kept, but nobody answered. A note, not
      // a speech bubble the character never uttered.
      chatNote.textContent = p.say;
    } else {
      chatNote.textContent = p.degraded ? "the inner voice is unreachable - answered plainly"
                             : p.command ? "command sent: " + p.command : "";
      mind.pending.push({ id: -2, source: "chat", speaker: "character", text: p.say,
                          when: "just now", pending: true });
      renderTimeline(true);
    }
  } catch (err) {
    if (mind.name === name) chatNote.textContent = "the world is unreachable";
  } finally {
    if (mind.name === name) {
      mind.busy = false; chatSend.disabled = false; chatInput.disabled = false;
      // Reconcile: the persisted rows (with real ids and timestamps)
      // replace the optimistic pair.
      await fetchThoughts(null);
      mind.pending = [];
      renderTimeline(true);
    }
  }
});

function refreshMind() { if (mind.name && !mind.busy) fetchThoughts(null); }

// --- the Family tab (infra#2892) -----------------------------------------
//
// THE COMPLAINT THIS ANSWERS, in Evan's own words: on a phone the map is five
// hundred dots and the five that matter are indistinguishable. The map is the
// right instrument for "who is in the world" and the wrong one for "is my
// family alive" - that second question is about five named characters and its
// answer is a list, not a picture. So this is a TAB and not a filter.
//
// It is also the tab that would have caught the incident that produced it:
// the five of them dying on a loop in a zone thirty levels above them, with
// nothing anywhere on this page saying so.
const FAMILY_VIEW = "family";
const fsection = document.getElementById("family");
const fcards = document.getElementById("fcards");
const fheadline = document.getElementById("fheadline");
const legend = document.querySelector("footer");
const wrapEl = document.getElementById("wrap");
let view = MAP_VIEW;
// `open` is who this tab is watching. ONE AT A TIME on purpose: the GPU has
// two channels, and the second is worth leaving free for the panel, another
// phone, or Evan on the Switch - two videos on one phone screen is not a
// feature anybody asked for.
const fam = { cards: new Map(), byName: new Map(), open: null, channels: null };

function setNote(node, text, cls) {
  node.textContent = text || "";
  node.className = node.dataset.base + (cls ? " " + cls : "");
}

function noteNode(cls) {
  const n = el("div", cls);
  n.dataset.base = cls;
  return n;
}

// iOS Safari has no Fullscreen API on ordinary elements - a <video> there has
// its own native call instead. Without that branch the button does nothing at
// all on the one device this tab was built for.
//
// AND A REFUSAL IS SAID OUT LOUD. This swallowed its rejection until a test
// caught it: Chrome answers requestFullscreen with "Permissions check failed"
// whenever the tap did not carry user activation, and an embedded page can be
// refused by policy outright. Both look identical to a person - a button that
// does nothing - which is the one outcome the rest of this page refuses to
// ship. The native video path is tried first as a fallback, because on iOS it
// is the one that actually works.
function goFullscreen(box, video, note) {
  const refused = (why) => note("could not go fullscreen: " + why, "warn");
  // iOS only, and genuinely DIFFERENT machinery rather than a spelling of the
  // same thing: it hands the video to the OS player. webkitRequestFullscreen
  // is merely the old name for the standard call, so retrying it after the
  // standard one has already refused buys nothing and - because the legacy
  // form returns no promise - silently swallows the reason. That is exactly
  // how this went quiet the first time.
  const iosNative = () => {
    if (!video.webkitEnterFullscreen) return false;
    video.webkitEnterFullscreen();
    return true;
  };
  if (box.requestFullscreen) {
    box.requestFullscreen().catch((e) => {
      try { if (iosNative()) return; } catch (e2) { /* fall through to the words */ }
      refused(e.message || e.name || "the browser refused");
    });
    return;
  }
  try { if (iosNative()) return; } catch (e) { /* fall through to the words */ }
  if (video.webkitRequestFullscreen) { video.webkitRequestFullscreen(); return; }
  refused("this browser has no fullscreen for video.");
}

// Cards are built ONCE and updated in place. Rebuilding them on the 5s poll
// would replace the <video> element mid-stream every five seconds, which is a
// black rectangle and a torn-down PeerConnection dressed up as a refresh.
function familyCard(name) {
  let c = fam.cards.get(name);
  if (c) return c;
  const card = el("article", "fcard");
  const head = el("div", "fhead");
  const nm = el("span", "fname", name);
  const chip = el("span", "fchip");
  const combat = el("span", "fchip combat", "in combat");
  const lead = el("span", "fchip leader", "leads");
  head.append(nm, chip, combat, lead);
  const meta = el("div", "fmeta");
  const bar = el("div", "fbar");
  const fill = el("div", "ffill");
  bar.appendChild(fill);
  const hp = el("div", "fline");
  const where = el("div", "fline dim");
  const warn = el("div", "fwarn");
  // WHERE THIS CHARACTER'S BROADCAST LIVES (infra#3110). Empty here and
  // filled by layoutBroadcasts, which owns the one <video> per member and
  // moves it rather than rebuilding it. The card does not create a player of
  // its own - a second handshake for the same path would be a second
  // connection to the same encoder for one picture.
  const stream = el("div", "fstream");
  // THE QUEST LOG, under the name of whoever is carrying it. Its own poll
  // fills these (renderQuestLog below); they stay empty and take no height
  // until /api/questlog answers, so a slow quest read never delays the card.
  const quests = el("div", "fquests");
  const qhead = el("div", "fqhead");
  const qlist = el("div", "fqlist");
  quests.append(qhead, qlist);
  const btn = el("button", "fwatch", "watch");
  const note = noteNode("note");
  const box = el("div", "fplayer");
  // MUTED AND AUTOPLAY ARE BOTH LOAD-BEARING, exactly as they are in the
  // panel: a browser refuses to autoplay audible video and the refusal is
  // silent. playsinline stops iOS taking the video fullscreen on its own -
  // this card has a button for that, so the choice stays with the person.
  // controls is the escape hatch for a browser that still will not autoplay.
  const video = document.createElement("video");
  video.className = "fvid";
  video.muted = true; video.autoplay = true; video.controls = true;
  video.playsInline = true;
  video.setAttribute("muted", ""); video.setAttribute("playsinline", "");
  const btns = el("div", "fpbtns");
  const full = el("button", "fbtn", "fullscreen");
  const stop = el("button", "fbtn", "stop watching");
  btns.append(full, stop);
  const vnote = noteNode("note");
  box.append(video, btns, vnote);
  // ORDER IS THE FEATURE. Name, then who they are, then THEIR stream, then
  // their state, then what they are working on. A viewer reads one character
  // at a time instead of matching a wall of video to a list of names by
  // position, which is what the split layout made them do (infra#3110).
