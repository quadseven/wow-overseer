# A Blackrock Depths guild run whose five seats all have the attunement quest done goes on past
# Gerstahn (wow-overseer issue 783), and a guild member takes the Dark Iron Legacy quest from Franclorn
# Forgewright and carries the Shadowforge Key (issue 811). Five Cave guild members stand at the Blackrock
# Mountain stone with the attunement state set; the quest is the issue's quest 3801.
# Fixes: wow-overseer pulls 1966 and 1625; the commit is 1966.
decree: v1
id: guild-brd-keyed-wing
proves:
  - {repo: quadseven/wow-overseer, issue: 783, criterion: "a BRD guild run whose five seats have the attunement quest done goes through Gerstahn and on, with bosses_done above 1"}
  - {repo: quadseven/wow-overseer, issue: 811, criterion: "a guild member takes quest 3801 from Franclorn and a later line names the member who carries the Shadowforge Key"}
fix: {repo: quadseven/wow-overseer, commit: "9885acc6e64a3776a41950eeebf945aa08c546e9"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 2h
cast:
  - who: guild:Cave:blacksmith
    set: {alive: true, quests: {3801: rewarded, 3802: rewarded}, at: {creature: "Franclorn Forgewright"}}
    ceiling: "only the attunement quest states the run asks for; no level, item or gold"
  - who: guild:Cave:miner
    set: {alive: true, quests: {3801: rewarded, 3802: rewarded}, at: {creature: "Franclorn Forgewright"}}
    ceiling: "only the attunement quest states the run asks for; no level, item or gold"
act:
  - at: 0s
    command: {who: "cast[0]", kind: quest, text: "take 3801"}
observe:
  - name: attunement-quest-states-are-set
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM character_queststatus_rewarded WHERE guid IN (@cast) AND quest IN (3801, 3802)
    expect: {scalar: ">= 2"}
  - name: a-brd-guild-run-went-past-the-first-boss
    role: check
    when: end
    sql: |
      SELECT id, bosses_done FROM overseer_guild_run WHERE keyword = 'blackrock-depths' AND created_at >= @t0 AND bosses_done > 1
    expect: {rows: ">= 1"}
  - name: a-shadowforge-key-exists
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE itemEntry = 11000
    expect: {scalar: ">= 1"}
