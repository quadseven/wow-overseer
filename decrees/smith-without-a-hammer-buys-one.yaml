# A family blacksmith on job craft with no Blacksmith Hammer in bags or bank handles the tool
# material-request: exactly one kind buy row for item 5956 in the town errand table, none while it is held,
# and then a craft event for a worn recipe spell such as Runed Copper Belt, spell 2666 (wow-overseer issues
# 1516 and 1590). Grug is the smith; he stands at a vendor that stocks the hammer.
# The hammer is absent only if the template's Grug lacks it, which the first precondition witnesses.
# Fixes: wow-overseer pulls 1878 (hammer purchase) and 1597 (worn recipes); the commit is 1878.
decree: v1
id: smith-without-a-hammer-buys-one
proves:
  - {repo: quadseven/wow-overseer, issue: 1516, criterion: "the bridge handles the tool material-request for item 5956 and one delivered kind buy row follows within 24 hours"}
  - {repo: quadseven/wow-overseer, issue: 1590, criterion: "a job craft smith with no hammer gets exactly one kind buy row for item 5956 and no second while it is held, then a craft event for a worn recipe spell"}
fix: {repo: quadseven/wow-overseer, commit: "ac6cba9a04590c9d2cdd673dfb07fdf2d5e7d527"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 1h
cast:
  - who: Grug
    set: {alive: true, at: {creature: "Karen Taylor"}}
    ceiling: "nothing granted but position"
act:
  - at: 0s
    roster: {who: Grug, job: "craft smith"}
observe:
  - name: grug-has-no-hammer
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE owner_guid = @Grug AND itemEntry = 5956
    expect: {scalar: "= 0"}
  - name: exactly-one-hammer-buy-row
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_command WHERE kind = 'buy' AND target_name = 'Grug' AND target_arg = '5956' AND created_at >= @t0
    expect: {scalar: "= 1"}
  - name: hammer-is-held-after
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM item_instance WHERE owner_guid = @Grug AND itemEntry = 5956
    expect: {scalar: "= 1"}
  - name: a-craft-event-followed
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_event WHERE character_name = 'Grug' AND last_seen >= @t0 AND kind = 'craft'
    expect: {scalar: ">= 1"}
