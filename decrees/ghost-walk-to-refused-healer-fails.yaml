# A ghost whose walk to a refused healer fails does not wait without a bound: it logs the long hold and
# its bound, then falls back (mod-overseer issue 1284). Zork dies with the corpse at the Gnomeregan side of
# the map and the nearest healer is the one that refuses him; the family keeps the quest job.
# Fix: mod-overseer pull 1289.
decree: v1
id: ghost-walk-to-refused-healer-fails
proves:
  - {repo: quadseven/mod-overseer, issue: 1284, criterion: "a ghost whose walk to a refused healer fails logs the long hold and its bound"}
fix: {repo: quadseven/mod-overseer, commit: "40b1d97a14af4f994c8dc734c51883515c38334e"}
world: {class: lean, image: follow-dev, bridge: "off", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 30m
cast:
  - who: family:zug
    set: {alive: true, at: {areatrigger: 2230}}
    ceiling: "nothing granted but position"
  - who: Zork
    set: {alive: false, corpse_at: {creature: "Oggleflint"}, at: {graveyard: 249}}
    ceiling: "nothing granted; the death is the scenario"
act:
  - at: 0s
    roster: {who: family:zug, job: "quest"}
observe:
  - name: zork-started-dead
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM corpse WHERE guid = @Zork
    expect: {scalar: "= 1"}
  - name: zork-is-alive-again
    role: check
    when: end
    sql: |
      SELECT name FROM characters WHERE guid = @Zork AND health = 0
    expect: {rows: 0}
  - name: no-second-death
    role: check
    when: end
    sql: |
      SELECT character_name, created_at FROM overseer_death WHERE created_at >= @t0 AND character_name = 'Zork'
    expect: {rows: 0}
  - name: no-unbounded-ghost-wait
    role: check
    log: {pattern: "ghost.*(waits|holding).*(refused healer)(?!.*bound)", expect: {count: 0}}
