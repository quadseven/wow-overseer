# A two hour questing session with a before and after of equipment, bags and quest rewards (mod-overseer
# issue 973). The family quests from the Stormwind trainer; the observation is the count of quest_reward
# events and the filled bag slots at the end. Gold for bags is earned in the session, never granted.
# Fix: mod-overseer pull 1062.
decree: v1
id: questing-session-upgrades
proves:
  - {repo: quadseven/mod-overseer, issue: 973, criterion: "ten quest turn-ins in a session and all four bag slots hold bags for every member by the end, given the gold"}
fix: {repo: quadseven/mod-overseer, commit: "526a4a58cc0de3fbe4fe25fd315fa62246573b4e"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 2h
cast:
  - who: family:grug
    set: {alive: true, at: {creature: "Lord Grayson Shadowbreaker"}}
    ceiling: "nothing granted but position"
arrange:
  - group: {members: family:grug, leader: Grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "quest"}
observe:
  - name: family-starts-together
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE guid IN (@cast) AND map_id = 0
    expect: {scalar: "= 5"}
  - name: ten-turn-ins
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_event WHERE kind = 'quest_reward' AND last_seen >= @t0 AND character_name IN ('Grug', 'Ugga', 'Grog', 'Bork', 'Og')
    expect: {scalar: ">= 10"}
  - name: bags-equipped-for-every-member
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM character_inventory WHERE guid IN (@cast) AND bag = 0 AND slot BETWEEN 19 AND 22
    expect: {scalar: ">= 20"}
