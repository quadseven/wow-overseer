# A flight master aim given to a real character is walked, the character's taximask gains the node's bit,
# and a later trip logs 'flies instead' (mod-overseer issue 542). Evidence is the mask before and after,
# never a delivered status. The bit comparison needs a before and after read of one column, which the
# variable vocabulary has no name for yet, so the mask itself is read by the judge's own sampler, not here.
# Stormwind's flight master is the node. No merged fix pull references this
# issue (the caller landed through a private deploy change), so the fix commit is TODO.
decree: v1
id: flight-master-aim-learns-a-node
proves:
  - {repo: quadseven/mod-overseer, issue: 542, criterion: "an aimed flight master errand flips the node bit in taximask and a later trip flies instead of walking"}
fix: {repo: quadseven/wow-overseer, commit: "TODO"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 45m
cast:
  - who: Grug
    set: {alive: true, at: {creature: "Lord Grayson Shadowbreaker"}}
    ceiling: "nothing granted but position"
act:
  - at: 0s
    roster: {who: Grug, job: "quest"}
observe:
  - name: grug-starts-in-stormwind
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_snapshot WHERE guid = @cast0 AND map_id = 0
    expect: {scalar: "= 1"}
  - name: flight-aim-was-issued
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_roster WHERE name = 'Grug' AND travel_npc LIKE 'flight master:%'
    expect: {scalar: ">= 1"}
  - name: no-travel-refusal-struck-the-node
    role: check
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_travel_refusal WHERE name = 'Grug' AND refused_at >= @t0
    expect: {scalar: "= 0"}
