# Scope note: only the ten roster characters can be cast by name, so this decree runs the raid with
# ten seats. The 40-seat case in the issue is not representable here; the check is the per-seat behaviour.
# The seats come from overseer_raid_seat, which the bridge writes from an operator order, so the first
# precondition witnesses them: a world with no seats is INVALID, never a pass.
# Majordomo Executus is not a creature spawn row (a script summons him once the five bosses are down), so
# the family is placed at Golemagg and the run must reach him. At the encounter, casters hold on the Magic
# Reflection shield (issue 767) including for an area spell (issue 1659), and no raider dies to reflected
# damage. The Majordomo precondition fails the run as INVALID if the encounter is never reached.
# Fix: wow-overseer pull 1663 (area-target reflect hold).
decree: v1
id: majordomo-reflect-hold
proves:
  - {repo: quadseven/wow-overseer, issue: 767, criterion: "casters hold on the reflection shield, no raider dies to reflected damage, and the tank re-takes adds after Teleport Target"}
  - {repo: quadseven/wow-overseer, issue: 1659, criterion: "no raider dies to reflected damage from an area spell and the holding line appears for area targeting"}
fix: {repo: quadseven/wow-overseer, commit: "e40c8878685ccac66320288a253eb4c3b0d7ac18"}
world: {class: lean, image: follow-dev, bridge: "on", random_bots: 0, config: {}}
runs: {control: 3, treatment: 3}
duration: 2h
cast:
  - who: family:grug
    set: {alive: true, at: {creature: "Golemagg the Incinerator"}}
    ceiling: "nothing granted but position"
arrange:
  - instance: {map: "Molten Core", as: mc, bind: family:grug}
  - group: {members: family:grug, leader: Grug}
act:
  - at: 0s
    roster: {who: family:grug, job: "raid:moltencore"}
observe:
  - name: seats-were-written
    role: precondition
    when: start
    sql: |
      SELECT COUNT(*) FROM overseer_raid_seat WHERE family IN ('Grug', 'Zug')
    expect: {scalar: ">= 5"}
  - name: majordomo-encounter-reached
    role: precondition
    when: end
    sql: |
      SELECT COUNT(*) FROM overseer_dungeon_run_event WHERE family = 'Grug' AND created_at >= @t0 AND kind = 'boss' AND detail LIKE '%Majordomo%'
    expect: {scalar: ">= 1"}
  - name: no-raider-died-to-reflected-damage
    role: check
    when: end
    sql: |
      SELECT character_name, killer_name FROM overseer_death WHERE created_at >= @t0 AND map = 409 AND killer_name LIKE '%Flamewaker%'
    expect: {rows: 0}
  - name: no-reflected-damage-death-line
    role: check
    log: {pattern: "died to (reflected|its own) (damage|spell)", expect: {count: 0}}
