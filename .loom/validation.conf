# Use the repository's CI-backed setup: pinned ruff, managed Python and
# tests/requirements.txt. Bare ambient Python may lack the SQL parser even
# while CI is green; the guard must not become weaker to hide that mismatch.
# The script reads check.yml, so the lane and CI do not keep separate lists.
interpreter: python3
submodules: yes
check: bash scripts/check-locally.sh all
