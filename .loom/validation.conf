# The lane pre-PR check: the steps CI runs (.github/workflows/check.yml: the lint
# job's ruff check and format check, then the unittest job).
# Inside the lane sandbox the tests that serve a fake site on localhost skip
# (tests/sandbox_caps.py); CI runs them.
# The suite runs through CI's own parallel runner, one batch of modules per
# core (#1290), not `unittest discover` on one core (#1434);
# tests/test_unittest_parallel.py fails if the two runners drift apart. The
# lane has no uv step, so tests stub pymysql themselves when it is missing.
interpreter: python3
submodules: yes
check: ruff check . && ruff format --check . && python3 -B .github/scripts/compile_check.py --min-python 3.12 && python3 -B .github/scripts/unittest_parallel.py
