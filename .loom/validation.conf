# The lane pre-PR check: the steps CI runs (.github/workflows/check.yml, unittest job).
# Inside the lane sandbox the tests that serve a fake site on localhost skip
# (tests/sandbox_caps.py); CI runs them.
interpreter: python3
submodules: yes
check: python3 -B .github/scripts/compile_check.py --min-python 3.12 && python3 -B -m unittest discover -s tests -p 'test_*.py'
